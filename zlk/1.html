<!DOCTYPE html>
<html lang="zh-CN" data-theme="paper">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>原神时间表</title>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <style>
        /* ===== 主题变量（与公式页面一致） ===== */
        html[data-theme="paper"] {
            --bg: #f7f3ec;
            --surface: #fffcf7;
            --surface-2: #f2ece0;
            --ink: #2a2520;
            --ink-2: #7a6e5e;
            --ink-3: #a89880;
            --accent: #9a3412;
            --rule: #e8dfd0;
            --rule-2: #d9cdb8;
            --zebra: #fdfaf5;
            --hover: #fdf0e4;
            --shadow: rgba(0,0,0,0.06);
        }
        html[data-theme="dark"] {
            --bg: #16181d;
            --surface: #1e2128;
            --surface-2: #262a33;
            --ink: #e8eaed;
            --ink-2: #a5adba;
            --ink-3: #6b7280;
            --accent: #f0a05a;
            --rule: #2d323c;
            --rule-2: #3a4150;
            --zebra: #21252c;
            --hover: #2a2f3a;
            --shadow: rgba(0,0,0,0.35);
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
        }
        body {
            background: var(--bg);
            color: var(--ink);
            min-height: 100vh;
            padding: 56px 24px 96px;
            transition: background-color 0.25s, color 0.25s;
        }
        /* ===== 主题切换 ===== */
        .theme-switch {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 100;
            display: flex;
            gap: 8px;
            background: var(--surface);
            border: 1px solid var(--rule-2);
            border-radius: 999px;
            padding: 6px 8px;
            box-shadow: 0 4px 16px var(--shadow);
            transition: background-color 0.25s, border-color 0.25s;
        }
        .theme-btn {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            border: 2px solid transparent;
            cursor: pointer;
            transition: transform 0.15s, border-color 0.15s;
            padding: 0;
            outline: none;
        }
        .theme-btn:hover { transform: scale(1.12); }
        .theme-btn.active { border-color: var(--accent); }
        .theme-btn[data-theme="paper"] { background: linear-gradient(135deg, #f7f3ec 50%, #d9cdb8 50%); }
        .theme-btn[data-theme="dark"]  { background: linear-gradient(135deg, #1e2128 50%, #f0a05a 50%); }

        /* ===== 页面标题 ===== */
        .main-title {
            text-align: center;
            font-family: Georgia, "Noto Serif SC", "Songti SC", serif;
            font-size: clamp(28px, 5vw, 42px);
            font-weight: 700;
            color: var(--ink);
            margin-bottom: 32px;
            letter-spacing: 3px;
            transition: color 0.25s;
        }

        /* ===== 主体容器 ===== */
        .time-axis-wrap {
            max-width: 680px;
            margin: 0 auto;
            background: var(--surface);
            padding: 30px;
            border-radius: 16px;
            border: 1px solid var(--rule-2);
            box-shadow: 0 8px 30px var(--shadow);
            transition: background-color 0.25s, border-color 0.25s, box-shadow 0.25s;
        }

        /* ===== 贡献者区域 ===== */
        .contributor-block {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            margin-bottom: 24px;
            width: 100%;
        }
        .contributor-label {
            font-size: 18px;
            color: var(--ink-2);
            text-align: center;
            transition: color 0.25s;
        }
        .contributor-row {
            display: flex;
            gap: 60px;
            justify-content: center;
        }
        .person-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        .avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: 1px solid var(--rule-2);
            object-fit: cover;
            background: var(--surface-2);
            transition: border-color 0.25s, background-color 0.25s;
        }
        .person-name {
            font-size: 17px;
            color: var(--ink);
            text-align: center;
            transition: color 0.25s;
        }
        .person-name span {
            color: var(--accent);
            transition: color 0.25s;
        }

        /* ===== 按钮组 ===== */
        .btn-group {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-bottom: 24px;
        }
        .btn-desc {
            padding: 8px 22px;
            background: var(--surface-2);
            border: 1px solid var(--rule-2);
            border-radius: 8px;
            color: var(--accent);
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            transition: background-color 0.2s, border-color 0.2s, color 0.2s, opacity 0.2s;
        }
        .btn-desc:hover {
            background: var(--hover);
        }
        .btn-desc:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        /* ===== 倒计时 ===== */
        .countdown-box {
            text-align: center;
            padding: 16px;
            background: var(--surface-2);
            border: 1px solid var(--rule);
            border-radius: 10px;
            margin-bottom: 28px;
            transition: background-color 0.25s, border-color 0.25s;
        }
        .countdown-title {
            font-size: 16px;
            margin-bottom: 10px;
            color: var(--ink-2);
            transition: color 0.25s;
        }
        .countdown-text {
            font-size: 24px;
            color: var(--accent);
            letter-spacing: 2px;
            font-weight: 700;
            transition: color 0.25s;
        }

        /* ===== 时间轴列表 ===== */
        .timeline-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .timeline-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: var(--surface-2);
            border-radius: 8px;
            border: 1px solid var(--rule);
            border-left: 3px solid var(--accent);
            box-shadow: 0 2px 6px var(--shadow);
            transition: background-color 0.25s, border-color 0.25s, opacity 0.25s, box-shadow 0.25s;
        }
        .timeline-item.passed {
            border-left: 3px solid var(--rule-2);
            opacity: 0.7;
            box-shadow: none;
        }
        .timeline-name {
            font-size: 15px;
            color: var(--ink);
            transition: color 0.25s;
        }
        .timeline-date {
            font-size: 15px;
            color: var(--ink-2);
            transition: color 0.25s;
        }
        .empty-tip {
            text-align: center;
            padding: 20px;
            color: var(--ink-3);
            transition: color 0.25s;
        }

        /* ===== 弹窗 ===== */
        .modal-mask {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 999;
        }
        .modal-box {
            width: 90%;
            max-width: 520px;
            background: var(--surface);
            padding: 26px;
            border-radius: 12px;
            border: 1px solid var(--rule-2);
            box-shadow: 0 12px 40px var(--shadow);
            transition: background-color 0.25s, border-color 0.25s;
        }
        .modal-title {
            font-size: 18px;
            margin-bottom: 16px;
            color: var(--accent);
            transition: color 0.25s;
        }
        .modal-content {
            font-size: 15px;
            line-height: 1.7;
            color: var(--ink);
            transition: color 0.25s;
        }
        .modal-close {
            margin-top: 20px;
            padding: 7px 20px;
            background: var(--surface-2);
            border: 1px solid var(--rule-2);
            border-radius: 6px;
            color: var(--ink);
            cursor: pointer;
            transition: background-color 0.2s, border-color 0.2s, color 0.2s;
        }
        .modal-close:hover {
            background: var(--hover);
        }

        /* ===== 移动端适配 ===== */
        @media screen and (max-width: 600px) {
            body {
                padding: 72px 12px 48px;
            }
            .main-title {
                font-size: 24px;
                margin-bottom: 16px;
            }
            .time-axis-wrap {
                padding: 20px 14px;
            }
            .avatar {
                width: 36px;
                height: 36px;
            }
            .contributor-label {
                font-size: 16px;
            }
            .person-name {
                font-size: 15px;
            }
            .contributor-row {
                gap: 40px;
            }
            .btn-group {
                flex-wrap: wrap;
            }
            .countdown-title {
                font-size: 14px;
            }
            .countdown-text {
                font-size: 18px;
            }
            .timeline-item {
                padding: 10px 12px;
                flex-direction: column;
                align-items: flex-start;
                gap: 4px;
            }
            .timeline-name, .timeline-date {
                font-size: 14px;
            }
            .modal-box {
                padding: 18px;
            }
            .theme-switch { top: 12px; right: 12px; padding: 4px 6px; }
            .theme-btn { width: 22px; height: 22px; }
        }
    </style>
</head>
<body>
    <!-- 主题切换按钮 -->
    <div class="theme-switch" role="group" aria-label="背景配色">
        <button class="theme-btn active" data-theme="paper" title="暖色纸张（原色）" aria-label="暖色纸张"></button>
        <button class="theme-btn" data-theme="dark" title="暗色模式（黑色）" aria-label="暗色模式"></button>
    </div>

    <h1 class="main-title">原神时间表</h1>
    <div class="time-axis-wrap" id="captureWrap">
        <!-- 贡献者区域 -->
        <div class="contributor-block">
            <div class="contributor-label">贡献者</div>
            <div class="contributor-row">
                <div class="person-card">
                    <img class="avatar" src="zj.png" alt="班长头像">
                    <div class="person-name"><span>幼儿园大班班长</span></div>
                </div>
                <div class="person-card">
                    <img class="avatar" src="jy.png" alt="金鱼头像">
                    <div class="person-name"><span>金鱼</span></div>
                </div>
            </div>
        </div>
        <div class="btn-group">
            <button class="btn-desc" id="openModalBtn">查看说明</button>
            <button class="btn-desc" id="downloadImgBtn">下载时间点图片</button>
        </div>
        <div class="countdown-box">
            <div class="countdown-title">距离下一版本时间点倒计时</div>
            <div class="countdown-text" id="countdownDom">加载中...</div>
        </div>
        <div class="timeline-list" id="timelineList"></div>
    </div>
    <!-- 说明弹窗 -->
    <div class="modal-mask" id="descModal">
        <div class="modal-box">
            <h3 class="modal-title">时间轴说明</h3>
            <div class="modal-content">
                1. 本时间轴为原神7.0~7.8全部版本测试、前瞻、创体、开服时间节点<br>
                2. 倒计时仅反映到达该天凌晨的剩余时间，而非到达具体的开启时间<br>
                3. 以上时间为按照以往来做的推算，若有特殊变动，请以变动为准<br>
                4. 若该角色无v5测试版本，则v4则会在v3的同周的周四进行<br>
                5. 节点结束后会保留显示2天，之后自动隐藏；在此感谢金鱼提供的帮助<br>
                6. 支持下载当前页面时间轴为png图片
            </div>
            <button class="modal-close" id="closeModalBtn">关闭</button>
        </div>
    </div>

    <script>
    // ============ 全部逻辑包在 DOMContentLoaded 内，确保 DOM 就绪 ============
    document.addEventListener('DOMContentLoaded', function () {

        /* ---------- 1. 主题切换 ---------- */
        (function initTheme() {
            var html = document.documentElement;
            var buttons = document.querySelectorAll('.theme-btn');
            var saved = null;
            try { saved = localStorage.getItem('gensri-theme'); } catch (e) { saved = null; }
            if (saved && ['paper', 'dark'].indexOf(saved) !== -1) {
                html.setAttribute('data-theme', saved);
                for (var i = 0; i < buttons.length; i++) {
                    buttons[i].classList.toggle('active', buttons[i].dataset.theme === saved);
                }
            }
            for (var j = 0; j < buttons.length; j++) {
                (function (btn) {
                    btn.addEventListener('click', function () {
                        var theme = btn.dataset.theme;
                        html.setAttribute('data-theme', theme);
                        for (var k = 0; k < buttons.length; k++) {
                            buttons[k].classList.toggle('active', buttons[k] === btn);
                        }
                        try { localStorage.setItem('gensri-theme', theme); } catch (e) {}
                    });
                })(buttons[j]);
            }
        })();

        /* ---------- 2. 时间节点数据 ---------- */
        var timeNodeList = [
            {name:"7.0版本前瞻", date:"2026-07-31"},
            {name:"7.0版本创体", date:"2026-08-07"},
            {name:"7.0版本开启", date:"2026-08-12"},
            {name:"7.1版本v1测试", date:"2026-08-12"},
            {name:"7.1版本v2测试", date:"2026-08-17"},
            {name:"7.1版本v3测试", date:"2026-08-24"},
            {name:"7.1版本v4测试", date:"2026-08-31"},
            {name:"7.1版本v5测试", date:"2026-09-03"},
            {name:"7.1版本前瞻", date:"2026-09-11"},
            {name:"7.1版本创体", date:"2026-09-18"},
            {name:"7.1版本开启", date:"2026-09-23"},
            {name:"7.2版本v1测试", date:"2026-09-23"},
            {name:"7.2版本v2测试", date:"2026-09-28"},
            {name:"7.2版本v3测试", date:"2026-10-05"},
            {name:"7.2版本v4测试", date:"2026-10-12"},
            {name:"7.2版本v5测试", date:"2026-10-15"},
            {name:"7.2版本前瞻", date:"2026-10-23"},
            {name:"7.2版本创体", date:"2026-10-30"},
            {name:"7.2版本开启", date:"2026-11-04"},
            {name:"7.3版本v1测试", date:"2026-11-04"},
            {name:"7.3版本v2测试", date:"2026-11-09"},
            {name:"7.3版本v3测试", date:"2026-11-16"},
            {name:"7.3版本v4测试", date:"2026-11-23"},
            {name:"7.3版本v5测试", date:"2026-11-26"},
            {name:"7.3版本前瞻", date:"2026-12-04"},
            {name:"7.3版本创体", date:"2026-12-11"},
            {name:"7.3版本开启", date:"2026-12-16"},
            {name:"7.4版本v1测试", date:"2026-12-16"},
            {name:"7.4版本v2测试", date:"2026-12-21"},
            {name:"7.4版本v3测试", date:"2026-12-28"},
            {name:"7.4版本v4测试", date:"2027-01-04"},
            {name:"7.4版本v5测试", date:"2027-01-07"},
            {name:"7.4版本前瞻", date:"2027-01-15"},
            {name:"7.4版本创体", date:"2027-01-22"},
            {name:"7.4版本开启", date:"2027-01-27"},
            {name:"7.5版本v1测试", date:"2027-01-27"},
            {name:"7.5版本v2测试", date:"2027-02-01"},
            {name:"7.5版本v3测试", date:"2027-02-08"},
            {name:"7.5版本v4测试", date:"2027-02-15"},
            {name:"7.5版本v5测试", date:"2027-02-18"},
            {name:"7.5版本前瞻", date:"2027-02-26"},
            {name:"7.5版本创体", date:"2027-03-05"},
            {name:"7.5版本开启", date:"2027-03-10"},
            {name:"7.6版本v1测试", date:"2027-03-10"},
            {name:"7.6版本v2测试", date:"2027-03-15"},
            {name:"7.6版本v3测试", date:"2027-03-22"},
            {name:"7.6版本v4测试", date:"2027-03-29"},
            {name:"7.6版本v5测试", date:"2027-04-01"},
            {name:"7.6版本前瞻", date:"2027-04-09"},
            {name:"7.6版本创体", date:"2027-04-16"},
            {name:"7.6版本开启", date:"2027-04-21"},
            {name:"7.7版本v1测试", date:"2027-04-21"},
            {name:"7.7版本v2测试", date:"2027-04-26"},
            {name:"7.7版本v3测试", date:"2027-05-03"},
            {name:"7.7版本v4测试", date:"2027-05-10"},
            {name:"7.7版本v5测试", date:"2027-05-13"},
            {name:"7.7版本前瞻", date:"2027-05-21"},
            {name:"7.7版本创体", date:"2027-05-28"},
            {name:"7.7版本开启", date:"2027-06-02"},
            {name:"7.8版本v1测试", date:"2027-06-02"},
            {name:"7.8版本v2测试", date:"2027-06-07"},
            {name:"7.8版本v3测试", date:"2027-06-14"},
            {name:"7.8版本v4测试", date:"2027-06-21"},
            {name:"7.8版本v5测试", date:"2027-06-24"},
            {name:"7.8版本前瞻", date:"2027-07-02"},
            {name:"7.8版本创体", date:"2027-07-09"},
            {name:"7.8版本开启", date:"2027-07-14"}
        ];

        var TWO_DAY_MS = 2 * 24 * 60 * 60 * 1000;
        var timelineWrap = document.getElementById("timelineList");
        var captureWrap = document.getElementById("captureWrap");
        var downloadBtn = document.getElementById("downloadImgBtn");
        var countdownDom = document.getElementById("countdownDom");
        var modal = document.getElementById("descModal");
        var openModalBtn = document.getElementById("openModalBtn");
        var closeModalBtn = document.getElementById("closeModalBtn");

        /* ---------- 3. 渲染时间轴 ---------- */
        function renderTimeline() {
            if (!timelineWrap) return;
            var nowTime = new Date().getTime();
            var showList = timeNodeList.filter(function (item) {
                var target = new Date(item.date).getTime();
                var expireHide = target + TWO_DAY_MS;
                return nowTime < expireHide;
            });
            var htmlStr = "";
            if (showList.length === 0) {
                htmlStr = '<div class="empty-tip">暂无后续时间节点</div>';
            } else {
                showList.forEach(function (item) {
                    var target = new Date(item.date).getTime();
                    var isPassed = nowTime >= target;
                    var passClass = isPassed ? 'passed' : '';
                    htmlStr += '<div class="timeline-item ' + passClass + '">' +
                                   '<div class="timeline-name">' + item.name + '</div>' +
                                   '<div class="timeline-date">' + item.date + '</div>' +
                               '</div>';
                });
            }
            timelineWrap.innerHTML = htmlStr;
        }

        /* ---------- 4. 倒计时 ---------- */
        function getNextTargetTime() {
            var nowTime = new Date().getTime();
            var futureNodes = timeNodeList.filter(function (item) {
                var target = new Date(item.date).getTime();
                return target > nowTime;
            });
            if (futureNodes.length === 0) return null;
            return futureNodes[0];
        }

        function updateCountdown() {
            renderTimeline();
            if (!countdownDom) return;
            var targetNode = getNextTargetTime();
            if (!targetNode) {
                countdownDom.innerText = "所有时间节点已全部过期";
                return;
            }
            var now = new Date().getTime();
            var targetTime = new Date(targetNode.date).getTime();
            var diff = targetTime - now;
            var day = Math.floor(diff / (1000 * 60 * 60 * 24));
            diff = diff % (1000 * 60 * 60 * 24);
            var hour = Math.floor(diff / (1000 * 60 * 60));
            diff = diff % (1000 * 60 * 60);
            var minute = Math.floor(diff / (1000 * 60));
            diff = diff % (1000 * 60);
            var second = Math.floor(diff / 1000);
            countdownDom.innerText = targetNode.name + ' | ' + day + '天 ' + hour + '时 ' + minute + '分 ' + second + '秒';
        }

        /* ---------- 5. 下载图片 ---------- */
        if (downloadBtn) {
            downloadBtn.addEventListener('click', function () {
                if (typeof html2canvas !== 'function') {
                    alert("html2canvas 未加载，无法生成图片");
                    return;
                }
                downloadBtn.disabled = true;
                downloadBtn.innerText = "生成中…";
                html2canvas(captureWrap, {
                    useCORS: true,
                    backgroundColor: null,
                    scale: 2
                }).then(function (canvas) {
                    var link = document.createElement('a');
                    link.download = "原神时间表.png";
                    link.href = canvas.toDataURL("image/png");
                    link.click();
                }).catch(function (e) {
                    alert("图片生成失败：" + e.message);
                }).then(function () {
                    downloadBtn.disabled = false;
                    downloadBtn.innerText = "下载时间点图片";
                });
            });
        }

        /* ---------- 6. 弹窗 ---------- */
        if (openModalBtn && modal) {
            openModalBtn.addEventListener('click', function () {
                modal.style.display = "flex";
            });
        }
        if (closeModalBtn && modal) {
            closeModalBtn.addEventListener('click', function () {
                modal.style.display = "none";
            });
        }
        if (modal) {
            modal.addEventListener('click', function (e) {
                if (e.target === modal) modal.style.display = "none";
            });
        }

        /* ---------- 7. 启动 ---------- */
        updateCountdown();
        setInterval(updateCountdown, 1000);
    });
    </script>
</body>
</html>
