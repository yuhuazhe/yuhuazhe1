<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>原神时间表</title>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
        }
        
        html, body {
            height: 100%;
            margin: 0;
            overflow: hidden; /* 禁止整页滚动 */
        }

        body {
            /* ===== 底图（叠加 35% 黑色遮罩，让背景稍稍变暗） ===== */
            background-color: #16181d;
            background-image: 
                linear-gradient(rgba(0, 0, 0, 0.35), rgba(0, 0, 0, 0.35)),
                url("背景2.jpg");
            background-position: center;
            background-size: cover;
            background-repeat: no-repeat;
            background-attachment: fixed;
            
            color: #ffffff;
            display: flex;
            justify-content: center;
            height: 100vh;
            height: 100dvh;
        }

        /* 全局文字阴影，防止亮色背景下看不清 */
        h1, p, div, button, a, span {
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.9), 0 0 6px rgba(0, 0, 0, 0.6);
        }

        /* ===== 布局容器 ===== */
        .layout-wrapper {
            width: 100%;
            max-width: 680px;
            height: 100%;
            display: flex;
            flex-direction: column;
            padding: 30px 24px 30px 24px;
        }

        /* ===== 页面标题（固定） ===== */
        .main-title {
            text-align: center;
            font-family: Georgia, "Noto Serif SC", "Songti SC", serif;
            font-size: clamp(28px, 5vw, 42px);
            font-weight: 700;
            color: #60a5fa; /* 亮蓝色 */
            margin-bottom: 20px;
            letter-spacing: 3px;
            flex-shrink: 0;
        }

        /* ===== 主体容器（全透明框架，内部包含固定区和滑动区） ===== */
        .time-axis-wrap {
            flex: 1;
            min-height: 0; /* 关键：允许 flex 子项缩小以触发滚动 */
            display: flex;
            flex-direction: column;
            background: transparent;
            padding: 20px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        /* ===== 图一部分：固定区 ===== */
        .fixed-top-part {
            flex-shrink: 0; /* 不参与压缩 */
        }

        /* 贡献者区域 */
        .contributor-block {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            margin-bottom: 20px;
            width: 100%;
        }
        .contributor-label {
            font-size: 18px;
            color: #93c5fd;
            text-align: center;
        }
        .contributor-row {
            display: flex;
            gap: 60px;
            justify-content: center;
        }
        .person-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        .avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.3);
            object-fit: cover;
            background: transparent;
        }
        .person-name {
            font-size: 17px;
            color: #e2e8f0;
            text-align: center;
        }
        .person-name span {
            color: #60a5fa;
            font-weight: bold;
        }

        /* 按钮组 */
        .btn-group {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-bottom: 20px;
        }
        .btn-desc {
            padding: 8px 22px;
            background: transparent;
            border: 1px solid rgba(96, 165, 250, 0.6);
            border-radius: 8px;
            color: #60a5fa;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            transition: all 0.2s;
        }
        .btn-desc:hover {
            background: rgba(96, 165, 250, 0.15);
            border-color: #60a5fa;
        }
        .btn-desc:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* 倒计时 */
        .countdown-box {
            text-align: center;
            padding: 16px;
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .countdown-title {
            font-size: 16px;
            margin-bottom: 10px;
            color: #93c5fd;
        }
        .countdown-text {
            font-size: 24px;
            color: #38bdf8;
            letter-spacing: 2px;
            font-weight: 700;
        }

        /* ===== 图二部分：内部滑动区 ===== */
        .timeline-list {
            flex: 1; /* 占满剩余高度 */
            min-height: 0;
            overflow-y: auto; /* 开启内部滑动 */
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding-right: 5px; /* 滚动条留白 */
            
            /* 隐藏滚动条 */
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .timeline-list::-webkit-scrollbar {
            display: none;
        }

        .timeline-item {
            flex-shrink: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: transparent;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-left: 3px solid #60a5fa;
            transition: all 0.25s;
        }
        .timeline-item.passed {
            border-left: 3px solid rgba(255, 255, 255, 0.2);
            opacity: 0.6;
        }
        .timeline-name {
            font-size: 15px;
            color: #e2e8f0;
        }
        .timeline-date {
            font-size: 15px;
            color: #60a5fa;
            font-weight: 600;
        }
        .empty-tip {
            text-align: center;
            padding: 20px;
            color: #93c5fd;
        }

        /* ===== 弹窗（深色半透明保护阅读） ===== */
        .modal-mask {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 999;
            backdrop-filter: blur(4px);
        }
        .modal-box {
            width: 90%;
            max-width: 520px;
            background: rgba(18, 20, 26, 0.85);
            padding: 26px;
            border-radius: 12px;
            border: 1px solid rgba(96, 165, 250, 0.3);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
        }
        .modal-title {
            font-size: 18px;
            margin-bottom: 16px;
            color: #38bdf8;
        }
        .modal-content {
            font-size: 15px;
            line-height: 1.7;
            color: #e2e8f0;
        }
        .modal-close {
            margin-top: 20px;
            padding: 7px 20px;
            background: transparent;
            border: 1px solid #60a5fa;
            border-radius: 6px;
            color: #60a5fa;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }
        .modal-close:hover {
            background: rgba(96, 165, 250, 0.15);
        }

        /* ===== 移动端适配 ===== */
        @media screen and (max-width: 600px) {
            .layout-wrapper {
                padding: 20px 12px 20px 12px;
            }
            .main-title {
                font-size: 24px;
                margin-bottom: 14px;
            }
            .time-axis-wrap {
                padding: 15px;
            }
            .avatar {
                width: 36px;
                height: 36px;
            }
            .contributor-label {
                font-size: 16px;
            }
            .person-name {
                font-size: 15px;
            }
            .contributor-row {
                gap: 40px;
            }
            .btn-group {
                flex-wrap: wrap;
            }
            .countdown-box {
                padding: 12px;
            }
            .countdown-title {
                font-size: 14px;
            }
            .countdown-text {
                font-size: 18px;
            }
            .timeline-item {
                padding: 10px 12px;
                flex-direction: column;
                align-items: flex-start;
                gap: 4px;
            }
            .timeline-name, .timeline-date {
                font-size: 14px;
            }
            .modal-box {
                padding: 18px;
            }
        }
    </style>
</head>
<body>
    <div class="layout-wrapper">
        <h1 class="main-title">原神时间表</h1>
        
        <!-- 核心框体：内部包含固定区和滑动区 -->
        <div class="time-axis-wrap" id="captureWrap">
            
            <!-- 图一部分：固定区 -->
            <div class="fixed-top-part">
                <!-- 贡献者区域 -->
                <div class="contributor-block">
                    <div class="contributor-label">贡献者</div>
                    <div class="contributor-row">
                        <div class="person-card">
                            <img class="avatar" src="zj.png" alt="班长头像" onerror="this.style.display='none'">
                            <div class="person-name"><span>幼儿园大班班长</span></div>
                        </div>
                        <div class="person-card">
                            <img class="avatar" src="jy.png" alt="金鱼头像" onerror="this.style.display='none'">
                            <div class="person-name"><span>金鱼</span></div>
                        </div>
                    </div>
                </div>
                <div class="btn-group">
                    <button class="btn-desc" id="openModalBtn">查看说明</button>
                    <button class="btn-desc" id="downloadImgBtn">下载时间点图片</button>
                </div>
                <div class="countdown-box">
                    <div class="countdown-title">距离下一版本时间点倒计时</div>
                    <div class="countdown-text" id="countdownDom">加载中...</div>
                </div>
            </div>

            <!-- 图二部分：内部滑动区 -->
            <div class="timeline-list" id="timelineList"></div>
            
        </div>
    </div>
    
    <!-- 说明弹窗 -->
    <div class="modal-mask" id="descModal">
        <div class="modal-box">
            <h3 class="modal-title">时间轴说明</h3>
            <div class="modal-content">
                1. 本时间轴为原神7.0~7.8全部版本测试、前瞻、创体、开服时间节点<br>
                2. 倒计时仅反映到达该天凌晨的剩余时间，而非到达具体的开启时间<br>
                3. 以上时间为按照以往来做的推算，若有特殊变动，请以变动为准<br>
                4. 若该角色无v5测试版本，则v4则会在v3的同周的周四进行<br>
                5. 节点结束后会保留显示2天，之后自动隐藏；在此感谢金鱼提供的帮助<br>
                6. 支持下载当前页面时间轴为png图片
            </div>
            <button class="modal-close" id="closeModalBtn">关闭</button>
        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', function () {

        /* ---------- 1. 时间节点数据 ---------- */
        var timeNodeList = [
            {name:"7.0版本前瞻", date:"2026-07-31"},
            {name:"7.0版本创体", date:"2026-08-07"},
            {name:"7.0版本开启", date:"2026-08-12"},
            {name:"7.1版本v1测试", date:"2026-08-12"},
            {name:"7.1版本v2测试", date:"2026-08-17"},
            {name:"7.1版本v3测试", date:"2026-08-24"},
            {name:"7.1版本v4测试", date:"2026-08-31"},
            {name:"7.1版本v5测试", date:"2026-09-03"},
            {name:"7.1版本前瞻", date:"2026-09-11"},
            {name:"7.1版本创体", date:"2026-09-18"},
            {name:"7.1版本开启", date:"2026-09-23"},
            {name:"7.2版本v1测试", date:"2026-09-23"},
            {name:"7.2版本v2测试", date:"2026-09-28"},
            {name:"7.2版本v3测试", date:"2026-10-05"},
            {name:"7.2版本v4测试", date:"2026-10-12"},
            {name:"7.2版本v5测试", date:"2026-10-15"},
            {name:"7.2版本前瞻", date:"2026-10-23"},
            {name:"7.2版本创体", date:"2026-10-30"},
            {name:"7.2版本开启", date:"2026-11-04"},
            {name:"7.3版本v1测试", date:"2026-11-04"},
            {name:"7.3版本v2测试", date:"2026-11-09"},
            {name:"7.3版本v3测试", date:"2026-11-16"},
            {name:"7.3版本v4测试", date:"2026-11-23"},
            {name:"7.3版本v5测试", date:"2026-11-26"},
            {name:"7.3版本前瞻", date:"2026-12-04"},
            {name:"7.3版本创体", date:"2026-12-11"},
            {name:"7.3版本开启", date:"2026-12-16"},
            {name:"7.4版本v1测试", date:"2026-12-16"},
            {name:"7.4版本v2测试", date:"2026-12-21"},
            {name:"7.4版本v3测试", date:"2026-12-28"},
            {name:"7.4版本v4测试", date:"2027-01-04"},
            {name:"7.4版本v5测试", date:"2027-01-07"},
            {name:"7.4版本前瞻", date:"2027-01-15"},
            {name:"7.4版本创体", date:"2027-01-22"},
            {name:"7.4版本开启", date:"2027-01-27"},
            {name:"7.5版本v1测试", date:"2027-01-27"},
            {name:"7.5版本v2测试", date:"2027-02-01"},
            {name:"7.5版本v3测试", date:"2027-02-08"},
            {name:"7.5版本v4测试", date:"2027-02-15"},
            {name:"7.5版本v5测试", date:"2027-02-18"},
            {name:"7.5版本前瞻", date:"2027-02-26"},
            {name:"7.5版本创体", date:"2027-03-05"},
            {name:"7.5版本开启", date:"2027-03-10"},
            {name:"7.6版本v1测试", date:"2027-03-10"},
            {name:"7.6版本v2测试", date:"2027-03-15"},
            {name:"7.6版本v3测试", date:"2027-03-22"},
            {name:"7.6版本v4测试", date:"2027-03-29"},
            {name:"7.6版本v5测试", date:"2027-04-01"},
            {name:"7.6版本前瞻", date:"2027-04-09"},
            {name:"7.6版本创体", date:"2027-04-16"},
            {name:"7.6版本开启", date:"2027-04-21"},
            {name:"7.7版本v1测试", date:"2027-04-21"},
            {name:"7.7版本v2测试", date:"2027-04-26"},
            {name:"7.7版本v3测试", date:"2027-05-03"},
            {name:"7.7版本v4测试", date:"2027-05-10"},
            {name:"7.7版本v5测试", date:"2027-05-13"},
            {name:"7.7版本前瞻", date:"2027-05-21"},
            {name:"7.7版本创体", date:"2027-05-28"},
            {name:"7.7版本开启", date:"2027-06-02"},
            {name:"7.8版本v1测试", date:"2027-06-02"},
            {name:"7.8版本v2测试", date:"2027-06-07"},
            {name:"7.8版本v3测试", date:"2027-06-14"},
            {name:"7.8版本v4测试", date:"2027-06-21"},
            {name:"7.8版本v5测试", date:"2027-06-24"},
            {name:"7.8版本前瞻", date:"2027-07-02"},
            {name:"7.8版本创体", date:"2027-07-09"},
            {name:"7.8版本开启", date:"2027-07-14"}
        ];

        var TWO_DAY_MS = 2 * 24 * 60 * 60 * 1000;
        var timelineWrap = document.getElementById("timelineList");
        var captureWrap = document.getElementById("captureWrap");
        var downloadBtn = document.getElementById("downloadImgBtn");
        var countdownDom = document.getElementById("countdownDom");
        var modal = document.getElementById("descModal");
        var openModalBtn = document.getElementById("openModalBtn");
        var closeModalBtn = document.getElementById("closeModalBtn");

        /* ---------- 2. 渲染时间轴 ---------- */
        function renderTimeline() {
            if (!timelineWrap) return;
            var nowTime = new Date().getTime();
            var showList = timeNodeList.filter(function (item) {
                var target = new Date(item.date).getTime();
                var expireHide = target + TWO_DAY_MS;
                return nowTime < expireHide;
            });
            var htmlStr = "";
            if (showList.length === 0) {
                htmlStr = '<div class="empty-tip">暂无后续时间节点</div>';
            } else {
                showList.forEach(function (item) {
                    var target = new Date(item.date).getTime();
                    var isPassed = nowTime >= target;
                    var passClass = isPassed ? 'passed' : '';
                    htmlStr += '<div class="timeline-item ' + passClass + '">' +
                                   '<div class="timeline-name">' + item.name + '</div>' +
                                   '<div class="timeline-date">' + item.date + '</div>' +
                               '</div>';
                });
            }
            timelineWrap.innerHTML = htmlStr;
        }

        /* ---------- 3. 倒计时 ---------- */
        function getNextTargetTime() {
            var nowTime = new Date().getTime();
            var futureNodes = timeNodeList.filter(function (item) {
                var target = new Date(item.date).getTime();
                return target > nowTime;
            });
            if (futureNodes.length === 0) return null;
            return futureNodes[0];
        }

        function updateCountdown() {
            renderTimeline();
            if (!countdownDom) return;
            var targetNode = getNextTargetTime();
            if (!targetNode) {
                countdownDom.innerText = "所有时间节点已全部过期";
                return;
            }
            var now = new Date().getTime();
            var targetTime = new Date(targetNode.date).getTime();
            var diff = targetTime - now;
            var day = Math.floor(diff / (1000 * 60 * 60 * 24));
            diff = diff % (1000 * 60 * 60 * 24);
            var hour = Math.floor(diff / (1000 * 60 * 60));
            diff = diff % (1000 * 60 * 60);
            var minute = Math.floor(diff / (1000 * 60));
            diff = diff % (1000 * 60);
            var second = Math.floor(diff / 1000);
            countdownDom.innerText = targetNode.name + ' | ' + day + '天 ' + hour + '时 ' + minute + '分 ' + second + '秒';
        }

        /* ---------- 4. 下载图片（智能展开列表防截断） ---------- */
        if (downloadBtn) {
            downloadBtn.addEventListener('click', function () {
                if (typeof html2canvas !== 'function') {
                    alert("html2canvas 未加载，无法生成图片");
                    return;
                }
                downloadBtn.disabled = true;
                downloadBtn.innerText = "生成中…";

                // 1. 备份并临时移除高度限制，让列表完全展开
                var origWrapStyle = captureWrap.style.cssText;
                var origListStyle = timelineWrap.style.cssText;
                
                captureWrap.style.height = 'auto';
                captureWrap.style.maxHeight = 'none';
                captureWrap.style.overflow = 'visible';
                
                timelineWrap.style.height = 'auto';
                timelineWrap.style.maxHeight = 'none';
                timelineWrap.style.overflow = 'visible';
                timelineWrap.style.paddingRight = '0';

                // 2. 延迟一小段时间确保DOM渲染完成
                setTimeout(function() {
                    html2canvas(captureWrap, {
                        useCORS: true,
                        backgroundColor: '#16181d', 
                        scale: 2
                    }).then(function (canvas) {
                        var link = document.createElement('a');
                        link.download = "原神时间表.png";
                        link.href = canvas.toDataURL("image/png");
                        link.click();
                    }).catch(function (e) {
                        alert("图片生成失败：" + e.message);
                    }).then(function () {
                        // 3. 恢复原样，恢复内部滑动
                        captureWrap.style.cssText = origWrapStyle;
                        timelineWrap.style.cssText = origListStyle;
                        
                        downloadBtn.disabled = false;
                        downloadBtn.innerText = "下载时间点图片";
                    });
                }, 100);
            });
        }

        /* ---------- 5. 弹窗 ---------- */
        if (openModalBtn && modal) {
            openModalBtn.addEventListener('click', function () {
                modal.style.display = "flex";
            });
        }
        if (closeModalBtn && modal) {
            closeModalBtn.addEventListener('click', function () {
                modal.style.display = "none";
            });
        }
        if (modal) {
            modal.addEventListener('click', function (e) {
                if (e.target === modal) modal.style.display = "none";
            });
        }

        /* ---------- 6. 启动 ---------- */
        updateCountdown();
        setInterval(updateCountdown, 1000);
    });
    </script>
</body>
</html>
