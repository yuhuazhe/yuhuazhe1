<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>羽化哲</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  }

  body {
    /* ===== 底图（叠加 35% 黑色遮罩，让背景稍稍变暗） ===== */
    background-color: #16181d;
    background-image: 
        linear-gradient(rgba(0, 0, 0, 0.35), rgba(0, 0, 0, 0.35)),
        url("背景2.jpg");
    background-position: center;
    background-size: cover;
    background-repeat: no-repeat;
    background-attachment: fixed;
    
    color: #ffffff;
    min-height: 100vh;
    padding: 56px 24px 96px;
  }

  /* ===== 主容器 ===== */
  .wrap {
    position: relative;
    z-index: 1;
    max-width: 680px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  /* ===== 导航卡片（全透明） ===== */
  .version-box {
    background: transparent;
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 14px;
    padding: 22px 20px;
    text-align: center;
    transition: all 0.25s ease;
    box-shadow: none;
  }
  
  .version-box:hover {
    border-color: rgba(96, 165, 250, 0.45); /* 悬停时边框泛蓝 */
    transform: translateY(-2px);
    background: transparent;
  }

  .version-box a {
    font-size: 20px;
    color: #60a5fa; /* 亮蓝色 */
    text-decoration: none;
    transition: 0.2s;
    display: block;
    margin-bottom: 6px;
    font-weight: 700;
    letter-spacing: 0.5px;
    /* 增强文字阴影，防止亮色背景下看不清 */
    text-shadow: 0 1px 4px rgba(0, 0, 0, 0.9), 0 0 6px rgba(0, 0, 0, 0.6);
  }
  
  .version-box a:hover {
    color: #38bdf8; /* 悬停时变成天蓝色 */
    text-shadow: 0 1px 4px rgba(0, 0, 0, 0.9), 0 0 10px rgba(56, 189, 248, 0.6);
  }

  .version-box p {
    font-size: 14px;
    color: #93c5fd; /* 浅蓝色 */
    line-height: 1.5;
    text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9), 0 0 5px rgba(0, 0, 0, 0.5);
  }

  /* ===== 移动端适配 ===== */
  @media (max-width: 600px) {
    body {
      padding: 40px 12px 48px;
    }
    .wrap {
      gap: 14px;
    }
    .version-box {
      padding: 18px 14px;
      border-radius: 12px;
    }
    .version-box a {
      font-size: 17px;
    }
    .version-box p {
      font-size: 13px;
    }
  }
</style>
</head>
<body>

  <div class="wrap">
     <div class="version-box">
      <a href="cq.html">原神角色产球查询</a>
      <p>可以查询截至到7.2版本全部角色的产球信息</p>
      
    </div>
  </div>
   <div class="version-box">
      <a href="fz.html">原神角色附着查询</a>
      <p>可以查询截至到7.2版本全部角色的附着信息</p>
      
    </div>
  </div>
    <div class="version-box">
      <a href="gongshi.html">计算公式</a>
      <p>计算公式 / 等级系数</p>
      
    </div>
    <div class="version-box">
      <a href="1.html">原神时间表</a>
      <p>记录版本时间，ct，cs，前瞻时间</p>
      
    </div>
  </div>

</body>
</html>
