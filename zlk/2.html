<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>羽化哲</title>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:system-ui,"Microsoft YaHei",sans-serif;
}
body{
    background:#090912;
    padding:30px 14px;
    color:#e6e6f2;
}
.wrap{
    max-width:680px; /* 缩小整体容器宽度，原来920 */
    margin:0 auto;
    display:flex;
    flex-direction:column;
    gap:18px;
}
.version-box{
    background:#151526;
    border:1px solid #323255;
    border-radius:14px;
    padding:22px 20px; /* 缩小内边距 */
    text-align:center; /* 强制居中 */
    transition: all 0.25s ease;
    box-shadow: 0 2px 8px rgba(0,0,0,0.35);
}
.version-box:hover{
    border-color:#9157c2;
    box-shadow: 0 0 14px rgba(145, 87, 194, 0.25), 0 4px 12px rgba(0,0,0,0.4);
    transform: translateY(-2px);
    background:#18182c;
}
.version-box a{
    font-size:20px; /* 字号适当缩小 */
    color:#e9ccff;
    text-decoration:none;
    transition:0.2s;
    display:block;
    margin-bottom:6px;
}
.version-box a:hover{
    color:#ffd8ff;
    text-shadow:0 0 8px #b378dd;
}
.version-box p{
    font-size:14px;
    color:#b8b8d8;
    line-height:1.5;
}

/*手机适配*/
@media(max-width:600px){
    body{
        padding:20px 10px;
    }
    .wrap{
        gap:14px;
    }
    .version-box{
        padding:18px 14px;
        border-radius:12px;
    }
    .version-box a{
        font-size:17px;
    }
    .version-box p{
        font-size:13px;
    }
}
</style>
</head>
<body>
<div class="wrap">
     <div class="version-box">
        <a href="gongshi.html">计算公式</a>
        <p>伤害计算公式/等级系数</p>
    </div>
    <div class="version-box">
        <a href="1.html">原神时间表</a>
        <p>记录版本时间，ct，cs，前瞻时间</p>
    </div>
    <div class="version-box">
        <a href="3.html">附着查询</a>
        <p>有关星超导角色叠层查询</p>
    </div>
    <div class="version-box">
        <a href="4.html">千星奇域boss模拟查询</a>
        <p>记录千星奇遇内的boss模拟奇域</p>
    </div>
    
   
    </div>
</div>
</body>
</html>
