<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">
  <title>原神角色产球查询</title>
  <style>
    :root {
      --line: rgba(255, 255, 255, .32);
      --line-strong: rgba(255, 255, 255, .7);
      --text: #ffffff;
      --muted: rgba(255, 255, 255, .9);
      --faint: rgba(255, 255, 255, .68);
      --surface: rgba(10, 11, 15, .58);
      color-scheme: dark;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      margin: 0;
      color: var(--text);
      background: #000000;
      font-family: "Microsoft YaHei", "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      color: inherit;
    }

    .background {
      position: fixed;
      inset: 0;
      background: #000000 url("背景2.jpg") center / cover no-repeat;
    }

    .background::after {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, .35);
    }

    .page {
      position: relative;
      display: flex;
      flex-direction: column;
      width: 100%;
      max-width: 1560px;
      height: 100vh;
      height: 100svh;
      min-height: 100vh;
      min-height: 100svh;
      margin: 0 auto;
      padding: clamp(28px, 4vw, 48px) clamp(20px, 4vw, 56px);
    }

    h1 {
      flex: none;
      margin: 0 0 26px;
      font-size: clamp(26px, 2.4vw, 34px);
      font-weight: 500;
      letter-spacing: .03em;
      line-height: 1.3;
      text-align: center;
    }

    .filters {
      display: grid;
      flex: none;
      grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr) auto auto;
      align-items: center;
      gap: 12px;
    }

    .records {
      display: flex;
      flex: 1;
      flex-direction: column;
      min-height: 0;
      margin-top: 0;
    }

    .records-head {
      display: grid;
      flex: none;
      grid-template-columns: 1.2fr 1.2fr 1.2fr 1.6fr;
      gap: 24px;
      margin-bottom: 8px;
      padding: 10px 16px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      color: rgba(255, 255, 255, .96);
      font-size: 12px;
      font-weight: 600;
      line-height: 1.4;
    }

    .records-head span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .records-body {
      display: flex;
      flex: 1;
      flex-direction: column;
      gap: 8px;
      min-height: 0;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: rgba(255, 255, 255, .3) transparent;
    }

    .record-row {
      display: grid;
      flex: none;
      grid-template-columns: 1.2fr 1.2fr 1.2fr 1.6fr;
      gap: 24px;
      align-items: center;
      min-height: 54px;
      padding: 12px 16px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      box-shadow: 0 4px 14px rgba(0, 0, 0, .14);
    }

    .record-row span {
      min-width: 0;
    }

    .records-body::-webkit-scrollbar {
      width: 5px;
    }

    .records-body::-webkit-scrollbar-track {
      background: transparent;
    }

    .records-body::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, .3);
    }

    .filter-panel {
      display: flex;
      align-items: center;
      gap: 14px;
      width: 100%;
      height: 54px;
      min-width: 0;
      padding: 0 16px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      box-shadow: 0 4px 14px rgba(0, 0, 0, .14);
    }

    .element-panel {
      justify-content: center;
    }

    .field-label {
      flex: none;
      color: #ffffff;
      font-size: 12px;
      font-weight: 600;
      line-height: 1.4;
      white-space: nowrap;
    }

    .search-input {
      flex: 1;
      width: 100%;
      min-width: 0;
      padding: 5px 0;
      border: 0;
      border-bottom: 1px solid transparent;
      outline: none;
      color: var(--text);
      background: transparent;
      font-size: 13.5px;
      line-height: 1.4;
    }

    .search-input::placeholder {
      color: rgba(255, 255, 255, .7);
    }

    .search-input:focus {
      border-bottom-color: var(--line-strong);
    }

    .element-panel .select-wrap {
      position: relative;
      flex: 0 1 112px;
      min-width: 86px;
    }

    .element-select {
      width: 100%;
      padding: 5px 22px 5px 4px;
      border: 0;
      border-bottom: 1px solid transparent;
      outline: none;
      appearance: none;
      -webkit-appearance: none;
      color: var(--text);
      background: transparent;
      cursor: pointer;
      font-size: 13.5px;
      line-height: 1.4;
      text-align: center;
      text-align-last: center;
    }

    .element-select:focus {
      border-bottom-color: var(--line-strong);
    }

    .element-select option {
      color: var(--text);
      background: #111111;
    }

    .select-wrap::after {
      content: "";
      position: absolute;
      top: 50%;
      right: 3px;
      width: 6px;
      height: 6px;
      border-right: 1px solid var(--muted);
      border-bottom: 1px solid var(--muted);
      pointer-events: none;
      transform: translateY(-70%) rotate(45deg);
    }

    .rarity-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      appearance: none;
      height: 54px;
      padding: 0 22px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      box-shadow: 0 4px 14px rgba(0, 0, 0, .14);
      cursor: pointer;
      color: #ffffff;
      font-size: 13px;
      font-weight: 500;
      line-height: 1.4;
      white-space: nowrap;
    }

    .rarity-button:hover {
      border-color: var(--line-strong);
      color: var(--text);
    }

    .rarity-button[aria-pressed="true"] {
      border-color: var(--text);
      color: var(--text);
    }

    .search-input:focus-visible,
    .element-select:focus-visible,
    .rarity-button:focus-visible {
      outline: 1px solid var(--line-strong);
      outline-offset: 3px;
    }

    @media (max-width: 900px) {
      .filters {
        grid-template-columns: 1fr 1fr;
        align-items: center;
      }

      .rarity-button {
        width: 100%;
      }

      .records {
        margin-top: 0;
      }

      .records-head,
      .record-row {
        gap: 16px;
      }
    }

    @media (max-width: 620px) {
      .page {
        padding: 24px 16px;
      }

      h1 {
        margin-bottom: 20px;
        font-size: 24px;
      }

      .filters {
        grid-template-columns: 1fr;
        gap: 10px;
      }

      .filter-panel {
        height: 50px;
      }

      .rarity-button {
        height: 50px;
      }

      .records {
        flex: none;
        margin-top: 0;
      }

      .records-head {
        grid-template-columns: 1.2fr 1.1fr 1.1fr 1.6fr;
        gap: 10px;
        padding: 9px 10px;
        font-size: 11px;
      }

      .record-row {
        grid-template-columns: 1.2fr 1.1fr 1.1fr 1.6fr;
        gap: 10px;
        padding: 10px;
      }
    }
  
    /* Populated character rows */
    .record-row {
      align-items: start;
    }

    .record-cell {
      display: flex;
      flex-direction: column;
      gap: 3px;
      min-width: 0;
      color: rgba(255, 255, 255, .92);
      font-size: 12px;
      line-height: 1.55;
    }

    .record-identity {
      gap: 4px;
    }

    .record-name {
      display: block;
      overflow: hidden;
      color: #ffffff;
      font-size: 14px;
      font-weight: 600;
      line-height: 1.4;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .record-sub {
      display: block;
      color: rgba(255, 255, 255, .78);
      font-size: 10px;
      line-height: 1.4;
    }

    .record-line {
      display: block;
      min-width: 0;
      overflow-wrap: anywhere;
    }

    .record-particles .record-line {
      color: var(--text);
      font-size: 13px;
    }

    .record-cd .record-line {
      color: rgba(255, 255, 255, .94);
    }

    .record-note .record-line {
      color: rgba(255, 255, 255, .88);
      font-size: 11.5px;
    }

    .record-empty {
      padding: 22px 16px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      color: rgba(255, 255, 255, .82);
      font-size: 12px;
      text-align: center;
    }

    @media (max-width: 620px) {
      .record-name {
        font-size: 13px;
      }

      .record-sub {
        font-size: 9px;
      }

      .record-cell {
        font-size: 11px;
      }

      .record-particles .record-line {
        font-size: 12px;
      }

      .record-note .record-line {
        font-size: 10px;
      }
    }
</style>
</head>
<body>
  <div class="background" aria-hidden="true"></div>

  <main class="page">
    <h1>原神角色产球查询</h1>

    <section class="filters" aria-label="角色筛选">
      <div class="filter-panel">
        <label class="field-label" for="characterSearch">搜索框</label>
        <input
          class="search-input"
          id="characterSearch"
          type="text"
          autocomplete="off"
          spellcheck="false"
          placeholder="搜索角色"
        >
      </div>

      <div class="filter-panel element-panel">
        <label class="field-label" for="elementSelect">元素筛选</label>
        <span class="select-wrap">
          <select class="element-select" id="elementSelect">
            <option value="all">全部</option>
            <option value="anemo">风</option>
            <option value="geo">岩</option>
            <option value="electro">雷</option>
            <option value="dendro">草</option>
            <option value="hydro">水</option>
            <option value="pyro">火</option>
            <option value="cryo">冰</option>
          </select>
        </span>
      </div>

      <button class="rarity-button" type="button" data-rarity="5" aria-pressed="false">五星角色</button>
      <button class="rarity-button" type="button" data-rarity="4" aria-pressed="false">四星角色</button>
    </section>

    <section class="records" aria-label="角色产球数据">
      <div class="records-head" role="row">
        <span role="columnheader">角色名称</span>
        <span role="columnheader">产球数量</span>
        <span role="columnheader">产球cd</span>
        <span role="columnheader">备注</span>
      </div>
      <div class="records-body" id="recordsBody" role="rowgroup" aria-live="polite">
      </div>
    </section>
  </main>

"战技命中触发，单轮元素战技仅触发 1 次。"],"法尔伽":["战技命中触发，四风将起不触发。"],"洛恩":["奇谋状态下，普通攻击、重击、下落攻击和元素战技命中触发。"],"莉奈娅":["战技"],"尼可":["战技"],"布伦妮":["战技，叮铃铃·猎魔之音命中触发，咚锵锵·裁魔之惩不触发。"],"桑多涅":["冷凝射线、冷凝射线星超导、棱晶弹、棱晶弹星超导、6命集束型冷凝射线星超导命中触发，6命集束型冷凝射线不触发。"],"阿罗夏":["战技，点按或长按伤害命中触发。"],"奥黛塔":["战技，技能伤害或破晓终奏持续命中触发。"],"旅行者（风）":["战技点按","战技长按"],"旅行者（冰）":["战技，技能伤害命中触发，冰晶不触发。"],"旅行者（草）":["战技"],"旅行者（雷）":["战技，产球数量与勾玉命中敌人的数量无关。"],"旅行者（岩）":["荒星砸人触发。2 命荒星爆炸不触发"],"旅行者（水）":["战技，喷发激流命中触发。"],"旅行者（火）":["战技，焰烈之槛命中触发。","战技，长按伤害或灼火之槛命中触发。"]};

    const searchInput = document.getElementById("characterSearch");
    const elementSelect = document.getElementById("elementSelect");
    const recordsBody = document.getElementById("recordsBody");
    const rarityButtons = [...document.querySelectorAll(".rarity-button")];

    const state = {
      query: "",
      element: "all",
      rarity: 0
    };

    const normalize = (value) =>
      String(value ?? "")
        .normalize("NFKC")
        .toLocaleLowerCase("zh-CN")
        .replace(/\s+/g, "");

    function formatCd(value) {
      if (!value) return "—";
      return String(value)
        .replace(/(\d+(?:\.\d+)?)s/g, (_, number) => `${Number(Number(number).toFixed(3))}s`)
        .replace(/Instant/gi, "瞬发");
    }

    function makeLinesCell(className, lines) {
      const cell = document.createElement("div");
      cell.className = `record-cell ${className}`;
      cell.setAttribute("role", "cell");

      for (const content of lines) {
        const line = document.createElement("span");
        line.className = "record-line";
        line.textContent = content;
        cell.appendChild(line);
      }

      return cell;
    }

    function makeRow(character) {
      const row = document.createElement("div");
      row.className = "record-row";
      row.setAttribute("role", "row");

      const identity = document.createElement("div");
      identity.className = "record-cell record-identity";
      identity.setAttribute("role", "cell");

      const name = document.createElement("span");
      name.className = "record-name";
      name.textContent = character.name;

      const sub = document.createElement("span");
      sub.className = "record-sub";
      sub.textContent = `${character.rarity === 5 ? "五星" : "四星"} · ${character.elementName}`;

      identity.append(name, sub);

      const energy = Array.isArray(character.energy) ? character.energy : [];
      let particles;
      let cds;
      let notes;

      if (energy.length === 0) {
        particles = ["—"];
        cds = ["—"];
        notes = ["站点暂无产球数据"];
      } else {
        particles = energy.map((entry) => entry.particles || "—");
        cds = energy.map((entry) => formatCd(entry.cd));

        const descriptions = SKILL_NOTES[character.name] || [];
        const sources = [...new Set(energy.map((entry) => entry.source).filter(Boolean))];
        const normalizeSkillDescription = (description) => {
          const skillMarker = "__ELEMENTAL_SKILL__";
          return String(description)
            .replace(/元素战技/g, skillMarker)
            .replace(/战技/g, "元素战技")
            .replace(new RegExp(skillMarker, "g"), "元素战技");
        };

        let skillText;
        if (descriptions.length) {
          skillText = descriptions.map(normalizeSkillDescription).join("；");
        } else {
          const labels = sources.map((source) => {
            if (/ElementalArt|ElementalBall|ElemBall|DropElemBall/i.test(source)) return "元素战技";
            if (/Burst/i.test(source)) return "元素爆发";
            if (/NormalAttack|Charged/i.test(source)) return "普通攻击 / 重击";
            return "技能触发";
          });
          skillText = `${[...new Set(labels)].join(" / ") || "技能触发"}（站点触发源：${sources.join(" / ") || "未注明"}）`;
        }

        const probabilities = [...new Set(
          energy
            .flatMap((entry) => String(entry.chance || "").match(/\d+(?:\.\d+)?%/g) || [])
            .filter((value) => Number.parseFloat(value) < 100)
        )];

        notes = [`技能：${skillText}`];
        if (probabilities.length) notes.push(`概率产球：${probabilities.join(" / ")}`);
      }

      row.append(
        identity,
        makeLinesCell("record-particles", particles),
        makeLinesCell("record-cd", cds),
        makeLinesCell("record-note", notes)
      );

      return row;
    }

    function render() {
      const query = normalize(state.query);
      const visible = CHARACTERS.filter((character) => {
        if (state.element !== "all" && character.element !== state.element) return false;
        if (state.rarity !== 0 && character.rarity !== state.rarity) return false;
        if (!query) return true;
        return normalize(`${character.name} ${character.en}`).includes(query);
      });

      rarityButtons.forEach((button) => {
        button.setAttribute("aria-pressed", String(Number(button.dataset.rarity) === state.rarity));
      });

      if (!visible.length) {
        const empty = document.createElement("div");
        empty.className = "record-empty";
        empty.textContent = "没有符合当前筛选条件的角色";
        recordsBody.replaceChildren(empty);
        return;
      }

      const fragment = document.createDocumentFragment();
      for (const character of visible) fragment.appendChild(makeRow(character));
      recordsBody.replaceChildren(fragment);
    }

    searchInput.addEventListener("input", (event) => {
      state.query = event.target.value;
      render();
    });

    elementSelect.addEventListener("change", (event) => {
      state.element = event.target.value;
      render();
    });

    rarityButtons.forEach((button) => {
      button.addEventListener("click", () => {
        const rarity = Number(button.dataset.rarity);
        state.rarity = state.rarity === rarity ? 0 : rarity;
        render();
      });
    });

    render();
  })();
</script>
