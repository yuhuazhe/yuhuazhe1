<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">
  <title>原神角色附着查询</title>
  <style>
    :root {
      --line: rgba(255, 255, 255, .14);
      --line-strong: rgba(255, 255, 255, .42);
      --text: #ffffff;
      --muted: rgba(255, 255, 255, .74);
      --faint: rgba(255, 255, 255, .52);
      --surface: rgba(16, 20, 28, .72);
      --surface-hover: rgba(24, 29, 40, .84);
      color-scheme: dark;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      margin: 0;
      color: var(--text);
      background: #000000;
      font-family: "Microsoft YaHei", "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      color: inherit;
    }

    .background {
      position: fixed;
      inset: 0;
      background: #000000 url("背景2.jpg") center / cover no-repeat;
    }

    .background::after {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, .41);
    }

    .page {
      position: relative;
      display: flex;
      flex-direction: column;
      width: 100%;
      max-width: 1560px;
      height: 100vh;
      height: 100svh;
      min-height: 100vh;
      min-height: 100svh;
      margin: 0 auto;
      padding: clamp(24px, 3.6vw, 44px) clamp(18px, 4vw, 52px) clamp(14px, 2vw, 22px);
    }

    .page-head {
      flex: none;
      margin-bottom: 22px;
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: clamp(25px, 2.3vw, 33px);
      font-weight: 600;
      letter-spacing: .09em;
      line-height: 1.3;
    }

    .page-meta {
      margin: 9px 0 0;
      color: rgba(255, 255, 255, .62);
      font-size: 11px;
      letter-spacing: .02em;
      line-height: 1.6;
      text-shadow: 0 1px 3px rgba(0, 0, 0, .8);
    }

    .page-meta a {
      color: var(--muted);
      text-decoration: none;
      border-bottom: 1px solid rgba(255, 255, 255, .24);
      transition: color .18s ease, border-color .18s ease;
    }

    .page-meta a:hover {
      color: #ffffff;
      border-bottom-color: rgba(255, 255, 255, .6);
    }

    .page-meta .sep {
      margin: 0 7px;
      color: rgba(255, 255, 255, .28);
    }

    .filters {
      display: grid;
      flex: none;
      grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr) auto auto;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }

    .filter-panel {
      display: flex;
      align-items: center;
      gap: 14px;
      width: 100%;
      height: 50px;
      min-width: 0;
      padding: 0 16px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      box-shadow: 0 4px 14px rgba(0, 0, 0, .14);
    }

    .element-panel {
      justify-content: center;
    }

    .field-label {
      flex: none;
      color: #ffffff;
      font-size: 12px;
      font-weight: 600;
      line-height: 1.4;
      white-space: nowrap;
    }

    .search-input {
      flex: 1;
      width: 100%;
      min-width: 0;
      padding: 5px 0;
      border: 0;
      border-bottom: 1px solid transparent;
      outline: none;
      color: var(--text);
      background: transparent;
      font-size: 13.5px;
      line-height: 1.4;
    }

    .search-input::placeholder {
      color: rgba(255, 255, 255, .62);
    }

    .search-input:focus {
      border-bottom-color: var(--line-strong);
    }

    .element-panel .select-wrap {
      position: relative;
      flex: 0 1 112px;
      min-width: 86px;
    }

    .element-select {
      width: 100%;
      padding: 5px 22px 5px 4px;
      border: 0;
      border-bottom: 1px solid transparent;
      outline: none;
      appearance: none;
      -webkit-appearance: none;
      color: var(--text);
      background: transparent;
      cursor: pointer;
      font-size: 13.5px;
      line-height: 1.4;
      text-align: center;
      text-align-last: center;
    }

    .element-select:focus {
      border-bottom-color: var(--line-strong);
    }

    .element-select option {
      color: var(--text);
      background: #111111;
    }

    .select-wrap::after {
      content: "";
      position: absolute;
      top: 50%;
      right: 3px;
      width: 6px;
      height: 6px;
      border-right: 1px solid var(--muted);
      border-bottom: 1px solid var(--muted);
      pointer-events: none;
      transform: translateY(-70%) rotate(45deg);
    }

    .rarity-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      appearance: none;
      height: 50px;
      padding: 0 22px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      box-shadow: 0 4px 14px rgba(0, 0, 0, .14);
      cursor: pointer;
      color: #ffffff;
      font-size: 13px;
      font-weight: 500;
      line-height: 1.4;
      white-space: nowrap;
      transition: border-color .18s ease, background .18s ease;
    }

    .rarity-button:hover {
      border-color: var(--line-strong);
      background: var(--surface-hover);
    }

    .rarity-button[aria-pressed="true"] {
      border-color: rgba(255, 255, 255, .78);
      background: rgba(255, 255, 255, .08);
    }

    .search-input:focus-visible,
    .element-select:focus-visible,
    .rarity-button:focus-visible {
      outline: 1px solid var(--line-strong);
      outline-offset: 3px;
    }

    .records {
      display: flex;
      flex: 1;
      flex-direction: column;
      min-height: 0;
    }

    .records-head {
      display: grid;
      flex: none;
      grid-template-columns: 1.05fr .92fr 1.12fr 2fr;
      gap: 18px;
      margin-bottom: 8px;
      padding: 10px 18px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      color: rgba(255, 255, 255, .94);
      font-size: 12px;
      font-weight: 600;
      line-height: 1.4;
      letter-spacing: .04em;
    }

    .records-head span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .records-body {
      display: flex;
      flex: 1;
      flex-direction: column;
      gap: 8px;
      min-height: 0;
      overflow-y: auto;
      padding-right: 4px;
      scrollbar-width: thin;
      scrollbar-color: rgba(255, 255, 255, .28) transparent;
    }

    .record-row {
      display: grid;
      flex: none;
      grid-template-columns: 1.05fr .92fr 1.12fr 2fr;
      gap: 18px;
      align-items: start;
      min-height: 58px;
      padding: 13px 18px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      box-shadow: 0 4px 14px rgba(0, 0, 0, .14);
      transition: border-color .18s ease, background .18s ease;
    }

    .record-row:hover {
      border-color: rgba(255, 255, 255, .28);
      background: var(--surface-hover);
    }

    .records-body::-webkit-scrollbar {
      width: 6px;
    }

    .records-body::-webkit-scrollbar-track {
      background: transparent;
    }

    .records-body::-webkit-scrollbar-thumb {
      border-radius: 3px;
      background: rgba(255, 255, 255, .26);
    }

    .record-cell {
      display: flex;
      flex-direction: column;
      gap: 5px;
      min-width: 0;
    }

    .record-name {
      display: block;
      overflow: hidden;
      color: #ffffff;
      font-size: 14px;
      font-weight: 600;
      line-height: 1.4;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .record-sub {
      display: flex;
      align-items: center;
      gap: 6px;
      color: rgba(255, 255, 255, .62);
      font-size: 10.5px;
      line-height: 1.4;
      white-space: nowrap;
    }

    .el-dot {
      flex: none;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--el, #ffffff);
      box-shadow: 0 0 7px var(--el, #ffffff);
    }

    .metric-main {
      color: #ffffff;
      font-size: 14px;
      font-weight: 600;
      line-height: 1.4;
      overflow-wrap: anywhere;
    }

    .metric-main.is-rule {
      font-size: 12.5px;
      font-weight: 500;
      line-height: 1.5;
      color: rgba(255, 255, 255, .96);
    }

    .metric-sub {
      color: rgba(255, 255, 255, .56);
      font-size: 10.5px;
      line-height: 1.55;
      overflow-wrap: anywhere;
    }

    .metric-main.is-empty,
    .metric-sub.is-empty {
      color: rgba(255, 255, 255, .38);
      font-weight: 500;
    }

    .record-note {
      gap: 3px;
    }

    .note-line {
      color: rgba(255, 255, 255, .84);
      font-size: 11.5px;
      line-height: 1.65;
      overflow-wrap: anywhere;
    }

    .note-line b {
      color: #ffffff;
      font-weight: 600;
    }

    .note-line .muted {
      color: rgba(255, 255, 255, .48);
    }

    .note-empty {
      color: rgba(255, 255, 255, .42);
      font-size: 11.5px;
      line-height: 1.6;
    }

    .record-empty {
      padding: 26px 16px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      color: rgba(255, 255, 255, .78);
      font-size: 12px;
      text-align: center;
    }

    .page-foot {
      flex: none;
      margin-top: 10px;
      color: rgba(255, 255, 255, .58);
      font-size: 10.5px;
      line-height: 1.65;
      text-align: center;
      text-shadow: 0 1px 3px rgba(0, 0, 0, .8);
    }

    .page-foot p {
      margin: 2px 0;
    }

    @media (max-width: 1080px) {
      .records-head,
      .record-row {
        grid-template-columns: 1fr .9fr 1.05fr 1.55fr;
        gap: 14px;
      }
    }

    @media (max-width: 900px) {
      .filters {
        grid-template-columns: 1fr 1fr;
      }

      .rarity-button {
        width: 100%;
      }

      .records-head,
      .record-row {
        grid-template-columns: 1fr .88fr 1fr 1.5fr;
        gap: 12px;
      }
    }

    @media (max-width: 720px) {
      .page {
        height: auto;
        min-height: 100svh;
        padding: 22px 14px 18px;
      }

      .page-head {
        margin-bottom: 18px;
      }

      h1 {
        font-size: 24px;
      }

      .filters {
        grid-template-columns: 1fr;
        gap: 10px;
      }

      .filter-panel,
      .rarity-button {
        height: 48px;
      }

      .records {
        flex: none;
      }

      .records-head {
        display: none;
      }

      .record-row {
        grid-template-columns: 1fr 1fr;
        grid-template-areas:
          "identity identity"
          "gauge rule"
          "note note";
        gap: 11px 16px;
        padding: 14px;
      }

      .record-identity {
        grid-area: identity;
        flex-direction: row;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
      }

      .record-gauge {
        grid-area: gauge;
      }

      .record-rule {
        grid-area: rule;
      }

      .record-note {
        grid-area: note;
        margin-top: 2px;
        padding-top: 9px;
        border-top: 1px solid rgba(255, 255, 255, .1);
      }

      .record-cell[data-label]::before {
        content: attr(data-label);
        margin-bottom: 1px;
        color: rgba(255, 255, 255, .4);
        font-size: 9.5px;
        line-height: 1.4;
        letter-spacing: .08em;
      }

      .record-note[data-label]::before {
        margin-bottom: 3px;
      }

      .record-sub {
        white-space: normal;
      }

      .page-foot {
        margin-top: 14px;
      }
    }

    @media (max-width: 420px) {
      .record-name {
        font-size: 13px;
      }

      .metric-main {
        font-size: 13px;
      }

      .metric-main.is-rule {
        font-size: 12px;
      }

      .note-line {
        font-size: 11px;
      }
    }
  </style>
</head>
<body>
  <div class="background" aria-hidden="true"></div>

  <main class="page">
    <header class="page-head">
      <h1>原神角色附着查询</h1>
      <p class="page-meta">
        <span id="charCount">— 位角色</span>
        <span class="sep">·</span>
        <span>数据版本 6.3.54 + 7.1.53</span>
        <span class="sep">·</span>
        <span>来源 <a href="https://lunaris.moe/" target="_blank" rel="noreferrer noopener">Lunaris</a></span>
      </p>
    </header>

    <section class="filters" aria-label="角色筛选">
      <div class="filter-panel">
        <label class="field-label" for="characterSearch">搜索框</label>
        <input
          class="search-input"
          id="characterSearch"
          type="text"
          autocomplete="off"
          spellcheck="false"
          placeholder="搜索角色或技能名称"
        >
      </div>

      <div class="filter-panel element-panel">
        <label class="field-label" for="elementSelect">元素筛选</label>
        <span class="select-wrap">
          <select class="element-select" id="elementSelect">
            <option value="all">全部</option>
            <option value="anemo">风</option>
            <option value="geo">岩</option>
            <option value="electro">雷</option>
            <option value="dendro">草</option>
            <option value="hydro">水</option>
            <option value="pyro">火</option>
            <option value="cryo">冰</option>
          </select>
        </span>
      </div>

      <button class="rarity-button" type="button" data-rarity="5" aria-pressed="false">五星角色</button>
      <button class="rarity-button" type="button" data-rarity="4" aria-pressed="false">四星角色</button>
    </section>

    <section class="records" aria-label="角色附着数据">
      <div class="records-head" role="row">
        <span role="columnheader">角色名称</span>
        <span role="columnheader">元素量</span>
        <span role="columnheader">附着规则</span>
        <span role="columnheader">备注</span>
      </div>
      <div class="records-body" id="recordsBody" role="rowgroup" aria-live="polite"></div>
    </section>

    <footer class="page-foot">
      <p>「U」为元素附着单位：1U 弱附着、2U 强附着、4U 超强附着；独立附着不受 3 次 / 2.5 秒规则限制。</p>
      <p>仅收录造成元素附着的判定，0U 与物理判定不计入；相同判定（同名、同元素量、同规则）只计一次。</p>
    </footer>
  </main>

        {"id":"10000107","name":"茜特菈莉","el":"cryo","q":5,"sn":"宿灵捕影","ss":"霜昼黑星","sb":"诸曜饬令","a":[["ElementalArt","1U","Independent","A"],["ElementalArt_Handler","1U","2 hits / 1.5s","A"],["Skillobj_ElementalBurst_Gadget1_Material","2U","Independent","B"],["Skillobj_ElementalBurst_Gadget2_Material","1U","Independent","B"],["Skillobj_ElementalBurst_Gadget3_Material","1U","Independent","O"],["Skillobj_Bullet1_Material","1U","Independent","N"],["Skillobj_Bullet2_Material","1U","Independent","N"],["Skillobj_Bullet3_Material","1U","Independent","N"],["Skillobj_ExtraAttack2_Material","1U","Independent","O"],["Skillobj_ExtraAttack2_Material","1U","Standard (3h/2.5s)","O"],["FallingAnthem","1U","Independent","F"]]},

        {"id":"10000136","name":"米提亚","el":"electro","q":5,"sn":"链式反应","ss":"律定·变量侦测","sb":"解析·递变之理","a":[["ElementalArt","1U","Independent","A"],["Partner_EnhanceAttackManager","1U","Standard (3h/2.5s)","O"],["ExtraAttack_Normal","1U","Independent","O"],["ExtraAttack_Enhance_PartnerControl","1U","Standard (3h/2.5s)","O"],["ElementalBurstGadget","2U","Independent","B"],["FallingAnthem","1U","Independent","F"]]},
        {"id":"10000137","name":"瓦列里","el":"electro","q":4,"sn":"近卫战法·盾剑攻斥","ss":"攻势防御·堡垒骤进","sb":"火力焦点·雷霰急袭","a":[["ExtraAttack","1U","Independent","O"],["ElementalArt","1U","Independent","A"],["ElementalBurst","1U","Independent","B"],["SkillObj_Funnel","1U","2 hits / 2s","A"]]},
        {"id":"10000150","name":"奥黛塔","el":"cryo","q":5,"sn":"雪鹄变奏","ss":"柔板·幻灵夜舞","sb":"疾板·苍羽一梦","a":[["ElementalArt","1U","4 hits / 3s","A"],["ElementalArt","1U","Independent","A"],["Gadget_ExtraAttackCollider","1U","4 hits / 3s","O"],["ElementalArt_Partner","1U","Independent","A"],["ElementalBurst","1U","Independent","B"]]},
      ];

      const ELEMENTS = {
        anemo: { name: "风元素", color: "#7ac7ab" },
        geo: { name: "岩元素", color: "#dfb64a" },
        electro: { name: "雷元素", color: "#b78bea" },
        dendro: { name: "草元素", color: "#a8ca45" },
        hydro: { name: "水元素", color: "#54c3ef" },
        pyro: { name: "火元素", color: "#ef7d3d" },
        cryo: { name: "冰元素", color: "#a8ddea" },
        unknown: { name: "未知元素", color: "#c9c9c9" }
      };

      const CATS = {
        A: { label: "元素战技", short: "战技", order: 0, nameKey: "ss" },
        B: { label: "元素爆发", short: "爆发", order: 1, nameKey: "sb" },
        N: { label: "普通攻击", short: "普攻", order: 2, nameKey: "sn" },
        F: { label: "下落攻击", short: "下落", order: 3, nameKey: "" },
        O: { label: "其他判定", short: "其他", order: 4, nameKey: "" }
      };

      const searchInput = document.getElementById("characterSearch");
      const elementSelect = document.getElementById("elementSelect");
      const recordsBody = document.getElementById("recordsBody");
      const charCount = document.getElementById("charCount");
      const rarityButtons = [...document.querySelectorAll(".rarity-button")];

      const state = {
        query: "",
        element: "all",
        rarity: 0
      };

      const normalize = (value) =>
        String(value ?? "")
          .normalize("NFKC")
          .toLocaleLowerCase("zh-CN")
          .replace(/\s+/g, "");

      const gaugeValue = (gauge) => {
        const number = Number.parseFloat(String(gauge));
        return Number.isFinite(number) ? number : -1;
      };

      function ruleShort(rule) {
        const text = String(rule || "").trim();
        if (!text) return "未注明";
        if (/^independent/i.test(text)) return "独立附着";
        if (/^standard/i.test(text)) return "标准附着";
        const custom = text.match(/(\d+)\s*hits?\s*\/\s*([\d.]+)\s*s/i);
        if (custom) return `${custom[1]}次/${Number(Number(custom[2]).toFixed(3))}秒`;
        return text;
      }

      function ruleFull(rule) {
        const text = String(rule || "").trim();
        if (/^standard/i.test(text)) return "标准附着（3 次 / 2.5 秒）";
        if (/^independent/i.test(text)) return "独立附着（不受 3 次 / 2.5 秒限制）";
        const custom = text.match(/(\d+)\s*hits?\s*\/\s*([\d.]+)\s*s/i);
        if (custom) return `自定义附着冷却（${custom[1]} 次 / ${Number(Number(custom[2]).toFixed(3))} 秒）`;
        return text || "未注明";
      }

      function groupAttacks(character) {
        const groups = new Map();
        for (const [name, gauge, rule, cat] of character.a) {
          if (!(Number.parseFloat(gauge) > 0)) continue;
          let key = CATS[cat] ? cat : "O";
          // 名称比 icd_source 更明确时，纠正被 "Skill" 泛匹配吞掉的爆发 / 普攻判定
          if (key === "A") {
            if (/burst/i.test(name) && !/elementalart/i.test(name)) key = "B";
            else if (/normalattack|charged/i.test(name)) key = "N";
          }
          if (!groups.has(key)) groups.set(key, []);
          groups.get(key).push({ name, gauge, rule });
        }
        return [...groups.entries()]
          .map(([cat, entries]) => ({ cat, entries }))
          .sort((a, b) => CATS[a.cat].order - CATS[b.cat].order);
      }

      function uniqueGauges(entries) {
        return [...new Set(entries.map((entry) => String(entry.gauge).toUpperCase()))]
          .sort((a, b) => gaugeValue(b) - gaugeValue(a));
      }

      function ruleCounts(entries) {
        const counts = new Map();
        for (const entry of entries) {
          const label = ruleShort(entry.rule);
          counts.set(label, (counts.get(label) || 0) + 1);
        }
        return [...counts.entries()].sort((a, b) => b[1] - a[1]);
      }

      function makeCell(className, label) {
        const cell = document.createElement("div");
        cell.className = `record-cell ${className}`;
        cell.setAttribute("role", "cell");
        if (label) cell.dataset.label = label;
        return cell;
      }

      function appendText(parent, tag, text, className) {
        const node = document.createElement(tag);
        if (className) node.className = className;
        node.textContent = text;
        parent.appendChild(node);
        return node;
      }

      function categoryTitle(cat, character) {
        const meta = CATS[cat];
        const skillName = meta.nameKey ? character[meta.nameKey] : "";
        if (skillName) return `${meta.label}「${skillName}」`;
        return meta.label;
      }

      function makeNoteLine(character, group) {
        const line = document.createElement("div");
        line.className = "note-line";
        line.title = [...new Set(group.entries.map((entry) => entry.name))].join("、");
        const title = categoryTitle(group.cat, character);
        appendText(line, "b", title, "");

        if (group.cat === "O") {
          const names = [...new Set(group.entries.map((entry) => entry.name))];
          const shown = names.slice(0, 3);
          const details = shown.map((name) => {
            const entry = group.entries.find((item) => item.name === name);
            return `${name} ${String(entry.gauge).toUpperCase()}·${ruleShort(entry.rule)}`;
          });
          line.appendChild(document.createTextNode(`：${details.join("；")}`));
          if (names.length > shown.length) {
            line.appendChild(document.createTextNode(`；共 ${names.length} 个判定`));
          }
          return line;
        }

        const combos = new Map();
        for (const entry of group.entries) {
          const key = `${String(entry.gauge).toUpperCase()}|${ruleShort(entry.rule)}`;
          combos.set(key, (combos.get(key) || 0) + 1);
        }
        const parts = [...combos.entries()].slice(0, 3).map(([key, count]) => {
          const [gauge, rule] = key.split("|");
          return `${gauge}·${rule}${count > 1 ? `（${count} 处）` : ""}`;
        });
        line.appendChild(document.createTextNode(`：${parts.join("；")}`));
        if (combos.size > 3) {
          line.appendChild(document.createTextNode(`；等 ${combos.size} 种判定`));
        }
        return line;
      }

      function makeRow(character) {
        const row = document.createElement("div");
        row.className = "record-row";
        row.setAttribute("role", "row");

        const identity = makeCell("record-identity");
        appendText(identity, "span", character.name, "record-name");

        const sub = document.createElement("span");
        sub.className = "record-sub";
        const dot = document.createElement("span");
        dot.className = "el-dot";
        const element = ELEMENTS[character.el] || ELEMENTS.unknown;
        dot.style.setProperty("--el", element.color);
        sub.append(dot, document.createTextNode(`${character.q === 5 ? "五星" : "四星"} · ${element.name}`));
        identity.appendChild(sub);

        const groups = groupAttacks(character);
        const allEntries = groups.flatMap((group) => group.entries);

        const gaugeCell = makeCell("record-gauge", "元素量");
        const ruleCell = makeCell("record-rule", "附着规则");
        const noteCell = makeCell("record-note", "备注");

        if (!allEntries.length) {
          appendText(gaugeCell, "span", "—", "metric-main is-empty");
          appendText(gaugeCell, "span", "暂无记录", "metric-sub is-empty");
          appendText(ruleCell, "span", "—", "metric-main is-rule is-empty");
          appendText(ruleCell, "span", "暂无记录", "metric-sub is-empty");
          appendText(noteCell, "span", "Lunaris 暂未收录该角色的元素附着判定。", "note-empty");
        } else {
          const gauges = uniqueGauges(allEntries);
          appendText(gaugeCell, "span", gauges.join(" / "), "metric-main");

          const gaugeSub = groups
            .map((group) => {
              const special = uniqueGauges(group.entries).filter((gauge) => gauge !== "1U");
              return special.length ? `${CATS[group.cat].short} ${special.join("/")}` : "";
            })
            .filter(Boolean)
            .join(" · ") || "全部判定均为 1U";
          appendText(gaugeCell, "span", gaugeSub, "metric-sub");

          const counts = ruleCounts(allEntries);
          const rules = counts.map(([label]) => label);
          const ruleMain = appendText(ruleCell, "span", rules.join("、"), "metric-main is-rule");
          ruleMain.title = [...new Set(allEntries.map((entry) => ruleFull(entry.rule)))].join("；");

          appendText(
            ruleCell,
            "span",
            counts.map(([label, count]) => `${label} ${count} 处`).join(" · "),
            "metric-sub"
          );

          for (const group of groups.slice(0, 5)) {
            noteCell.appendChild(makeNoteLine(character, group));
          }
          if (groups.length > 5) {
            appendText(noteCell, "span", `另有 ${groups.length - 5} 类判定未展开`, "note-empty");
          }
        }

        row.append(identity, gaugeCell, ruleCell, noteCell);
        return row;
      }

      function render() {
        const query = normalize(state.query);
        const visible = CHARACTERS.filter((character) => {
          if (state.element !== "all" && character.el !== state.element) return false;
          if (state.rarity !== 0 && character.q !== state.rarity) return false;
          if (!query) return true;
          return normalize(
            [character.name, character.sn, character.ss, character.sb].filter(Boolean).join(" ")
          ).includes(query);
        });

        rarityButtons.forEach((button) => {
          button.setAttribute("aria-pressed", String(Number(button.dataset.rarity) === state.rarity));
        });

        charCount.textContent = `${visible.length} / ${CHARACTERS.length} 位角色`;

        if (!visible.length) {
          const empty = document.createElement("div");
          empty.className = "record-empty";
          empty.textContent = "没有符合当前筛选条件的角色";
          recordsBody.replaceChildren(empty);
          return;
        }

        const fragment = document.createDocumentFragment();
        for (const character of visible) fragment.appendChild(makeRow(character));
        recordsBody.replaceChildren(fragment);
      }

      CHARACTERS.sort((a, b) => Number.parseInt(b.id, 10) - Number.parseInt(a.id, 10));

      searchInput.addEventListener("input", (event) => {
        state.query = event.target.value;
        render();
      });

      elementSelect.addEventListener("change", (event) => {
        state.element = event.target.value;
        render();
      });

      rarityButtons.forEach((button) => {
        button.addEventListener("click", () => {
          const rarity = Number(button.dataset.rarity);
          state.rarity = state.rarity === rarity ? 0 : rarity;
          render();
        });
      });

      render();
    })();
  </script>
