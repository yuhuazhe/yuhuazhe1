<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>怪物机制</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        body {
            background: #0a0a0f;
            color: #eee;
            padding: 20px;
            min-height: 100vh;
        }
        /* 返回按钮 + 标题 */
        .header-top {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
        }
        .back-btn {
            width: 36px;
            height: 36px;
            border-radius: 6px;
            background: #1a1a24;
            border: none;
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .back-btn:hover {
            background: #272738;
        }
        .page-title {
            font-size: 28px;
            font-weight: 700;
        }
        /* 筛选搜索栏 */
        .search-filter-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
            margin-bottom: 28px;
        }
        .filter-group {
            display: flex;
            gap: 8px;
        }
        .filter-tag {
            padding: 8px 16px;
            background: #171722;
            border: 1px solid #2c2c40;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .filter-tag.active {
            background: #382246;
            border-color: #9d58c0;
            color: #e9c8ff;
        }
        .filter-tag:hover {
            border-color: #604275;
        }
        .search-box-wrap {
            flex: 1;
            min-width: 220px;
            display: flex;
            background: #171722;
            border: 1px solid #2c2c40;
            border-radius: 6px;
            overflow: hidden;
        }
        .search-input {
            flex: 1;
            padding: 10px 14px;
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            font-size: 15px;
        }
        .clear-btn {
            padding: 0 14px;
            border: none;
            background: transparent;
            color: #aaa;
            cursor: pointer;
        }
        .clear-btn:hover {
            color: #fff;
        }
        /* 怪物网格 */
        .monster-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 18px;
        }
        .monster-card {
            background: #12121b;
            border: 1px solid #252538;
            border-radius: 10px;
            padding: 16px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            transition: 0.2s;
        }
        .monster-card:hover {
            border-color: #8048a3;
            transform: translateY(-3px);
            box-shadow: 0 6px 16px #47285c44;
        }
        .monster-avatar {
            width: 90px;
            height: 90px;
            border-radius: 8px;
            margin-bottom: 12px;
            object-fit: cover;
        }
        .monster-name {
            text-align: center;
            font-size: 15px;
            line-height: 1.4;
        }
        /* 详情弹窗遮罩 */
        .detail-mask {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 999;
            padding: 20px;
        }
        .detail-wrap {
            width: 100%;
            max-width: 700px;
            max-height: 90vh;
            overflow-y: auto;
            background: #12121b;
            border: 1px solid #8048a3;
            border-radius: 12px;
            padding: 24px;
            position: relative;
        }
        .close-detail {
            position: absolute;
            top: 16px;
            right: 16px;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #1a1a24;
            border: none;
            color: #fff;
            font-size: 18px;
            cursor: pointer;
        }
        .close-detail:hover {
            background: #382246;
        }
        .detail-header {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .detail-avatar {
            width: 140px;
            height: 140px;
            border-radius: 10px;
            object-fit: cover;
        }
        .detail-title h2 {
            font-size: 26px;
            margin-bottom: 8px;
        }
        .detail-type-tag {
            display: inline-block;
            padding: 4px 12px;
            background: #382246;
            border-radius: 4px;
            color: #e9c8ff;
            font-size: 14px;
        }
        .detail-content {
            line-height: 1.7;
            color: #ccc;
            white-space: pre-line;
        }
        /* 移动端适配 */
        @media (max-width: 600px) {
            .page-title {
                font-size: 22px;
            }
            .monster-grid {
                grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
                gap: 12px;
            }
            .monster-avatar {
                width: 72px;
                height: 72px;
            }
            .detail-header {
                justify-content: center;
                text-align: center;
            }
            .detail-avatar {
                width: 100px;
                height: 100px;
            }
        }
    </style>
</head>

        // DOM元素
        const container = document.getElementById('monsterContainer');
        const filterTags = document.querySelectorAll('.filter-tag');
        const searchInput = document.querySelector('.search-input');
        const clearBtn = document.querySelector('.clear-btn');
        const detailMask = document.getElementById('detailMask');
        const closeDetailBtn = document.getElementById('closeDetailBtn');
        const detailImg = document.getElementById('detailImg');
        const detailName = document.getElementById('detailName');
        const detailType = document.getElementById('detailType');
        const detailDesc = document.getElementById('detailDesc');
        let currentFilter = null;
        let searchKey = '';
        // 渲染怪物列表
        function renderList(){
            let data = [...monsterList];
            if(currentFilter) data = data.filter(item=>item.type===currentFilter);
            if(searchKey) data = data.filter(item=>item.name.includes(searchKey));
            container.innerHTML = '';
            data.forEach(monster=>{
                const card = document.createElement('div');
                card.className = 'monster-card';
                card.innerHTML = `
                    <img class="monster-avatar" src="${monster.img}" alt="${monster.name}">
                    <div class="monster-name">${monster.name}</div>
                `
                // 点击卡片打开弹窗详情
                card.addEventListener('click',()=>openDetail(monster));
                container.appendChild(card);
            })
        }
        // 打开详情弹窗（单页面弹窗，不跳转新HTML）
        function openDetail(monster){
            detailImg.src = monster.img;
            detailName.innerText = monster.name;
            detailType.innerText = monster.typeText;
            detailDesc.innerText = monster.desc;
            detailMask.style.display = 'flex';
            document.body.style.overflow = 'hidden';
        }
        // 关闭弹窗
        function closeDetail(){
            detailMask.style.display = 'none';
            document.body.style.overflow = '';
        }
        closeDetailBtn.addEventListener('click', closeDetail);
        detailMask.addEventListener('click', (e)=>{
            if(e.target === detailMask) closeDetail();
        })
        // 筛选切换逻辑
        filterTags.forEach(tag=>{
            tag.addEventListener('click',()=>{
                const type = tag.dataset.type;
                if(currentFilter === type){
                    currentFilter = null;
                    tag.classList.remove('active');
                }else{
                    filterTags.forEach(t=>t.classList.remove('active'));
                    currentFilter = type;
                    tag.classList.add('active');
                }
                renderList();
            })
        })
        // 实时搜索
        searchInput.addEventListener('input',e=>{
            searchKey = e.target.value.trim();
            renderList();
        })
        // 清空搜索按钮
        clearBtn.addEventListener('click',()=>{
            searchInput.value = '';
            searchKey = '';
            renderList();
        })
        // 页面初始化渲染
        renderList();
    </script>
</body>
