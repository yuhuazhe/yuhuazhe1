<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <link rel="icon" href="资料库.png">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title></title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #000;
            color: #fff;
            font-family: sans-serif;
            padding: 20px;
        }

        /* 顶部标题框 */
        .header-box {
            border: 2px solid #999;
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            background-color: rgba(0,0,0,0.6);
            margin-bottom: 40px;
        }
        .header-title {
            font-size: 40px;
            color: #b76ed8;
            font-weight: bold;
            margin: 0 0 10px;
        }
        .header-subtitle {
            font-size: 22px;
            color: #ddd;
            margin: 0 0 10px;
        }
        .header-note {
            font-size: 16px;
            color: #bbb;
            line-height: 1.5;
        }

        /* 角色卡片容器 */
        .card-container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        /* 角色卡片样式 */
        .char-card {
            width: 180px;
            border: 2px solid #999;
            border-radius: 12px;
            overflow: hidden;
            background-color: rgba(0,0,0,0.6);
            text-align: center;
            text-decoration: none; /* 去掉链接下划线 */
            color: inherit;       /* 文字颜色继承 */
        }
        .char-card img {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
        }
        .char-name {
            padding: 10px 0;
            font-size: 18px;
            color: #fff;
        }
    </style>

</head>
<body>
    
    <!-- 顶部标题框 -->
    <div class="header-box">
        <h1 class="header-title">计算公式</h1>
        <p class="header-subtitle">更新至星超导计算公式 最后更新日期：2026.6.3</p>
        <p class="header-note">公式源于网络验证后上传<br></p>
    </div>




<div class="header-box">
        <h2 class="header-title">星超导计算公式</h2>
        <p class="header-subtitle"></p>
        <p class="header-note">公式源于网络验证后上传<br></p>
        <P>注：星超导反应无反应伤害只有星超导直伤/前后台角色满足条件均可造成星超导直伤</P>
        <P>计算公式可由月反应做类推</P>


    </div>
