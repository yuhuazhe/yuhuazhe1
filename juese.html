<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <link rel="icon" href="资料库.png">
    <link rel="preconnect" href="https://yuhuazhe.github.io" crossorigin>
    <link rel="dns-prefetch" href="https://yuhuazhe.github.io">
    <link rel="preload" href="zhanshi/1.0.jpg" as="image" type="image/jpeg">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>角色数据</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow-x: hidden;
        }
        body {
            /* 全屏底图 */
            background: url("zhanshi/1.0.jpg") no-repeat center center;
            background-size: cover;
            background-attachment: fixed;
            color: #fff;
            font-family: sans-serif;
            padding: 16px;
            min-height: 100vh;
        }
        /* 顶部标题框 磨砂效果 */
        .header-box {
            border: 1px solid rgba(183, 110, 216, 0.3);
            border-radius: 16px;
            padding: 16px;
            text-align: center;
            background-color: rgba(0,0,0,0.18);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            margin-bottom: 24px;
        }
        .header-title {
            font-size: 32px;
            color: #b76ed8;
            font-weight: bold;
            margin: 0 0 8px;
        }
        .header-note {
            font-size: 14px;
            color: #eee;
            line-height: 1.4;
            margin-bottom: 10px;
        }
        .header-box a {
            color: #c78cdf;
            font-size: 14px;
        }
        /* 滚动外层容器 磨砂主体区域 */
        .scroll-wrap {
            max-width: 800px;
            margin: 0 auto;
            max-height: 60vh;
            overflow-y: auto;
            padding: 12px 10px; /* 右侧加宽内边距，避免内容挡住滚动条 */
            border-radius: 14px;
            background: rgba(20, 20, 20, 0.12);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(183, 110, 216, 0.15);
        }
        /* ========== 强化滚动条样式，清晰可见 ========== */
        .scroll-wrap::-webkit-scrollbar {
            width: 8px; /* 加宽滚动条宽度 */
        }
        /* 滚动条轨道 */
        .scroll-wrap::-webkit-scrollbar-track {
            background: rgba(255,255,255,0.1);
            border-radius: 4px;
        }
        /* 滚动滑块（紫色高亮，辨识度高） */
        .scroll-wrap::-webkit-scrollbar-thumb {
            background: rgba(183, 110, 216, 0.6);
            border-radius: 4px;
        }
        /* 鼠标悬浮滑块加深颜色 */
        .scroll-wrap::-webkit-scrollbar-thumb:hover {
            background: rgba(183, 110, 216, 0.8);
        }
        /* 角色列表 */
        .role-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        /* 角色条目 轻微磨砂 */
        .role-item {
            display: block;
            width: 100%;
            border-radius: 10px;
            background: rgba(40, 40, 40, 0.1);
            backdrop-filter: blur(3px);
            -webkit-backdrop-filter: blur(3px);
            border: 1px solid rgba(183, 110, 216, 0.2);
            text-decoration: none;
            color: #fff;
            padding: 10px 16px;
            text-align: center;
            transition: all 0.2s ease;
        }
        .role-item:hover {
            background: rgba(183, 110, 216, 0.22);
            border-color: rgba(183, 110, 216, 0.4);
            transform: translateY(-2px);
        }
        .role-name {
            font-size: 18px;
            margin-bottom: 4px;
            color: #fff;
        }
        .role-desc {
            font-size: 12px;
            color: #e0e0e0;
            line-height: 1.5;
        }
        /* 手机端适配 */
        @media (max-width: 640px) {
            body {
                padding: 12px;
            }
            .header-title {
                font-size: 24px;
            }
            .scroll-wrap {
                max-height: 65vh;
                padding: 10px 8px;
            }
            .role-item {
                padding: 8px 12px;
            }
            .role-name {
                font-size: 16px;
            }
            .role-desc {
                font-size: 11px;
            }
            /* 移动端滚动条缩小一点 */
            .scroll-wrap::-webkit-scrollbar {
                width: 6px;
            }
        }
    </style>
</head>
<body>
    <!-- 顶部标题框 -->
