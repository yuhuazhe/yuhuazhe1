<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="dns-prefetch" href="//raw.githubusercontent.com">
    <link rel="preconnect" href="//raw.githubusercontent.com" crossorigin>
    <title>羽化哲</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
        }
        body {
            min-height: 100vh;
            background:#08080c url("1.1.webp") center/cover no-repeat fixed;
            color:#f2f2f7;
            padding:0;
            overflow:hidden;
        }
        body::before{
            content:"";
            position:fixed;
            inset:0;
            background:rgba(0,0,0,0.6);
            z-index:-1;
        }
        .wrap{
            max-width:1300px;
            margin:0 auto;
            height:100vh;
            display:flex;
            flex-direction:column;
            min-width:0;
        }
        .fixed-top-area{
            flex-shrink: 0;
            padding:12px 8px 0 8px;
            min-width:0;
        }
        h1{
            text-align:center;
            margin-bottom:14px;
            font-size:clamp(20px,5vw,32px);
        }
        .filter-box{
            background:rgba(255,255,255,0.06);
            backdrop-filter:blur(12px);
            -webkit-backdrop-filter:blur(12px);
            border:1px solid rgba(255,255,255,0.12);
            border-radius:14px;
            padding:12px;
            margin-bottom:12px;
            display:grid;
            gap:10px;
        }
        @media(min-width:680px){
            .filter-box{
                grid-template-columns:1fr 130px 160px 140px;
            }
        }
        .filter-item label{
            font-size:13px;
            color:#ccc;
            display:block;
            margin-bottom:4px;
        }
        .filter-item select,
        .filter-item input{
            width:100%;
            padding:9px;
            background:rgba(255,255,255,0.07);
            border:1px solid rgba(255,255,255,0.14);
            color:#fff;
            border-radius:8px;
            font-size:14px;
        }
        .filter-item select option{
            color:#000000;
        }
        .filter-item button{
            width:100%;
            padding:9px;
            background:rgba(255,255,255,0.07);
            border:1px solid rgba(255,255,255,0.14);
            color:#fff;
            border-radius:8px;
            font-size:14px;
            font-family:inherit;
            cursor:pointer;
            transition:0.2s ease;
            -webkit-tap-highlight-color:transparent;
        }
        .filter-item button:hover{
            background:rgba(255,255,255,0.15);
        }
        .filter-item button.active{
            background:rgba(116,170,255,0.32);
            border-color:rgba(116,170,255,0.85);
            font-weight:bold;
        }
        @media(min-width:680px){
            .filter-item--btn{
                align-self:end;
            }
        }

        /* 外层：垂直滚动 */
        .outer-scroll{
            flex: 1;
            overflow-y: auto;
            padding:0 8px 12px 8px;
            min-width:0;
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .outer-scroll::-webkit-scrollbar{
            display:none;
        }

        /* 内层：横向滚动，所有表格行全部放在这里！ */
        .x-scroll{
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            padding-bottom:4px;
        }
        .x-scroll::-webkit-scrollbar{
            height:4px;
        }
        .x-scroll::-webkit-scrollbar-thumb{
            background:rgba(255,255,255,0.25);
            border-radius:4px;
        }

        /* ========= PC表格：CSS Grid 写死每一列像素，彻底杜绝对不齐 ========= */
        .grid-row{
            display: grid;
            /* 【重点】所有行，表头+数据行，完全一模一样的列宽度定义 */
            grid-template-columns: 220px 140px 160px 80px 130px 100px 110px 180px;
            gap:8px;
            align-items:center;
            min-width: 1028px;
            padding:10px 12px;
        }
        .grid-header{
            border-radius:12px;
            backdrop-filter:blur(16px);
            -webkit-backdrop-filter:blur(16px);
            border:1px solid rgba(255,255,255,0.12);
            background:rgba(255,255,255,0.09);
            position: sticky;
            top:0;
            z-index: 10;
        }
        .grid-item{
            border-radius:12px;
            backdrop-filter:blur(16px);
            -webkit-backdrop-filter:blur(16px);
            border:1px solid rgba(255,255,255,0.12);
            background:rgba(255,255,255,0.04);
            margin-bottom:8px;
            transition:0.2s ease;
        }
        .grid-item:hover{
            background:rgba(255,255,255,0.08);
            border-color:rgba(255,255,255,0.2);
        }
        .cell{
            font-size:13px;
            overflow:hidden;
            text-overflow:ellipsis;
            white-space:nowrap;
        }
        .cell-header{
            color:#b4c8ff;
            font-weight:bold;
        }
        .col-avatar-wrap{
            display:flex;
            gap:4px;
        }
        .avatar-circle{
            width:48px;
            height:48px;
            border-radius:50%;
            border:2px solid rgba(255,255,255,0.22);
            overflow:hidden;
            background:rgba(0,0,0,0.35);
            flex-shrink:0;
            display:flex;
            align-items:center;
            justify-content:center;
        }
        .avatar-circle img{
            max-width:100%;
            max-height:100%;
            width:auto;
            height:auto;
            object-fit:contain;
            decoding:"async";
            loading="lazy";
        }
        a{
            color:#74aaff;
            text-decoration:none;
            font-size:12px;
        }

        /* ========= 手机端卡片模式 ========= */
        @media (max-width:679px){
            .grid-row{
                display:none !important;
            }
            .mobile-card{
                backdrop-filter:blur(16px);
                -webkit-backdrop-filter:blur(16px);
                border:1px solid rgba(255,255,255,0.12);
                border-radius:14px;
                background:rgba(255,255,255,0.04);
                padding:14px;
                margin-bottom:10px;
            }
            .mobile-card__avatar-row{
                display:flex;
                gap:6px;
                margin-bottom:10px;
            }
            .mobile-card__row{
                display:flex;
                font-size:13px;
                margin:4px 0;
            }
            .mobile-card__label{
                color:#b4c8ff;
                flex:0 0 75px;
                font-weight:bold;
            }
            .mobile-card__value{
                flex:1;
                word-break:break-all;
            }
            .avatar-circle{
                width:42px;
                height:42px;
            }
        }
        @media (min-width:680px){
            .mobile-card{
                display:none !important;
            }
        }
    </style>
</head>

const selGold = document.getElementById("selGold");
const selSort = document.getElementById("selSort");
const btnTopGold = document.getElementById("btnTopGold");

/* “同金数最高”开关：开启后只保留同金数中 DPS 最高的队伍 */
let onlyTopPerGold = false;

function getAvatarHtml(avatars){
    let html = "";
    for(let i=0;i<4;i++){
        html += avatars[i]
            ?`<div class="avatar-circle"><img src="${avatars[i]}" loading="lazy"></div>`
            :`<div class="avatar-circle"></div>`;
    }
    return html;
}

function buildPcRow(item){
    const meta = teamMeta[item.team] || {avatars:[],video:""};
    const avatars = item.avatars??meta.avatars;
    const videoUrl = item.video??meta.video;
    const avHtml = getAvatarHtml(avatars);
    const vlink = videoUrl ? `<a href="${videoUrl}" target="_blank">${videoUrl}</a>`:"无";
    return `
<div class="grid-row grid-item">
    <div class="col-avatar-wrap">${avHtml}</div>
    <div class="cell">${item.team}</div>
    <div class="cell">${item.config}</div>
    <div class="cell">${item.gold}</div>
    <div class="cell">${item.dps}</div>
    <div class="cell">${item.fullEnergy}</div>
    <div class="cell">${item.configInfo}</div>
    <div class="cell">${vlink}</div>
</div>`;
}

function buildMobileCard(item){
    const meta = teamMeta[item.team] || {avatars:[],video:""};
    const avatars = item.avatars??meta.avatars;
    const videoUrl = item.video??meta.video;
    const avHtml = getAvatarHtml(avatars);
    const vlink = videoUrl ? `<a href="${videoUrl}" target="_blank">${videoUrl}</a>`:"无";
    return `
<div class="mobile-card">
    <div class="mobile-card__avatar-row">${avHtml}</div>
    <div class="mobile-card__row"><span class="mobile-card__label">队伍：</span><span class="mobile-card__value">${item.team}</span></div>

    <div class="mobile-card__row"><span class="mobile-card__label">视频：</span><span class="mobile-card__value">${vlink}</span></div>
</div>`;

function render(){
    let arr = JSON.parse(JSON.stringify(dataList));
    const kw = inpTeam.value.trim().toLowerCase();
    if(kw) arr = arr.filter(x=>x.team.toLowerCase().includes(kw));
    const g = selGold.value;
    if(g !== "all") arr = arr.filter(x=>x.gold===Number(g));

    /* 同金数最高：
       - 已选定具体金数：只保留该金数下 DPS 最高的队伍（并列最高全部保留）
       - 金数为“全部”：每个金数各保留其 DPS 最高的队伍 */
    if(onlyTopPerGold && arr.length){
        if(g !== "all"){
            const top = Math.max(...arr.map(x=>x.dps));
            arr = arr.filter(x=>x.dps===top);
        }else{
            const topOfGold = {};
            arr.forEach(x=>{
                if(topOfGold[x.gold] === undefined || x.dps > topOfGold[x.gold]) topOfGold[x.gold] = x.dps;
            });
            arr = arr.filter(x=>x.dps===topOfGold[x.gold]);
        }
    }

    if(selSort.value==="desc") arr.sort((a,b)=>b.dps - a.dps);
    else arr.sort((a,b)=>a.dps - b.dps);

    listPc.innerHTML = "";
    listMobile.innerHTML = "";
    arr.forEach(d=>{
        listPc.innerHTML += buildPcRow(d);
        listMobile.innerHTML += buildMobileCard(d);
    })
}

inpTeam.addEventListener("input",render);
selGold.addEventListener("change",render);
selSort.addEventListener("change",render);
btnTopGold.addEventListener("click",()=>{
    onlyTopPerGold = !onlyTopPerGold;
    btnTopGold.classList.toggle("active",onlyTopPerGold);
    btnTopGold.setAttribute("aria-pressed",onlyTopPerGold ? "true" : "false");
    render();
});
render();
</script>
</body>
</html>
