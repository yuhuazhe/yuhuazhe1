<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- Github Pages 加载加速：DNS预解析、预连接 -->
    <link rel="dns-prefetch" href="//raw.githubusercontent.com">
    <link rel="preconnect" href="//raw.githubusercontent.com" crossorigin>
    <title>羽化哲</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
        }
        body {
            min-height: 100vh;
            background:#08080c url("1.1.webp") center/cover no-repeat fixed;
            color:#f2f2f7;
            padding:0;
            overflow:hidden;
        }
        body::before{
            content:"";
            position:fixed;
            inset:0;
            background:rgba(0,0,0,0.6);
            z-index:-1;
        }
        .wrap{
            max-width:1300px;
            margin:0 auto;
            height:100vh;
            display:flex;
            flex-direction:column;
        }
        /* 顶部固定区域：标题、筛选、表头，固定，不滚动 */
        .fixed-top-area{
            flex-shrink: 0;
            padding:12px 8px 0 8px;
        }
        h1{
            text-align:center;
            margin-bottom:14px;
            font-size:clamp(20px,5vw,32px);
        }
        .filter-box{
            background:rgba(255,255,255,0.06);
            backdrop-filter:blur(12px);
            -webkit-backdrop-filter:blur(12px);
            border:1px solid rgba(255,255,255,0.12);
            border-radius:14px;
            padding:12px;
            margin-bottom:12px;
            display:grid;
            gap:10px;
        }
        @media(min-width:680px){
            .filter-box{
                grid-template-columns:1fr 130px 160px 140px;
            }
        }
        .filter-item label{
            font-size:13px;
            color:#ccc;
            display:block;
            margin-bottom:4px;
        }
        .filter-item select,
        .filter-item input{
            width:100%;
            padding:9px;
            background:rgba(255,255,255,0.07);
            border:1px solid rgba(255,255,255,0.14);
            color:#fff;
            border-radius:8px;
            font-size:14px;
        }
        .filter-item select option{
            color:#000000;
        }

        /* ========== 移动端表格横向滚动容器 ========== */
        .table-wrap{
            overflow-x:auto;
            -webkit-overflow-scrolling: touch;
        }
        .table-wrap::-webkit-scrollbar{
            height:4px;
        }
        .table-wrap::-webkit-scrollbar-thumb{
            background:rgba(255,255,255,0.2);
            border-radius:4px;
        }

        .table-row-header{
            display:flex;
            align-items:center;
            gap:8px;
            min-width:920px; /* 强制最小宽度，手机下触发横向滚动 */
            padding:10px 12px;
            border-radius:12px;
            backdrop-filter:blur(16px);
            -webkit-backdrop-filter:blur(16px);
            border:1px solid rgba(255,255,255,0.12);
            margin-bottom:8px;
            background:rgba(255,255,255,0.09);
        }
        /* 只有这个盒子可以【上下滚动】，隐藏右侧滚动条 */
        .scroll-list-container{
            flex:1;
            overflow-y:auto;
            overflow-x:hidden;
            padding:0 8px 12px 8px;
            /* 隐藏滚动条，保留滚动能力 */
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .scroll-list-container::-webkit-scrollbar {
            display: none;
        }
        .table-row-item{
            display:flex;
            align-items:center;
            gap:8px;
            min-width:920px; /* 和表头对齐，手机横向滚动 */
            padding:10px 12px;
            border-radius:12px;
            backdrop-filter:blur(16px);
            -webkit-backdrop-filter:blur(16px);
            border:1px solid rgba(255,255,255,0.12);
            margin-bottom:8px;
            transition: 0.2s ease;
            background:rgba(255,255,255,0.04);
        }
        .table-row-item:hover{
            background:rgba(255,255,255,0.08);
            border-color:rgba(255,255,255,0.2);
        }
        .col-avatar{
            flex:0 0 220px;
            display:flex;
            gap:4px;
        }
        .col-t{
            flex:1;
            min-width:90px;
            font-size:13px;
        }
        .table-row-header .col-t{
            color:#b4c8ff;
            font-weight:bold;
        }
        .avatar-circle{
            width:clamp(42px,11vw,70px);
            height:clamp(42px,11vw,70px);
            border-radius:50%;
            border:2px solid rgba(255,255,255,0.22);
            overflow:hidden;
            background:rgba(0,0,0,0.35);
            flex-shrink:0;
            display:flex;
            align-items:center;
            justify-content:center;
        }
        .avatar-circle img{
            max-width:100%;
            max-height:100%;
            width:auto;
            height:auto;
            object-fit:contain;
            /* 性能优化 */
            decoding="async";
            loading="lazy";
        }
        a{
            color:#74aaff;
            text-decoration:none;
            font-size:12px;
        }

        @media (max-width:679px){
            .col-avatar{
                flex:0 0 180px;
            }
        }
    </style>
</head>

const inpTeam = document.getElementById("inpTeam");
const selGold = document.getElementById("selGold");
const selSort = document.getElementById("selSort");
const listBox = document.getElementById("listBox");
function buildCard(item){
    const meta = teamMeta[item.team] || {avatars:[], video:""};
    // 兼容：单条自身携带优先，否则取公共元数据
    const avatars = item.avatars ?? meta.avatars;
    const videoUrl = item.video ?? meta.video;
    let avHtml = "";
    for(let i=0;i<4;i++){
        if(avatars[i]){
            avHtml += `<div class="avatar-circle"><img src="${avatars[i]}" loading="lazy" decoding="async"></div>`;
        }else{
            avHtml += `<div class="avatar-circle"></div>`;
        }
    }
    const vlink = videoUrl ? `<a href="${videoUrl}" target="_blank">${videoUrl}</a>` : "无";
    return `
<div class="table-row-item">
    <div class="col-avatar">${avHtml}</div>
    <div class="col-t">${item.team}</div>
    <div class="col-t">${item.config}</div>
    <div class="col-t">${item.gold}</div>
    <div class="col-t">${item.dps}</div>
    <div class="col-t">${item.fullEnergy}</div>
    <div class="col-t">${item.configInfo}</div>
    <div class="col-t">${vlink}</div>
</div>`
}
function render(){
    let arr = JSON.parse(JSON.stringify(dataList));
    const kw = inpTeam.value.trim().toLowerCase();
    if(kw) arr = arr.filter(x=>x.team.toLowerCase().includes(kw));
    const g = selGold.value;
    if(g !== "all"){
        arr = arr.filter(x=>x.gold===Number(g));
    }
    if(selSort.value==="desc") arr.sort((a,b)=>b.dps - a.dps);
    else arr.sort((a,b)=>a.dps - b.dps);
    listBox.innerHTML = "";
    arr.forEach(d=>{
        listBox.innerHTML += buildCard(d);
    });
}
inpTeam.addEventListener("input",render);
selGold.addEventListener("change",render);
