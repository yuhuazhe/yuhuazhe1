<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>羽化哲</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #0b0b10;
            color: #e2e2e8;
            font-family: system-ui, -apple-system, sans-serif;
            min-height: 100vh;
        }
        /* 登录遮罩层，强制置顶 */
        .login-mask {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.92);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        .login-box {
            width: 100%;
            max-width: 380px;
            background: rgba(25,25,35,0.75);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 14px;
            padding: 32px 26px;
            backdrop-filter: blur(10px);
        }
        .login-box h2 {
            text-align: center;
            margin-bottom: 26px;
            font-weight: 500;
            color:#f0f0f6;
        }
        .input-item {
            margin-bottom: 18px;
        }
        .input-item label {
            display:block;
            margin-bottom:6px;
            font-size:14px;
            color:#b8b8c8;
        }
        .input-item input {
            width:100%;
            padding:12px 14px;
            border-radius:8px;
            border:1px solid rgba(255,255,255,0.14);
            background:rgba(12,12,18,0.65);
            color:#fff;
            font-size:15px;
            outline:none;
        }
        .input-item input:focus {
            border-color:#6366f1;
        }
        .tip-text {
            font-size:13px;
            color:#ff8888;
            min-height:20px;
            margin:8px 0 16px;
        }
        .login-btn {
            width:100%;
            padding:13px;
            border-radius:8px;
            border:none;
            background:#4f46e5;
            color:white;
            font-size:15px;
            cursor:pointer;
            transition:0.2s;
        }
        .login-btn:disabled {
            background:#2c2c44;
            cursor:not-allowed;
            color:#888;
        }
        .login-btn:hover:not(:disabled) {
            background:#4338ca;
        }

        /* 主页容器，默认隐藏，登录成功才渲染 */
        .main-container {
            width:100%;
            min-height:100vh;
            padding:40px 20px;
            max-width:1200px;
            margin:0 auto;
            display:none;
        }
        .grid-wrap {
            display:grid;
            grid-template-columns: repeat(4,1fr);
            gap:24px;
        }
        /* 全透明板块，完全透明背景，仅边框 */
        .card-item a {
            display:block;
            min-height:220px;
            border:1px solid rgba(255,255,255,0.16);
            border-radius:12px;
            background:transparent;
            padding:24px 18px;
            text-decoration:none;
            color:#e2e2e8;
            transition:0.25s ease;
        }
        .card-item a:hover {
            background:rgba(255,255,255,0.04);
            border-color:rgba(99, 102, 241, 0.45);
        }
        .card-item h3 {
            margin-bottom:12px;
            font-size:18px;
        }
        .card-item p {
            font-size:14px;
            color:#b0b0c4;
            line-height:1.6;
        }

        /* 响应式适配 */
        @media(max-width:900px){
            .grid-wrap {
                grid-template-columns: repeat(2,1fr);
            }
        }
        @media(max-width:520px){
            .grid-wrap {
                grid-template-columns: 1fr;
            }
            .main-container {
                padding:24px 14px;
            }
        }
    </style>
</head>
<body>
   
    <div class="login-mask" id="loginMask">
        <div class="login-box">
            <h2>管理登录</h2>
            <div class="input-item">
                <label>账号</label>
                <input id="userInput" type="text" autocomplete="off">
            </div>
            <div class="input-item">
                <label>密码</label>
                <input id="pwdInput" type="password" autocomplete="off">
            </div>
            <div class="tip-text" id="tipDom"></div>
            <button class="login-btn" id="loginBtn">登录</button>
        </div>
    </div>

    <div class="main-container" id="pageMain"></div>

<script>

document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('keydown',e=>{
    const keys = ['F12','i','u','s'];
    if(e.key==='F12') e.preventDefault();
    if(e.ctrlKey && e.shiftKey && e.key.toLowerCase()==='i') e.preventDefault();
    if(e.ctrlKey && e.key.toLowerCase()==='u') e.preventDefault();
    if(e.ctrlKey && e.key.toLowerCase()==='s') e.preventDefault();
});

function getRealAuth(){
  
    const s1 = ['y','u','h','u','a','z','h','e'];
    const s2 = ['1','2','3','4','5','6'];
    return {
        acc: s1.join(''),
        pass: s2.join('')
    }
}


const LOCK_DURATION = 3 * 60 * 60 * 1000;
const MAX_ERR = 3;

const loginMask = document.getElementById('loginMask');
const pageMain = document.getElementById('pageMain');
const userInput = document.getElementById('userInput');
const pwdInput = document.getElementById('pwdInput');
const loginBtn = document.getElementById('loginBtn');
const tipDom = document.getElementById('tipDom');


function getLockInfo(){
    const errCount = Number(localStorage.getItem('_errCnt')||0);
    const lockTs = Number(localStorage.getItem('_lockTs')||0);
    return {errCount,lockTs};
}
function clearLock(){
    localStorage.removeItem('_errCnt');
    localStorage.removeItem('_lockTs');
}
function addErrorCount(){
    const {errCount} = getLockInfo();
    const newCnt = errCount + 1;
    localStorage.setItem('_errCnt', String(newCnt));
    if(newCnt >= MAX_ERR){
        localStorage.setItem('_lockTs', String(Date.now()));
    }
}

function renderHomePage(){
    pageMain.style.display = 'block';
    pageMain.innerHTML = `
        <div class="grid-wrap">
            <div class="card-item">
                <a href="https://gi.nanoka.cc/monster" target="_blank">
                    <h3>板块一</h3>
                    <p>网站1</p>
                </a>
            </div>
            <div class="card-item">
                <a href="https://lunaris.moe/"_blank">
                    <h3>板块二</h3>
                    <p>月亮网</p>
                </a>
            </div>
            <div class="card-item">
                <a href="https://gensh.honeyhunterworld.com/?lang=CHS" target="_blank">
                    <h3>板块三</h3>
                    <p>网站3</p>
                </a>
            </div>
            <div class="card-item">
                <a href="https://gi.gachabase.net/changelog/beta?lang=en@." target="_blank">
                    <h3>板块四</h3>
                    <p>网站4</p>
                </a>
            </div>
        </div>
    `;
}

// 登录校验逻辑
function doLogin(){
    const {errCount, lockTs} = getLockInfo();
    const now = Date.now();
    // 判断是否处于锁定状态
    if(lockTs>0 && (now - lockTs) < LOCK_DURATION){
        const remainMs = LOCK_DURATION - (now-lockTs);
        const remainHour = Math.floor(remainMs/(1000*60*60));
        const remainMin = Math.floor((remainMs%(1000*60*60))/(1000*60));
        tipDom.innerText = `已输错${MAX_ERR}次，请等待 ${remainHour}小时${remainMin}分钟后重试`;
        loginBtn.disabled = true;
        return;
    }
    loginBtn.disabled = false;
    tipDom.innerText = '';

    const inputAcc = userInput.value.trim();
    const inputPwd = pwdInput.value.trim();
    const auth = getRealAuth();

    if(inputAcc === auth.acc && inputPwd === auth.pass){
        // 登录成功，清除错误计数，关闭登录弹窗，渲染主页
        clearLock();
        loginMask.style.display = 'none';
        renderHomePage();
    }else{
        addErrorCount();
        const newErrInfo = getLockInfo();
        tipDom.innerText = `账号或密码错误，剩余尝试次数：${MAX_ERR-newErrInfo.errCount}`;
        pwdInput.value = '';
    }
}

loginBtn.addEventListener('click',doLogin);
pwdInput.addEventListener('keydown',e=>{
    if(e.key==='Enter') doLogin();
});
userInput.addEventListener('keydown',e=>{
    if(e.key==='Enter') doLogin();
});

// 页面加载初始化锁定状态
(function initLockState(){
    const {errCount, lockTs} = getLockInfo();
    const now = Date.now();
    if(lockTs>0 && (now-lockTs) < LOCK_DURATION){
        const remainMs = LOCK_DURATION - (now-lockTs);
        const remainHour = Math.floor(remainMs/(1000*60*60));
        const remainMin = Math.floor((remainMs%(1000*60*60))/(1000*60));
        tipDom.innerText = `已输错${MAX_ERR}次，请等待 ${remainHour}小时${remainMin}分钟后重试`;
        loginBtn.disabled = true;
    }
})();
</script>
</body>
</html>
