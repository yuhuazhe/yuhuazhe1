    <style>

 



        *{
            margin:0;
            padding:0;
            box-sizing: border-box;
        }
        body{
            background-color: #121212;
            color:#ddd;
            font-family: "Microsoft Yahei",sans-serif;
            display: flex;
            justify-content: center;
            padding:40px 16px;
        }
        .container{
            width:100%;
            max-width:720px;
        }
        a{
            text-decoration: none;
        }
        /*标题*/
        .title-group h1{
            font-size:clamp(36px,8vw,56px);
            font-weight:normal;
            color:#ee2828;
        }
        .title-group p{
            font-size:clamp(20px,4vw,32px);
            color:#b9b9b9;
            margin-top:8px;
            font-style:italic;
        }
        .split-line{
            width:100%;
            height:1px;
            background:#444;
            margin:36px 0;
        }
        /*卡片改为左右并排，手机自动变回上下堆叠*/
        .card-wrap{
            display:flex;
            gap:16px;
            flex-wrap: wrap;
        }
        .card-wrap > a{
            flex:1;
            min-width:280px;
        }
        .card-item{
            border:2px solid #777;
            border-radius:18px;
            overflow:hidden;
            position:relative;
        }
        .card-item img{
            width:100%;
            display:block;
        }
        .card-text{
            position:absolute;
            left:20px;
            bottom:20px;
            color:#fff;
        }
        .card-text .cn{
            font-size:clamp(18px,4vw,22px);
        }
        .card-text .en{
            font-size:clamp(14px,3vw,17px);
            opacity:0.85;
        }
        /*底部提示栏*/
        .tip-bar{
            display:flex;
            align-items:center;
            background:#ff9898;
            padding:14px 18px;
            border-radius:12px;
            margin-top:50px;
            gap:12px;
            flex-wrap: wrap;
        }
        .close-x{
            color:#fff;
            font-size:22px;
        }
        .tip-text{
            flex:1;
            font-size:clamp(16px,3vw,20px);
        }
        .btn-restore{
            background:#2578f5;
            color:#fff;
            border:none;
            padding:10px 22px;
            border-radius:8px;
            font-size:clamp(16px,3vw,20px);
            white-space: nowrap;
        }
    </style>
</head>
