<!DOCTYPE html>
<html lang="zh-CN" style="scroll-behavior: smooth;">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>羽化哲</title>
<style>
  /* ===== 固定配色（仅文字颜色） ===== */
  :root {
    --ink: #e8eaed;
    --ink-2: #c3c9d3;
    --ink-3: #9aa2ae;
    --accent: #f0a05a;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; overflow-x: hidden; }
  ::-webkit-scrollbar { display: none !important; width: 0; }
  html { scrollbar-width: none; -ms-overflow-style: none; }

  body {
    /* ===== 底图 ===== */
    background-color: #16181d;
    background-image: url("背景2.jpg");
    background-position: center;
    background-size: cover;
    background-repeat: no-repeat;
    background-attachment: fixed;

    color: var(--ink);
    font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    min-height: 100vh;
    padding: 40px 16px 56px;
    position: relative;
  }

  .page-container {
    position: relative;
    z-index: 1;
    max-width: 960px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 26px;
  }

  /* ===== 页头 ===== */
  .page-header {
    text-align: center;
    padding: 2px 0 2px;
  }
  .page-header h1 {
    font-family: Georgia, "Noto Serif SC", "Songti SC", serif;
    font-size: clamp(20px, 3vw, 27px);
    font-weight: 700;
    color: var(--accent);
    letter-spacing: 3px;
    line-height: 1.2;
    margin-bottom: 7px;
    text-shadow: 0 1px 4px rgba(0, 0, 0, 0.55);
  }
  .page-header .subtitle {
    font-size: 11.5px;
    color: var(--ink-2);
    letter-spacing: 0.8px;
    text-shadow: 0 1px 4px rgba(0, 0, 0, 0.55);
  }
  .page-header .subtitle::before,
  .page-header .subtitle::after {
    content: "—";
    margin: 0 8px;
    color: var(--ink-3);
  }

  /* ===== 角色网格 ===== */
  .char-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
    gap: 14px;
  }

  /* ===== 全透明卡片 ===== */
  .char-card {
    background: transparent;
    backdrop-filter: none;
    -webkit-backdrop-filter: none;
    border: 1px solid transparent;
    box-shadow: none;
    border-radius: 14px;
    padding: 20px 10px 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    text-decoration: none;
    color: inherit;
    -webkit-tap-highlight-color: transparent;
  }
  a.char-card { cursor: pointer; }
  a.char-card:active { transform: scale(0.97); }
  a.char-card:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
  }
  a.char-card:hover .avatar { transform: scale(1.05); }

  /* 头像圆 */
  .avatar {
    width: 104px;
    height: 104px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 38px;
    font-weight: 800;
    color: #fff;
    text-shadow: 0 2px 6px rgba(0, 0, 0, 0.35);
    margin-bottom: 14px;
    border: 3px solid rgba(255, 255, 255, 0.25);
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
    flex: none;
    user-select: none;
    overflow: hidden;
    transition: transform 0.25s;
  }
  .avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 50%;
    display: block;
  }

  .char-name {
    font-size: 15px;
    font-weight: 800;
    color: var(--ink);
    letter-spacing: 0.6px;
    line-height: 1.4;
    text-shadow: 0 1px 4px rgba(0, 0, 0, 0.6);
  }

  /* ===== 页脚 ===== */
  .page-footer {
    text-align: center;
    padding: 12px 0 0;
    font-size: 11px;
    color: var(--ink-2);
    line-height: 1.85;
    text-shadow: 0 1px 4px rgba(0, 0, 0, 0.6);
  }
  .page-footer b { color: var(--accent); font-weight: 700; }

  /* ===== 响应式 ===== */
  @media (max-width: 720px) {
    body { padding: 50px 11px 42px; }
    .page-container { gap: 20px; }

    .page-header h1 { font-size: 18px; letter-spacing: 2px; margin-bottom: 5px; }
    .page-header .subtitle { font-size: 10.5px; }
    .page-header .subtitle::before,
    .page-header .subtitle::after { margin: 0 5px; }

    .char-grid {
      grid-template-columns: repeat(auto-fill, minmax(105px, 1fr));
      gap: 10px;
    }
    .char-card { padding: 14px 8px 12px; border-radius: 12px; }

    .avatar { width: 78px; height: 78px; font-size: 28px; margin-bottom: 10px; }
    .char-name { font-size: 13px; }
  }
</style>
</head>
<body>

<div class="page-container">

  <!-- 页头 -->
  <header class="page-header">
    <h1>角色</h1>
    <p class="subtitle">角色DPS/武器差距/角色攻略</p>
  </header>

  <!-- 角色网格（由 JS 渲染） -->
  <div class="char-grid" id="charGrid"></div>

</div>

<script>
/* ============================================================
   角色数据与渲染
   ------------------------------------------------------------
   url  —— 点击该角色卡片后跳转的地址
           · 写相对路径（如 "sangduonie.html"）或完整网址
           · 留空 "" 或直接删掉 url 字段 → 该卡片不可点击
           · 想在新标签页打开，给该角色加 newTab: true
============================================================ */
var characters = [
  { name: "桑多涅(老婆）", color: "#3b82f6", avatar: "sdn.png",  url: "sdn.html" },
  { name: "薇斯纳",       color: "#f59e0b", avatar: "wsn.webp", url: "" },
  { name: "米提亚",       color: "#8b5cf6", avatar: "mty.png",  url: "mty.html" }
];

/* 简单的 HTML 转义，防止名字里的特殊字符破坏结构 */
function esc(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

(function renderCharacters() {
  var grid = document.getElementById('charGrid');
  if (!grid) return;

  characters.forEach(function (c) {
    var name = c.name || '';
    var firstChar = name ? name.charAt(0) : '?';
    var color = c.color || '#3b82f6';

    /* 卡片容器：有 url 用 <a>，否则用 <div> */
    var card;
    if (c.url) {
      card = document.createElement('a');
      card.className = 'char-card';
      card.href = c.url;
      if (c.newTab) {
        card.target = '_blank';
        card.rel = 'noopener noreferrer';
      }
    } else {
      card = document.createElement('div');
      card.className = 'char-card';
    }
    card.title = name;

    /* 头像 */
    var avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.style.background =
      'linear-gradient(135deg, ' + color + ', ' + shadeColor(color, -30) + ')';

    if (c.avatar) {
      var img = document.createElement('img');
      img.src = c.avatar;
      img.alt = name;
      /* 图片加载失败 → 换成角色名首字（用 textContent，安全） */
      img.onerror = function () {
        img.onerror = null;
        avatar.textContent = firstChar;
      };
      avatar.appendChild(img);
    } else {
      avatar.textContent = firstChar;
    }

    /* 名字 */
    var nameEl = document.createElement('div');
    nameEl.className = 'char-name';
    nameEl.textContent = name;

    card.appendChild(avatar);
    card.appendChild(nameEl);
    grid.appendChild(card);
  });
})();

/* 颜色加深工具：把十六进制颜色变暗 */
function shadeColor(hex, percent) {
  var num = parseInt(hex.replace('#', ''), 16),
      amt = Math.round(2.55 * percent),
      R = (num >> 16) + amt,
      G = (num >> 8 & 0x00FF) + amt,
      B = (num & 0x0000FF) + amt;
  return '#' + (
    0x1000000 +
    (R < 255 ? R < 1 ? 0 : R : 255) * 0x10000 +
    (G < 255 ? G < 1 ? 0 : G : 255) * 0x100 +
    (B < 255 ? B < 1 ? 0 : B : 255)
  ).toString(16).slice(1);
}
</script>
</body>
</html>
