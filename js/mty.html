<!DOCTYPE html>
<html lang="zh-CN" style="scroll-behavior: smooth;">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>羽化哲</title>
<style>
  /* ===== 固定配色（蓝色系，透明板块） ===== */
  :root {
    --mono: "SF Mono", "JetBrains Mono", "Fira Code", Consolas, "Courier New", monospace;
    --ink: #e0f2fe;
    --ink-2: #93c5fd;
    --ink-3: #60a5fa;
    --accent: #38bdf8;
    --accent-2: #0ea5e9;
    --rule: rgba(96, 165, 250, 0.3);
    --rule-2: rgba(96, 165, 250, 0.5);
    --hover: rgba(56, 189, 248, 0.15);
    --hl-bg: rgba(56, 189, 248, 0.2);
    --hl-bg-strong: rgba(56, 189, 248, 0.4);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; overflow-x: hidden; }
  ::-webkit-scrollbar { display: none !important; width: 0; }
  html { scrollbar-width: none; -ms-overflow-style: none; }

  body {
    /* ===== 底图与暗色遮罩 ===== */
    background-color: #16181d;
    background-image: 
      linear-gradient(rgba(0, 0, 0, 0.45), rgba(0, 0, 0, 0.45)),
      url("背景2.jpg");
    background-position: center;
    background-size: cover;
    background-repeat: no-repeat;
    background-attachment: fixed;
    
    color: var(--ink);
    font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    font-size: 13px;
    min-height: 100vh;
    padding: 34px 16px 52px;
    position: relative;
  }

  /* 统一文字阴影，防止背景杂乱导致文字看不清 */
  body, h1, h2, h3, p, span, div, button, a, input {
    text-shadow: 0 1px 4px rgba(0, 0, 0, 0.9), 0 0 6px rgba(0, 0, 0, 0.6);
  }

  .page-container {
    position: relative;
    z-index: 1;
    max-width: 960px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  /* ===== 页头 ===== */
  .page-header {
    text-align: center;
    padding: 2px 0 2px;
  }
  .page-header h1 {
    font-family: Georgia, "Noto Serif SC", "Songti SC", serif;
    font-size: clamp(20px, 3vw, 27px);
    font-weight: 700;
    color: var(--accent);
    letter-spacing: 3px;
    line-height: 1.2;
    margin-bottom: 7px;
  }
  .page-header .subtitle {
    font-size: 11.5px;
    color: var(--ink-2);
    letter-spacing: 0.8px;
  }
  .page-header .subtitle::before,
  .page-header .subtitle::after {
    content: "—";
    margin: 0 8px;
    color: var(--ink-3);
  }

  /* ===== 图表列表 ===== */
  .chart-list {
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  /* ===== 全透明图表卡片 ===== */
  .chart-card {
    background: transparent;
    border: 1px solid var(--rule-2);
    border-radius: 12px;
    overflow: hidden;
  }

  .chart-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 10px 15px;
    border-bottom: 1px solid var(--rule);
  }
  .chart-head-left {
    display: flex;
    align-items: baseline;
    gap: 9px;
    flex-wrap: wrap;
    min-width: 0;
  }
  .chart-title {
    font-size: 13.5px;
    font-weight: 700;
    color: var(--ink);
    letter-spacing: 0.4px;
  }
  .chart-ver {
    font-family: var(--mono);
    font-size: 10px;
    font-weight: 700;
    color: #16181d; /* 反色文字 */
    background: var(--accent);
    padding: 2px 8px;
    border-radius: 20px;
    letter-spacing: 0.4px;
    text-shadow: none;
  }
  .chart-hint {
    font-size: 10.5px;
    color: var(--ink-3);
    white-space: nowrap;
  }

  /* 图片区域：透明 */
  .chart-img-box {
    position: relative;
    background: transparent;
    cursor: zoom-in;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 130px;
  }
  .chart-img-box img {
    display: block;
    width: 100%;
    height: auto;
  }

  .chart-img-box .fallback {
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 7px;
    padding: 44px 18px;
    color: var(--ink-3);
    font-size: 12.5px;
  }
  .chart-img-box.error .fallback { display: flex; }
  .chart-img-box.error img { display: none; }
  .fallback-icon { font-size: 26px; opacity: 0.4; }

  .chart-foot {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    padding: 8px 15px;
    font-size: 11px;
    color: var(--ink-3);
    flex-wrap: wrap;
  }
  .chart-foot .meta b {
    color: var(--accent);
    font-weight: 700;
  }
  .zoom-tip {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    opacity: 0.85;
  }

  /* ============================================================
     备注面板（全透明）
  ============================================================ */
  .note-panel {
    border-top: 1px solid var(--rule);
  }

  .note-toggle {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 10px 15px;
    background: transparent;
    border: none;
    cursor: pointer;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--ink-2);
    letter-spacing: 0.4px;
    text-align: left;
  }
  .note-toggle:hover {
    color: var(--accent);
  }
  .note-toggle .note-arrow {
    display: inline-block;
    font-size: 10px;
    color: var(--accent);
    flex: none;
  }
  .note-panel.open .note-toggle .note-arrow {
    transform: rotate(90deg);
  }

  .note-toggle .note-label { flex: none; }
  .note-toggle .note-hint {
    flex: 1;
    font-size: 10.5px;
    font-weight: 400;
    color: var(--ink-3);
    letter-spacing: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .note-body { display: none; }
  .note-panel.open .note-body { display: block; }

  .note-content {
    padding: 0 15px 14px;
    position: relative;
    z-index: 2;
  }

  /* —— 高亮展示卡：透明背景 —— */
  .cfg-preview {
    border: 1px solid var(--rule);
    border-radius: 9px;
    background: transparent;
    padding: 11px 13px;
  }
  .cfg-empty {
    font-size: 12px;
    color: var(--ink-3);
    text-align: center;
    padding: 8px 0;
    letter-spacing: 0.4px;
  }

  .cfg-sec {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1px;
    color: #16181d;
    background: var(--accent);
    padding: 3px 10px 3px 8px;
    border-radius: 999px;
    margin-bottom: 9px;
    text-shadow: none;
  }
  .cfg-sec-dot {
    width: 5px; height: 5px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.85);
    flex: none;
  }

  .cfg-list { list-style: none; }

  .cfg-row {
    display: flex;
    align-items: baseline;
    gap: 10px;
    padding: 7px 0;
    border-bottom: 1px dashed var(--rule);
    flex-wrap: wrap;
  }
  .cfg-row:last-child { border-bottom: none; padding-bottom: 2px; }

  .cfg-role {
    flex: none;
    min-width: 60px;
    font-size: 13.5px;
    font-weight: 800;
    color: var(--ink);
    letter-spacing: 0.8px;
    display: inline-flex;
    align-items: center;
  }
  .cfg-role::before {
    content: "";
    width: 3px;
    height: 13px;
    border-radius: 2px;
    background: var(--accent);
    margin-right: 7px;
    flex: none;
  }

  .cfg-gear {
    font-family: var(--mono);
    font-size: 12.5px;
    color: var(--ink);
    font-weight: 600;
    line-height: 1.8;
    letter-spacing: 0.2px;
    word-break: break-word;
  }

  /* 高亮：数字 / 词条 */
  .hl {
    font-family: inherit;
    font-style: normal;
    font-weight: 800;
    color: #bae6fd; /* 高亮亮蓝色 */
    background: var(--hl-bg-strong);
    padding: 1px 6px;
    border-radius: 4px;
    font-size: 1.08em;
    letter-spacing: 0.3px;
    margin: 0 2px;
  }

  /* 高亮：r1 / r5 徽章 */
  .hl-badge {
    display: inline-block;
    font-family: var(--mono);
    font-style: normal;
    font-size: 11px;
    font-weight: 800;
    line-height: 1.7;
    padding: 0 9px;
    margin: 0 2px;
    border-radius: 999px;
    color: #16181d;
    background: var(--accent);
    letter-spacing: 0.4px;
    vertical-align: 1px;
    text-shadow: none;
  }

  /* 结论强调条 */
  .cfg-summary {
    margin-top: 10px;
    padding: 9px 13px;
    border-radius: 7px;
    border-left: 4px solid var(--accent);
    background: var(--hl-bg-strong);
    font-size: 12.5px;
    line-height: 1.8;
    color: var(--ink);
    letter-spacing: 0.2px;
    font-weight: 600;
  }

  /* ============================================================
     图片放大器
  ============================================================ */
  .lightbox {
    position: fixed;
    inset: 0;
    background: rgba(8, 8, 12, 0.92);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    z-index: 9999;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 24px;
    cursor: zoom-out;
  }
  .lightbox.show { display: flex; }
  .lightbox img {
    max-width: 100%;
    max-height: 100%;
    border-radius: 8px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
  }
  .lightbox-close {
    position: absolute;
    top: 16px;
    right: 18px;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.12);
    border: 1px solid rgba(255, 255, 255, 0.2);
    color: #fff;
    font-size: 19px;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .lightbox-close:hover { background: rgba(255, 255, 255, 0.22); }
  .lightbox-caption {
    position: absolute;
    bottom: 18px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255, 255, 255, 0.75);
    font-size: 11.5px;
    letter-spacing: 0.8px;
    background: rgba(0, 0, 0, 0.4);
    padding: 5px 14px;
    border-radius: 20px;
    border: 1px solid rgba(255, 255, 255, 0.12);
    white-space: nowrap;
  }

  /* ===== 页脚 ===== */
  .page-footer {
    text-align: center;
    padding: 12px 0 0;
    font-size: 11px;
    color: var(--ink-3);
    line-height: 1.85;
  }
  .page-footer b { color: var(--accent); font-weight: 700; }

  /* ============================================================
     响应式
  ============================================================ */
  @media (max-width: 720px) {
    body { padding: 40px 11px 42px; font-size: 12.5px; }
    .page-container { gap: 15px; }
    .chart-list { gap: 15px; }

    .page-header h1 { font-size: 18px; letter-spacing: 2px; margin-bottom: 5px; }
    .page-header .subtitle { font-size: 10.5px; }
    .page-header .subtitle::before,
    .page-header .subtitle::after { margin: 0 5px; }

    .chart-head {
      padding: 9px 12px;
      flex-direction: column;
      align-items: flex-start;
      gap: 5px;
    }
    .chart-title { font-size: 12.5px; }
    .chart-ver { font-size: 9.5px; padding: 2px 7px; }
    .chart-hint { font-size: 10px; }

    .chart-foot { padding: 7px 12px; font-size: 10.5px; }
    .zoom-tip { display: none; }

    .note-toggle { padding: 9px 12px; font-size: 12px; }
    .note-toggle .note-hint { display: none; }
    .note-content { padding: 0 12px 12px; }

    .cfg-preview { padding: 10px 11px; }
    .cfg-role { min-width: 52px; font-size: 13px; }
    .cfg-gear { font-size: 12px; font-weight: 600; }
    .cfg-row { gap: 7px; padding: 6px 0; }
    .cfg-summary { font-size: 12px; padding: 8px 11px; font-weight: 600; }
    .hl { padding: 1px 5px; font-size: 1.06em; }
    .hl-badge { padding: 0 8px; font-size: 10.5px; }

    .lightbox-close { top: 11px; right: 11px; width: 32px; height: 32px; font-size: 17px; }
    .lightbox-caption {
      font-size: 10.5px;
      padding: 4px 11px;
      max-width: 90vw;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  }
</style>
</head>
<body>

<div class="page-container">

  <!-- 页头 -->
  <header class="page-header">
    <h1>米提亚-图表</h1>
    <p class="subtitle">30词|8层|60帧|热启动|武器差距（辅助向）</p>
  </header>

  <!-- 图表列表 -->
  <div class="chart-list">

    <!-- ========== 图表：米提亚 武器差距 ========== -->
    <div class="chart-card">
      <div class="chart-head">
        <div class="chart-head-left">
          <span class="chart-title">米提亚 · 武器差距（辅助向）</span>
          <span class="chart-ver">v7.2.5.1</span>
        </div>
       
      </div>

      <div class="chart-img-box" onclick="openLightbox(this, '版本 v7.2.5.1')">
        <img src="v7.2.5.1-米提亚武器差距（辅助向）.png" alt="米提亚武器差距（辅助向） v7.2.5.1" loading="lazy"
             onerror="this.parentElement.classList.add('error')">
        <div class="fallback">
          <div class="fallback-icon"></div>
     
        </div>
      </div>

      <div class="chart-foot">
        <span class="meta">数据整理：<b>羽化哲</b> · 制图：<b>幼儿园大班班长</b></span>
        
      </div>

      <!-- 备注面板 -->
      <div class="note-panel" id="notePanel1">
        <button class="note-toggle" type="button" onclick="toggleNote('notePanel1')" aria-expanded="false">
          <span class="note-arrow">▶</span>
          <span class="note-label">查看圣遗物/武器</span>
          <span class="note-hint">点击展开 / 收起</span>
        </button>

        <div class="note-body">
          <div class="note-content">
            <div class="cfg-preview" id="preview1"></div>
          </div>
        </div>
      </div>
    </div>

  </div>

  
   

</div>

<!-- 图片放大器 -->
<div class="lightbox" id="lightbox">
  <button class="lightbox-close" type="button" onclick="closeLightbox()" aria-label="关闭">×</button>
  <img id="lightboxImg" src="" alt="">
  <div class="lightbox-caption" id="lightboxCaption"></div>
</div>

<script>
/* ============================================================
   1. 备注面板：折叠 / 高亮渲染
============================================================ */
function toggleNote(panelId) {
  var panel = document.getElementById(panelId);
  if (!panel) return;
  var isOpen = panel.classList.toggle('open');
  var btn = panel.querySelector('.note-toggle');
  if (btn) btn.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
}

/* —— HTML 转义 —— */
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

/* —— 行内高亮：r1 / r5 为徽章，词条与数字为高亮块 —— */
function highlight(s) {
  return escapeHtml(s).replace(/(r\d+|\d+\s*词|双爆|\d+)/gi, function (t) {
    if (/^r\d+$/i.test(t)) {
      return '<em class="hl-badge">' + t + '</em>';
    }
    return '<em class="hl">' + t + '</em>';
  });
}

/* —— 解析并渲染高亮卡片 —— */
function renderPreview(text, box) {
  if (!box) return;

  var lines = String(text || '').split('\n');
  var title = '';
  var rows = [];
  var summary = [];

  lines.forEach(function (raw) {
    var line = raw.trim();
    if (!line) return;

    var m = line.match(/^([^：:]+)[：:]\s*(.*)$/);
    if (m) {
      var key = m[1].trim();
      var val = m[2].trim();
      if (val) {
        rows.push({ key: key, val: val });
      } else {
        title = key;
      }
    } else {
      summary.push(line);
    }
  });

  if (!title && !rows.length && !summary.length) {
    box.innerHTML = '<div class="cfg-empty">暂无备注内容</div>';
    return;
  }

  var html = '';

  if (title) {
    html += '<div class="cfg-sec"><span class="cfg-sec-dot"></span>' + escapeHtml(title) + '</div>';
  }

  if (rows.length) {
    html += '<ul class="cfg-list">';
    rows.forEach(function (r) {
      html += '<li class="cfg-row">' +
                '<span class="cfg-role">' + escapeHtml(r.key) + '</span>' +
                '<span class="cfg-gear">' + highlight(r.val) + '</span>' +
              '</li>';
    });
    html += '</ul>';
  }

  summary.forEach(function (s) {
    html += '<div class="cfg-summary">' + highlight(s) + '</div>';
  });

  box.innerHTML = html;
}

/* —— 初始化展示内容 —— */
(function initPreviews() {
  var configText = [
    '武器/圣遗物：',
    '桑多涅：影中沉凝的幻灭，r1专武',
    '奥黛塔：炉火熔炼之心，星峰剑',
    '米提亚：精通2+2',
    '七七：千岩，r5西风',
    '桑、奥、米均为30词，其中24为双爆！',
    '热启动',
    '转载需标明出处！'
  ].join('\n');

  var p1 = document.getElementById('preview1');
  if (p1) renderPreview(configText, p1);
})();

/* ============================================================
   2. 图片放大器
============================================================ */
var lightbox = document.getElementById('lightbox');
var lightboxImg = document.getElementById('lightboxImg');
var lightboxCaption = document.getElementById('lightboxCaption');

function openLightbox(box, caption) {
  if (box.classList.contains('error')) return;
  var img = box.querySelector('img');
  if (!img || !img.complete || img.naturalWidth === 0) return;

  lightboxImg.src = img.src;
  lightboxImg.alt = img.alt;
  lightboxCaption.textContent = caption + ' · 点击任意处关闭';
  lightbox.classList.add('show');
  document.body.style.overflow = 'hidden';
}

function closeLightbox() {
  lightbox.classList.remove('show');
  document.body.style.overflow = '';
  setTimeout(function () {
    if (!lightbox.classList.contains('show')) lightboxImg.src = '';
  }, 260);
}

lightbox.addEventListener('click', function (e) {
  if (e.target === lightbox) closeLightbox();
});

document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape' && lightbox.classList.contains('show')) {
    closeLightbox();
  }
});
</script>
</body>
</html>
