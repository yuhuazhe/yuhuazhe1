<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>羽化哲</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    min-height: 100vh;
    padding: 72px 20px;
    font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    
    /* ==================== 在这里添加底图 ==================== */
    /* 将 '你的图片路径.jpg' 替换为实际图片名称，例如 '背景.jpg' */
    background: url('背景2.jpg') center center / cover no-repeat fixed;
    background-color: #000; /* 图片加载失败或透明时显示的底色 */
    /* ======================================================== */
    
    color: #4ea1ff;
    position: relative;
  }

  /* 添加极淡遮罩层，保证文字在亮色图片上依然清晰 */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background-color: rgba(0, 0, 0, 0.65); /* 这里的 0.65 是黑色透明度，如果图片比较暗可以调低（如 0.4），比较亮可以调高（如 0.8） */
    z-index: -1;
    pointer-events: none; /* 确保不会阻挡鼠标点击后面的卡片 */
  }

  .wrap {
    max-width: 620px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  /* 板块透明 */
  .card {
    display: block;
    padding: 22px 24px;
    background: transparent;
    border: 1px solid rgba(255, 255, 255, 0.22);
    border-radius: 12px;
    text-align: center;
    text-decoration: none;
    cursor: pointer;

    /* 动态效果的基础过渡 */
    transition:
      transform 0.22s cubic-bezier(0.22, 0.61, 0.36, 1),
      border-color 0.22s ease;
    will-change: transform;
  }

  /* 悬停：轻微上浮 + 边框变亮 */
  .card:hover,
  .card:focus-visible {
    transform: translateY(-3px);
    border-color: rgba(255, 255, 255, 0.5);
    outline: none;
  }

  /* 按下：回落 */
  .card:active {
    transform: translateY(-1px) scale(0.994);
    transition-duration: 0.08s;
  }

  .card-title {
    display: block;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 0.5px;
    color: #4ea1ff;
    transition: color 0.22s ease, letter-spacing 0.22s ease;
  }

  .card:hover .card-title {
    color: #8cc4ff;
    letter-spacing: 1.2px;
  }

  .card-meta {
    display: block;
    margin-top: 8px;
    font-size: 14px;
    color: #4ea1ff;
    transition: color 0.22s ease;
  }

  .card:hover .card-meta {
    color: #8cc4ff;
  }

  @media (max-width: 600px) {
    body {
      padding: 64px 12px 40px;
    }

    .wrap {
      gap: 12px;
    }

    .card {
      padding: 18px;
      border-radius: 10px;
    }

    .card-title {
      font-size: 18px;
    }

    .card-meta {
      font-size: 13px;
    }
  }

  /* 尊重系统“减少动态效果”设置 */
  @media (prefers-reduced-motion: reduce) {
    .card,
    .card-title,
    .card-meta {
      transition: none;
    }
    .card:hover,
    .card:active {
      transform: none;
    }
  }
</style>
</head>
<body>
  <nav class="wrap">
    <a class="card" href="qb.html">
      <span class="card-title">全怪物目录</span>
    </a>

    <a class="card" href="7.2.html">
      <span class="card-title">7.2版本 幽境危战</span>
      <span class="card-meta">更新日期：2026.10.17</span>
    </a>
  </nav>
</body>
</html>
