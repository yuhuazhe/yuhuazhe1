<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <!-- 前端预连接、预加载，纯代码提速，无需配置文件 -->
    <link rel="preconnect" href="https://yuhuazhe.github.io" crossorigin>
    <link rel="dns-prefetch" href="https://yuhuazhe.github.io">
    <link rel="preload" href="zhanshi/1.0.jpg" as="image" type="image/jpeg">
    
    <meta charset="UTF-8">
    <!-- 修复手机端缩放、截图拉伸问题 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=2.0, user-scalable=yes">
    <title>怪物机制</title>
    <!-- 引入html2canvas CDN -->
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        body {
            background: #0a0a0f;
            color: #eee;
            padding: 20px;
            min-height: 100vh;
        }
        .header-top {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
        }
        .back-btn {
            width: 36px;
            height: 36px;
            border-radius: 6px;
            background: transparent;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(44, 44, 64, 0.3);
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .back-btn:hover {
            background: rgba(39, 39, 56, 0.25);
            border-color: rgba(96, 66, 117, 0.5);
        }
        .page-title {
            font-size: 28px;
            font-weight: 700;
        }
        .search-filter-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
            margin-bottom: 28px;
        }
        .filter-group {
            display: flex;
            gap: 8px;
        }
        .filter-tag {
            padding: 8px 16px;
            background: transparent;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(44, 44, 64, 0.3);
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .filter-tag.active {
            background: rgba(56, 34, 70, 0.3);
            border-color: rgba(157, 88, 192, 0.6);
            color: #e9c8ff;
        }
        .filter-tag:hover {
            border-color: rgba(96, 66, 117, 0.5);
            background: rgba(39, 39, 56, 0.2);
        }
        .search-box-wrap {
            flex: 1;
            min-width: 220px;
            display: flex;
            background: transparent;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(44, 44, 64, 0.3);
            border-radius: 6px;
            overflow: hidden;
        }
        .search-input {
            flex: 1;
            padding: 10px 14px;
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            font-size: 15px;
        }
        .search-btn {
            padding: 0 14px;
            border: none;
            background: transparent;
            color: #aaa;
            cursor: pointer;
        }
        .search-btn:hover {
            color: #fff;
        }
        .monster-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 18px;
        }
        .monster-card {
            background: transparent;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(37, 37, 56, 0.35);
            border-radius: 10px;
            padding: 16px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            transition: 0.2s;
        }
        .monster-card:hover {
            border-color: rgba(128, 72, 163, 0.7);
            transform: translateY(-3px);
            box-shadow: 0 6px 16px rgba(71, 40, 92, 0.2);
            background: rgba(56, 34, 70, 0.15);
        }
        .monster-avatar {
            width: 90px;
            height: 90px;
            border-radius: 8px;
            margin-bottom: 12px;
            object-fit: cover;
        }
        .monster-name {
            text-align: center;
            font-size: 15px;
            line-height: 1.4;
        }
        .detail-mask {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.55);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 999;
            padding: 20px;
        }
        .detail-wrap {
            width: 100%;
            max-width: 700px;
            max-height: 90vh;
            overflow-y: auto;
            background: transparent;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(128, 72, 163, 0.5);
            border-radius: 12px;
            padding: 24px;
            position: relative;
        }
        .close-detail {
            position: absolute;
            top: 16px;
            right: 16px;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: transparent;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(44, 44, 64, 0.3);
            color: #fff;
            font-size: 18px;
            cursor: pointer;
        }
        .close-detail:hover {
            background: rgba(56, 34, 70, 0.35);
            border-color: rgba(157, 88, 192, 0.6);
        }
        .download-btn {
            position: absolute;
            top: 16px;
            right: 60px;
            padding: 6px 12px;
            border-radius: 6px;
            background: transparent;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(157, 88, 192, 0.5);
            color: #e9c8ff;
            cursor: pointer;
        }
        .download-btn:hover {
            background: rgba(76, 45, 95, 0.3);
        }
        .detail-header {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .detail-avatar {
            width: 140px;
            height: 140px;
            border-radius: 10px;
            object-fit: cover;
        }
        .detail-title h2 {
            font-size: 26px;
            margin-bottom: 8px;
        }
        .detail-type-tag {
            display: inline-block;
            padding: 4px 12px;
            background: rgba(56, 34, 70, 0.3);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            border-radius: 4px;
            color: #e9c8ff;
            font-size: 14px;
        }
        .detail-content {
            line-height: 1.7;
            color: #ccc;
            white-space: pre-line;
        }
        /* 滚动条美化 适配透明面板 */
        .detail-wrap::-webkit-scrollbar {
            width: 6px;
        }
        .detail-wrap::-webkit-scrollbar-track {
            background: transparent;
        }
        .detail-wrap::-webkit-scrollbar-thumb {
            background: rgba(157, 88, 192, 0.4);
            border-radius: 3px;
        }
        @media (max-width: 600px) {
            .page-title {
                font-size: 22px;
            }
            .monster-grid {
                grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
                gap: 12px;
            }
            .monster-avatar {
                width: 72px;
                height: 72px;
            }
            .detail-header {
                justify-content: center;
                text-align: center;
            }
            .detail-avatar {
                width: 100px;
                height: 100px;
            }
            .download-btn {
                right: 50px;
                padding: 4px 8px;
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="header-top">
        <h1 class="page-title">怪物机制</h1>
    </div>
    <div class="search-filter-bar">
        <div class="filter-group">
            <div class="filter-tag" data-type="abyss">深渊</div>
            <div class="filter-tag" data-type="realm">幽境</div>
            <div class="filter-tag" data-type="drama">剧诗</div>

        <div class="search-box-wrap">
            <input class="search-input" placeholder="搜索怪物">

    <div class="monster-grid" id="monsterContainer"></div>

            <div class="detail-header">
                <img class="detail-avatar" id="detailImg" alt="">
                <div class="detail-title">
                    <h2 id="detailName"></h2>
                    <span class="detail-type-tag" id="detailType"></span>
                </div>
            </div>
            <div class="detail-content" id="detailDesc"></div>
        </div>
    </div>

        const imglongshou = "./longshou.png";

        const monsterList = [
            {
                id:1,
                name:'嵌合阖寂狮·摧枯伟力',
                img: imgQianHeShi,
                type:'realm',
                typeText:'幽境',
                desc:`N5：10748446 -------------- N6：23349702
1.强敌开局会展开 40U 雷元素护盾，若强敌正处于辉映 - 星烁效果的影响之下，在强敌准备释放雷元素冲击波时将扣除 16U 护盾，并掉落 6 个雷元素微粒，破盾时，会以破盾过程中所受到的 100% 星烁伤害 + 30% 其他伤害 对强敌造成真实伤害，并使其瘫痪 13s ，
此时强敌失去额外风雷抗性，并将冰风抗性降至 - 120% ，其余降至 -60% 。
2.此后，强敌将创造风涡，尝试牵引并吸收场上的 5 个风能量球以恢复力量；
风能量球可被水 / 火 / 雷 / 冰元素伤害破坏；亦可通过令强敌陷入辉映 - 星烁的影响，使其无法吸收风能量球，此时将掉落 6 个风元素微粒。
若风涡消散时强敌仍未吸收 3 个风能量球，也将进入瘫痪状态。
首领特性
唤雷·坠雷
受到地脉紊乱的影响，战斗开始时，强敌将以雷元素之首的力量为引，生成坚韧的元素护罩保护自身。
每隔一段时间，强敌的双首将相互配合，将风元素之力灌注于雷元素大剑之中，释放大范围雷元素冲击波；
此时，若强敌正处于辉映 - 星烁效果的影响之下，则将因力量紊乱而遭受反噬，使护罩受损。通过元素反应破除护罩后，强敌将因脱力而停止攻击，陷入瘫痪，同时冰元素和风元素抗性将大幅降低，并根据护罩所抵挡的伤害，受到一次高额反噬伤害。

驭风·狂袭

亦可通过令强敌陷入辉映 - 星烁的影响，使其无法吸收风能量球。
若风涡消散时强敌仍未吸收足量的风能量球，将立刻陷入瘫痪状态，同时强敌的冰元素和风元素抗性将大幅降低。`
            },
            {
                id:2,
                name:'历经百战的风役人·谵谙芒锋',
                img: imgFengYiRen,
                type:'realm',
                typeText:'幽境',
                desc:`N5：8068956 -------------- N6：17506996
1.冻结抵抗 90%，抗打断能力全面增强，无法被角色技能打断，且具有大量快速位移技能
2.没有护盾时，施放「猎杀」并生成护盾：等同于 22.5% 生命值，被破除时损失等量生命值
3.护盾生成时，为全体角色施加 27100 / 29028 生命之契，且存在期间每秒额外施加 8130 / 8708 生命之契（N5/N6）
首领特性
讯疾猎杀
战斗中，会消耗一定比例的生命值，进行「猎杀」：命中角色时，该敌人自身恢复一定比例的生命值，并向命中的角色施加生命之契，在生命之契存在时使其持续受到伤害。
对于具有生命之契的角色，此攻击造成的伤害提升
洋色沧溟·极渊
受到地脉紊乱的影响，该敌人的打断能力与抗打断能力大幅提升，且可在空中架势崩溃时即刻闪避脱离，迅速重整态势。
准备进行「猎杀」时，将进入「涉血追猎」状态：生成护盾保护自身，护盾存在期间，该敌人将持续向所有角色施加生命之契。护盾被破坏后，该敌人会受到大量伤害。`
            },
            {
                id:3,
                name:'重拳出击鸭·重甲武库',
                img: imgZhongJiaYa,
                type:'realm',
                typeText:'幽境',
                desc:`N5：13114774 -------------- N6：25925713
1.冲鸭机关存在期间，自身全部抗性 +210%，每个冲鸭机关具有强敌 25% 最大生命值，全抗 10%

4.瘫痪结束后，首领全抗为 10%，雷元素 抗性保持 -50%。约 45s 后首领重新展开护罩
首领特性
「全装甲鸭甲」模式

低阻冲鸭机关、快速跳弹系统
通过多次造成感电或月感电伤害，或直接对冲鸭机关造成足量伤害，可干扰它们的运行。

受到地脉紊乱的影响，冲鸭机关变得更加坚固：需要造成更多次感电或月感电伤害，或造成更高伤害才能干扰其运行，感电或月感电伤害对冲鸭机关具有更高的破坏效率。
当失控的冲鸭机关撞向重拳出击鸭时，其造成的伤害将根据冲鸭机关所受伤害的总值提升。`
            },
            {

                img: imgXianQuYuan,
                type:"realm",
                typeText:"幽境",
                desc:`N5：7541896 -------------- N6：14480438

抓取机关・高压回弹
机关本体受大量水元素护罩包裹；该状态下受到碎晶 / 超导元素反应伤害时将被削弱、受触碰直接引爆；每当一架机关被摧毁时，都会使强敌的护盾变薄`
            },
            {
                id:5,
                name:"深黯魇语之主·袭掠锋刃",
                img: imgShenAnYu,
                type:"realm",
                typeText:"幽境",
                desc:`N5：12437830 -------------- N6：23658108
1.会展开 45% 生命值的「深黯护盾」，其受到的月耀反应伤害为原伤害的 300%，免疫物理伤害；首次受到月耀反应伤害时，产生等同于 36 能量的元素晶球

        const container = document.getElementById('monsterContainer');
        const filterTags = document.querySelectorAll('.filter-tag');
        const searchInput = document.querySelector('.search-input');
        const searchBtn = document.querySelector('.search-btn');
        const detailMask = document.getElementById('detailMask');
        const closeDetailBtn = document.getElementById('closeDetailBtn');
        const downloadDetailBtn = document.getElementById('downloadDetailBtn');
        const captureBox = document.getElementById('captureBox');
        const detailImg = document.getElementById('detailImg');
        const detailName = document.getElementById('detailName');
        const detailType = document.getElementById('detailType');
        const detailDesc = document.getElementById('detailDesc');
        let currentFilter = null;
        let searchKey = '';
        let currentMonster = null;
        // 判断iOS/手机内置浏览器
        function isMobileNoAutoDownload() {
            const ua = navigator.userAgent.toLowerCase();
            const isIOS = /ipad|iphone|ipod/.test(ua) && !window.MSStream;
            const isWechat = /micromessenger/.test(ua);
            const isQQ = /qqbrowser/.test(ua);
            return isIOS || isWechat || isQQ;
        }
        // 预加载图片
        function loadImage(src) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.crossOrigin = "anonymous";
                img.onload = () => resolve(img);
                img.onerror = reject;
                img.src = src;
            })
        }
        function renderList(){
            let data = [...monsterList];
            if(currentFilter) data = data.filter(item=>item.type===currentFilter);
            if(searchKey) data = data.filter(item=>item.name.includes(searchKey));
            container.innerHTML = '';
            data.forEach(monster=>{
                const card = document.createElement('div');
                card.className = 'monster-card';
                card.innerHTML = `
                    <img class="monster-avatar" src="${monster.img}" alt="${monster.name}" crossorigin="anonymous">
                    <div class="monster-name">${monster.name}</div>
                `
                card.addEventListener('click',()=>openDetail(monster));
                container.appendChild(card);
            })
        }
        function openDetail(monster){
            currentMonster = monster;
            detailImg.src = monster.img;
            detailImg.crossOrigin = "anonymous";
            detailName.innerText = monster.name;
            detailType.innerText = monster.typeText;
            detailDesc.innerText = monster.desc;
            detailMask.style.display = 'flex';
            document.body.style.overflow = 'hidden';
        }
        function closeDetail(){
            detailMask.style.display = 'none';
            document.body.style.overflow = '';
        }
        // 下载函数：PC自动下载，手机弹出预览长按保存
        async function downloadDetailImage() {
            if (!currentMonster) return;
            try {
                await loadImage(detailImg.src);
                // 保存原有滚动样式，完整截图
                const originalOverflow = captureBox.style.overflowY;
                const originalMaxHeight = captureBox.style.maxHeight;
                captureBox.style.overflowY = 'visible';
                captureBox.style.maxHeight = 'unset';
                await new Promise(resolve => setTimeout(resolve, 300));
                const canvas = await html2canvas(captureBox, {
                    backgroundColor: '#0a0a0f',
                    useCORS: true,
                    allowTaint: true,
                    scale: 2,
                    letterRendering: true,
                    logging: false
                });
                // 恢复样式
                captureBox.style.overflowY = originalOverflow;
                captureBox.style.maxHeight = originalMaxHeight;
                canvas.toBlob(async (blob) => {
                    if (!blob) throw new Error("图片生成失败");
                    const blobUrl = URL.createObjectURL(blob);
                    const fileName = `${currentMonster.name}_怪物详情.png`;
                    // 手机iOS/微信/QQ：弹出预览图，长按保存
                    if (isMobileNoAutoDownload()) {
                        const previewMask = document.createElement('div');
                        previewMask.style.cssText = `
                            position:fixed;inset:0;background:#000;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px;
                        `;
                        const tipText = document.createElement('p');
                        tipText.style.cssText = 'color:#fff;margin-bottom:12px;font-size:14px;text-align:center;';
                        tipText.innerText = '长按图片保存到相册，点击空白关闭';
                        const previewImg = new Image();
                        previewImg.src = blobUrl;
                        previewImg.style.maxWidth = '100%';
                        previewImg.style.maxHeight = '85vh';
                        previewMask.appendChild(tipText);
                        previewMask.appendChild(previewImg);
                        previewMask.addEventListener('click', e => {
                            if (e.target === previewMask) {
                                document.body.removeChild(previewMask);
                                URL.revokeObjectURL(blobUrl);
                            }
                        })
                        document.body.appendChild(previewMask);
                        return;
                    }
                    // PC/安卓Chrome等正常自动下载
                    const a = document.createElement('a');
                    a.href = blobUrl;
                    a.download = fileName;
                    document.body.appendChild(a);
                    a.click();
                    setTimeout(() => {
                        document.body.removeChild(a);
                        URL.revokeObjectURL(blobUrl);
                    }, 400);
                }, 'image/png', 1);
            } catch (err) {
                console.error("下载失败：", err);
                alert("生成图片失败：\n1.检查图片是否全部上传\n2.微信请复制链接到系统浏览器打开");
            }
        }
        // 绑定事件
        downloadDetailBtn.addEventListener('click', downloadDetailImage);
        closeDetailBtn.addEventListener('click', closeDetail);
        detailMask.addEventListener('click', (e)=>{
            if(e.target === detailMask) closeDetail();
        })
        filterTags.forEach(tag=>{
            tag.addEventListener('click',()=>{
                const type = tag.dataset.type;
                if(currentFilter === type){
                    currentFilter = null;
                    tag.classList.remove('active');
                }else{
                    filterTags.forEach(t=>t.classList.remove('active'));
                    currentFilter = type;
                    tag.classList.add('active');
                }
                renderList();
            })
        })
        searchInput.addEventListener('input',e=>{
            searchKey = e.target.value.trim();
            renderList();
        })
        searchBtn.addEventListener('click',()=>{
            searchKey = searchInput.value.trim();
            renderList();
        })
        renderList();
    </script>
