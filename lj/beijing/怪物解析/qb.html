<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=2.0, user-scalable=yes">
    <title>怪物机制</title>
    <style>
        /* ===== 固定配色（蓝色系，透明板块） ===== */
        :root {
            --ink: #e0f2fe;
            --ink-2: #93c5fd;
            --ink-3: #60a5fa;
            --accent: #38bdf8;
            --rule: rgba(96, 165, 250, 0.3);
            --rule-2: rgba(96, 165, 250, 0.5);
            --hover: rgba(56, 189, 248, 0.15);
            --mask: rgba(0, 0, 0, 0.75);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
        }
        
        body, h1, h2, h3, p, span, div, button, a, input {
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.9), 0 0 6px rgba(0, 0, 0, 0.6);
        }

        body {
            background-color: #16181d;
            background-image: 
                linear-gradient(rgba(0, 0, 0, 0.45), rgba(0, 0, 0, 0.45)),
                url("背景2.jpg");
            background-position: center;
            background-size: cover;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: var(--ink);
            padding: 20px;
            min-height: 100vh;
        }

        .page-wrap { max-width: 1200px; margin: 0 auto; }

        .header-top { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
        .page-title { font-size: 28px; font-weight: 700; color: var(--accent); }

        .search-filter-bar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 28px; }
        .filter-group { display: flex; gap: 8px; }
        
        .filter-tag {
            padding: 8px 16px; background: transparent; border: 1px solid var(--rule-2);
            border-radius: 6px; cursor: pointer; color: var(--ink); transition: all 0.2s; user-select: none;
        }
        .filter-tag.active { background: var(--hover); border-color: var(--accent); color: var(--accent); font-weight: 600; }
        .filter-tag:hover { border-color: var(--accent); background: var(--hover); }
        
        .search-box-wrap {
            flex: 1; min-width: 220px; display: flex; background: transparent;
            border: 1px solid var(--rule-2); border-radius: 6px; overflow: hidden;
        }
        .search-input { flex: 1; padding: 10px 14px; background: transparent; border: none; outline: none; color: #fff; font-size: 15px; }
        .search-input::placeholder { color: var(--ink-3); }
        .search-btn { padding: 0 14px; border: none; background: transparent; color: var(--ink-2); cursor: pointer; font-size: 15px; }
        .search-btn:hover { color: var(--accent); }

        .monster-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 18px; }
        
        .monster-card {
            background: transparent; border: 1px solid var(--rule-2); border-radius: 10px;
            padding: 16px 10px; display: flex; flex-direction: column; align-items: center;
            cursor: pointer; transition: all 0.25s;
        }
        .monster-card:hover { border-color: var(--accent); transform: translateY(-3px); background: var(--hover); }
        .monster-avatar { width: 90px; height: 90px; border-radius: 8px; margin-bottom: 12px; object-fit: cover; background: transparent; }
        .monster-name { text-align: center; font-size: 15px; line-height: 1.4; color: var(--ink); }

        /* ===== 详情弹窗 ===== */
        .detail-mask {
            position: fixed; inset: 0; background: var(--mask); display: none;
            align-items: center; justify-content: center; z-index: 999; padding: 20px;
        }
        
        .detail-wrap {
            width: 100%; max-width: 700px; max-height: 90vh; overflow-y: auto;
            background: transparent; border: 1px solid var(--rule-2); border-radius: 12px;
            padding: 24px; padding-bottom: 30px; position: relative;
        }
        
        .close-detail {
            position: absolute; top: 16px; right: 16px; width: 32px; height: 32px;
            border-radius: 50%; background: transparent; border: 1px solid var(--rule-2);
            color: var(--ink); font-size: 18px; line-height: 1; cursor: pointer;
        }
        .close-detail:hover { background: var(--hover); border-color: var(--accent); color: var(--accent); }
        
        .detail-header { display: flex; gap: 20px; margin-bottom: 20px; flex-wrap: wrap; padding-right: 40px; }
        .detail-avatar { width: 140px; height: 140px; border-radius: 10px; object-fit: cover; background: transparent; }
        .detail-title h2 { font-size: 26px; margin-bottom: 8px; color: var(--accent); }
        .detail-type-tag {
            display: inline-block; padding: 4px 12px; background: transparent;
            border: 1px solid var(--rule-2); border-radius: 4px; color: var(--accent); font-size: 14px;
        }
        .detail-content {
            line-height: 1.8; color: var(--ink); white-space: pre-line; font-size: 14.5px; margin-bottom: 24px;
        }

        .download-detail-btn {
            display: block; margin: 0 auto; padding: 10px 30px; background: transparent;
            border: 1px solid var(--accent); border-radius: 6px; color: var(--accent);
            font-size: 15px; font-weight: bold; cursor: pointer; transition: all 0.2s;
        }
        .download-detail-btn:hover { background: var(--hover); }
        .download-detail-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .detail-wrap::-webkit-scrollbar { width: 6px; }
        .detail-wrap::-webkit-scrollbar-track { background: transparent; }
        .detail-wrap::-webkit-scrollbar-thumb { background: var(--rule-2); border-radius: 3px; }

        @media (max-width: 600px) {
            body { padding: 40px 12px 48px; }
            .page-title { font-size: 22px; }
            .monster-grid { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px; }
            .monster-avatar { width: 72px; height: 72px; }
            .detail-header { justify-content: center; text-align: center; padding-right: 0; }
            .detail-avatar { width: 100px; height: 100px; }
            .detail-wrap { padding: 18px; }
        }
    </style>
</head>
<body>
    <div class="page-wrap">
        <div class="header-top">
            <h1 class="page-title">怪物机制</h1>
        </div>
        <div class="search-filter-bar">
            <div class="filter-group">
                <div class="filter-tag" data-type="abyss">深渊</div>
                <div class="filter-tag" data-type="realm">幽境</div>
                <div class="filter-tag" data-type="drama">剧诗</div>
            </div>
            <div class="search-box-wrap">
                <input class="search-input" placeholder="搜索怪物">
                <button class="search-btn">搜索</button>
            </div>
        </div>
        <div class="monster-grid" id="monsterContainer"></div>
    </div>

    <div class="detail-mask" id="detailMask">
        <div class="detail-wrap" id="detailSourceWrap">
            <button class="close-detail" id="closeDetailBtn">×</button>
            <div class="detail-header">
                <img class="detail-avatar" id="detailImg" crossorigin="anonymous" alt="">
                <div class="detail-title">
                    <h2 id="detailName"></h2>
                    <span class="detail-type-tag" id="detailType"></span>
                </div>
            </div>
            <div class="detail-content" id="detailDesc"></div>
            
            <button class="download-detail-btn" id="downloadDetailBtn">下载图片</button>
        </div>
    </div>

                typeText:'幽境',

        /* ===== DOM 引用 ===== */
        const container = document.getElementById('monsterContainer');
        const filterTags = document.querySelectorAll('.filter-tag');
        const searchInput = document.querySelector('.search-input');
        const searchBtn = document.querySelector('.search-btn');
        const detailMask = document.getElementById('detailMask');
        const closeDetailBtn = document.getElementById('closeDetailBtn');
        const detailImg = document.getElementById('detailImg');
        const detailName = document.getElementById('detailName');
        const detailType = document.getElementById('detailType');
        const detailDesc = document.getElementById('detailDesc');
        const downloadDetailBtn = document.getElementById('downloadDetailBtn');
        
        let currentFilter = null;
        let searchKey = '';
        let currentMonster = null;

        /* ===== 渲染列表 ===== */
        function renderList() {
            let data = monsterList.slice();
            if (currentFilter) data = data.filter(item => item.type === currentFilter);
            if (searchKey) data = data.filter(item => item.name.indexOf(searchKey) !== -1);
            container.innerHTML = '';
            data.forEach(monster => {
                const card = document.createElement('div');
                card.className = 'monster-card';
                card.innerHTML =
                    '<img class="monster-avatar" src="' + monster.img + '" alt="' + monster.name + '" crossorigin="anonymous">' +
                    '<div class="monster-name">' + monster.name + '</div>';
                card.addEventListener('click', () => openDetail(monster));
                container.appendChild(card);
            });
        }

        /* ===== 打开详情 ===== */
        function openDetail(monster) {
            currentMonster = monster;
            detailImg.src = monster.img;
            detailName.innerText = monster.name;
            detailType.innerText = monster.typeText;
            detailDesc.innerText = monster.desc;
            detailMask.style.display = 'flex';
            document.body.style.overflow = 'hidden';
        }

        /* ===== 关闭详情 ===== */
        function closeDetail() {
            detailMask.style.display = 'none';
            document.body.style.overflow = '';
        }

        /* ===== 纯原生 Canvas 绘制下载（绝对稳定、透明底） ===== */
        downloadDetailBtn.addEventListener('click', async () => {
            if (!currentMonster) return;
            
            const originalText = downloadDetailBtn.innerText;
            downloadDetailBtn.innerText = '生成中...';
            downloadDetailBtn.disabled = true;

            try {
                // 1. 初始化画布参数
                const scale = 2; // 高清渲染
                const width = 700; 
                const padding = 24; 
                const textWidth = width - padding * 2;
                const lineHeight = 26; 
                const fontSize = 14.5;

                // 创建离屏画布用于测量文字
                const measureCanvas = document.createElement('canvas');
                const mCtx = measureCanvas.getContext('2d');
                mCtx.font = `${fontSize}px "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif`;

                // 2. 文字换行计算
                const descLines = [];
                const paragraphs = currentMonster.desc.split('\n');
                paragraphs.forEach(p => {
                    let currentLine = '';
                    for (let i = 0; i < p.length; i++) {
                        const char = p[i];
                        const testLine = currentLine + char;
                        const metrics = mCtx.measureText(testLine);
                        if (metrics.width > textWidth && i > 0) {
                            descLines.push(currentLine);
                            currentLine = char;
                        } else {
                            currentLine = testLine;
                        }
                    }
                    descLines.push(currentLine);
                });

                // 3. 计算总高度
                const headerHeight = 140 + 20;
                const tagHeight = 24 + 30;
                const descHeight = descLines.length * lineHeight;
                const totalHeight = padding + headerHeight + tagHeight + descHeight + padding;

                // 4. 建立真实画布
                const canvas = document.createElement('canvas');
                canvas.width = width * scale;
                canvas.height = totalHeight * scale;
                const ctx = canvas.getContext('2d');
                ctx.scale(scale, scale);

                // 开启文字阴影 (确保透明背景下文字清晰)
                ctx.shadowColor = 'rgba(0, 0, 0, 0.9)';
                ctx.shadowBlur = 6;
                ctx.shadowOffsetX = 0;
                ctx.shadowOffsetY = 1;

                let currentY = padding;

                // 5. 加载并绘制头像 (带圆角)
                const img = new Image();
                img.crossOrigin = "anonymous";
                img.src = currentMonster.img;
                
                await new Promise((resolve) => {
                    img.onload = resolve;
                    img.onerror = resolve; // 图片失败也继续画字
                });

                if (img.width > 0) {
                    ctx.save();
                    ctx.beginPath();
                    const r = 10;
                    const imgSize = 140;
                    ctx.moveTo(padding + r, currentY);
                    ctx.lineTo(padding + imgSize - r, currentY);
                    ctx.quadraticCurveTo(padding + imgSize, currentY, padding + imgSize, currentY + r);
                    ctx.lineTo(padding + imgSize, currentY + imgSize - r);
                    ctx.quadraticCurveTo(padding + imgSize, currentY + imgSize, padding + imgSize - r, currentY + imgSize);
                    ctx.lineTo(padding + r, currentY + imgSize);
                    ctx.quadraticCurveTo(padding, currentY + imgSize, padding, currentY + imgSize - r);
                    ctx.lineTo(padding, currentY + r);
                    ctx.quadraticCurveTo(padding, currentY, padding + r, currentY);
                    ctx.closePath();
                    ctx.clip();
                    
                    ctx.shadowColor = 'transparent'; // 图片不加阴影
                    ctx.drawImage(img, padding, currentY, imgSize, imgSize);
                    ctx.restore();
                }

                // 6. 绘制标题
                ctx.shadowColor = 'rgba(0, 0, 0, 0.9)'; 
                ctx.fillStyle = '#38bdf8'; 
                ctx.font = 'bold 26px "Noto Sans SC", sans-serif';
                const titleX = padding + 140 + 20;
                let titleY = currentY + 34; 
                ctx.fillText(currentMonster.name, titleX, titleY);

                // 7. 绘制标签
                titleY += 26;
                ctx.font = '14px "Noto Sans SC", sans-serif';
                const tagWidth = ctx.measureText(currentMonster.typeText).width + 24;
                
                // 边框 (圆角矩形)
                ctx.strokeStyle = 'rgba(96, 165, 250, 0.5)';
                ctx.lineWidth = 1;
                ctx.beginPath();
                const tagRectY = titleY - 16;
                ctx.roundRect(titleX, tagRectY, tagWidth, 24, 4);
                ctx.stroke();
                
                // 文字
                ctx.fillStyle = '#38bdf8';
                ctx.fillText(currentMonster.typeText, titleX + 12, titleY);

                // 8. 绘制正文描述
                let descY = currentY + 140 + 24;
                ctx.fillStyle = '#e0f2fe'; 
                ctx.font = `${fontSize}px "Noto Sans SC", sans-serif`;
                
                descLines.forEach(line => {
                    ctx.fillText(line, padding, descY);
                    descY += lineHeight;
                });

                // 9. 导出下载
                const dataUrl = canvas.toDataURL('image/png');
                const a = document.createElement('a');
                a.download = `${currentMonster.name}-机制.png`;
                a.href = dataUrl;
                a.click();

            } catch (err) {
                console.error('生成图片出错:', err);
                alert('生成图片失败，请检查浏览器是否拦截了弹窗。');
            } finally {
                downloadDetailBtn.innerText = originalText;
                downloadDetailBtn.disabled = false;
            }
        });

        /* ===== 事件绑定 ===== */
        closeDetailBtn.addEventListener('click', closeDetail);
        detailMask.addEventListener('click', (e) => {
            if (e.target === detailMask) closeDetail();
        });

        filterTags.forEach(tag => {
            tag.addEventListener('click', () => {
                const type = tag.dataset.type;
                if (currentFilter === type) {
                    currentFilter = null;
                    tag.classList.remove('active');
                } else {
                    filterTags.forEach(t => t.classList.remove('active'));
                    currentFilter = type;
                    tag.classList.add('active');
                }
                renderList();
            });
        });

        searchInput.addEventListener('input', e => {
            searchKey = e.target.value.trim();
            renderList();
        });
        searchBtn.addEventListener('click', () => {
            searchKey = searchInput.value.trim();
            renderList();
        });

        /* ===== 初始化 ===== */
        renderList();
    });
    </script>
