<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>充能计算</title>
<!-- 标签页图标：与 sdnjsq.html 共用文件夹里的 sdn.png -->
<link rel="icon" href="sdn.png">
<link rel="shortcut icon" href="sdn.png">
<link rel="apple-touch-icon" href="sdn.png">
<!-- 本页由 sdnjsq.html 的「充能计算」板块独立而来；原 sdnjsq.html 未做任何修改。 -->
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  /* 让 hidden 属性始终生效，不被后续 display 规则盖掉 */
  [hidden] {
    display: none !important;
  }

  html,
  body {
    height: 100%;
  }

  body {
    display: flex;
    flex-direction: column;
    overflow: hidden;
    font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    color-scheme: dark;
    background-color: #000000;
    /* 固定背景：背景2.jpg（与 sdnjsq.html 的 bg-2 同款压暗处理） */
    background-image: linear-gradient(rgba(0, 0, 0, 0.62), rgba(0, 0, 0, 0.78)), url('背景2.jpg');
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    background-repeat: no-repeat;
  }

  /* 包裹容器：撑满整页，滚动条放在内容区内部 */
  .wrap {
    position: relative;
    display: flex;
    flex-direction: column;
    flex: 1 1 auto;
    min-height: 0;
  }

  /* 分割线以上区域：主标题 + BUG 处理 + 分割线 */
  .top {
    flex: 0 0 auto;
  }

  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    padding: 32px 40px 0;
  }

  /* 页面主标题：与 sdnjsq.html 的页头同款字型与渐变 */
  .main-title {
    font-family: "Songti SC", "Noto Serif SC", "STSong", "SimSun", serif;
    font-size: 28px;
    font-weight: 400;
    letter-spacing: 0.2em;
    text-indent: 0.2em;
    background: linear-gradient(180deg, #ffffff 0%, #d8d8d8 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    white-space: nowrap;
    text-shadow: 0 0 12px rgba(255, 255, 255, 0.08);
  }

  .header .right-group {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 14px;
  }

  /* BUG 处理信息（带边框标签） */
  .right {
    font-size: 14px;
    font-weight: 400;
    letter-spacing: 0.08em;
    color: rgba(168, 198, 230, 0.75);
    white-space: nowrap;
    border: 1px solid rgba(168, 198, 230, 0.3);
    border-radius: 6px;
    padding: 6px 14px;
  }

  .divider {
    height: 1px;
    margin-top: 20px;
    background: rgba(255, 255, 255, 0.28);
  }

  /* 内容区：撑满剩余高度，内容多了在内部滚动 */
  .content {
    flex: 1 1 auto;
    min-height: 0;
    padding: 0 40px 40px;
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: rgba(168, 198, 230, 0.32) transparent;
  }

  /* 第一块与分割线共用一条边线 */
  .content .block:first-child {
    border-top: 0;
    border-top-left-radius: 0;
    border-top-right-radius: 0;
  }

  /* 独立区域：一道细边框把小标题和内容框在一起 */
  .block {
    padding: 16px 20px 18px;
    border: 1px solid rgba(168, 198, 230, 0.16);
    border-radius: 8px;
    background: rgba(168, 198, 230, 0.03);
  }

  .block + .block {
    margin-top: 16px;
  }

  /* 区域小标题：左侧一道短竖线 */
  .block-title {
    display: flex;
    align-items: center;
    margin-bottom: 14px;
    font-size: 13px;
    font-weight: 400;
    letter-spacing: 0.14em;
    color: rgba(178, 205, 232, 0.9);
  }

  .block-title::before {
    content: "";
    width: 2px;
    height: 12px;
    margin-right: 8px;
    border-radius: 1px;
    background: rgba(168, 198, 230, 0.55);
  }

  /* ===== 字段 ===== */
  .field-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 320px));
    gap: 14px 28px;
  }

  .field {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    min-width: 0;
  }

  /* 每个字段各自一个独立小框（队伍参数 / 计算结果用） */
  .field-grid.boxed {
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 12px;
  }

  .field-grid.boxed .field {
    padding: 10px 14px;
    border: 1px solid rgba(168, 198, 230, 0.16);
    border-radius: 6px;
    background: rgba(168, 198, 230, 0.03);
  }

  .field .label {
    font-size: 13px;
    letter-spacing: 0.05em;
    color: rgba(255, 255, 255, 0.6);
    white-space: nowrap;
  }

  .field input {
    flex: 0 0 112px;
    width: 112px;
    padding: 6px 8px;
    font-family: inherit;
    font-size: 13px;
    color: #e8f1fa;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(168, 198, 230, 0.25);
    border-radius: 6px;
    text-align: right;
  }

  .field input:focus {
    outline: none;
    border-color: rgba(168, 198, 230, 0.6);
  }

  /* 结果数值 */
  .field .value {
    font-size: 14px;
    color: #d3e4f6;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  /* 充能计算：吸收表（2 行 × 6 列）＋ 步进输入 */
  .energy-scroll {
    overflow-x: auto;
    padding-bottom: 4px;
    scrollbar-width: thin;
    scrollbar-color: rgba(168, 198, 230, 0.32) transparent;
  }

  .energy-grid {
    display: grid;
    grid-template-columns: 92px repeat(6, minmax(0, 1fr));
    gap: 10px 12px;
    align-items: center;
    min-width: 800px;                /* 窄屏时表格内部横向滚动，不挤成一团 */
  }

  .energy-head {
    font-size: 12px;
    letter-spacing: 0.03em;
    color: rgba(216, 230, 244, 0.72);
    white-space: nowrap;
  }

  .energy-row-label {
    font-size: 13px;
    letter-spacing: 0.03em;
    color: rgba(216, 230, 244, 0.88);
    white-space: nowrap;
  }

  /* 产球记录：每个角色一个小节，前台/后台各一行 6 个输入 */
  .energy-sub-title {
    margin: 14px 0 6px;
    font-size: 13px;
    font-weight: 400;
    letter-spacing: 0.04em;
    color: #e6f0fb;
  }

  .energy-sub-title:first-child {
    margin-top: 0;
  }

  .energy-line {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px 14px;
    margin-bottom: 8px;
  }

  .energy-line-label {
    flex: 0 0 auto;
    font-size: 13px;
    letter-spacing: 0.03em;
    color: rgba(216, 230, 244, 0.88);
    white-space: nowrap;
  }

  /* 六个「标签 + 输入框」等分整行宽度 */
  .energy-mini {
    display: inline-flex;
    flex: 1 1 0;
    min-width: 96px;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    letter-spacing: 0.03em;
    color: rgba(216, 230, 244, 0.88);
    white-space: nowrap;
  }

  .energy-mini > span {
    flex: 0 0 auto;
  }

  .energy-mini input {
    flex: 1 1 auto;
    width: 100%;
    min-width: 0;
    padding: 4px 6px;
    border: 1px solid rgba(168, 198, 230, 0.22);
    border-radius: 6px;
    background: rgba(168, 198, 230, 0.04);
    color: #e8f1fa;
    font-family: inherit;
    font-size: 13px;
    text-align: center;
    font-variant-numeric: tabular-nums;
  }

  .energy-mini input:focus {
    outline: none;
    border-color: rgba(168, 198, 230, 0.5);
    background: rgba(168, 198, 230, 0.10);
  }

  .energy-mini input::-webkit-outer-spin-button,
  .energy-mini input::-webkit-inner-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }

  /* 队伍角色：四个名称输入框（只改产球记录的小节标题，不参与计算） */
  .team-names {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 12px;
    margin-bottom: 16px;
  }

  .team-name {
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
  }

  .team-name > span {
    flex: 0 0 auto;
    font-size: 12px;
    letter-spacing: 0.04em;
    color: rgba(216, 230, 244, 0.6);
    white-space: nowrap;
  }

  .team-name input {
    flex: 1 1 auto;
    min-width: 0;
    width: 100%;
    padding: 5px 8px;
    font-family: inherit;
    font-size: 13px;
    text-align: center;
    color: #e8f1fa;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(168, 198, 230, 0.25);
    border-radius: 6px;
  }

  .team-name input::placeholder {
    color: rgba(220, 232, 244, 0.35);
  }

  .team-name input:focus {
    outline: none;
    border-color: rgba(168, 198, 230, 0.55);
  }

  /* − 数值 ＋ 的步进控件 */
  .stepper {
    display: flex;
    align-items: stretch;
    min-width: 0;
    border: 1px solid rgba(168, 198, 230, 0.22);
    border-radius: 6px;
    background: rgba(168, 198, 230, 0.04);
    overflow: hidden;
  }

  .stepper button {
    flex: 0 0 auto;
    width: 26px;
    border: 0;
    background: transparent;
    color: rgba(216, 230, 244, 0.75);
    font-family: inherit;
    font-size: 15px;
    line-height: 1;
    cursor: pointer;
  }

  .stepper button:hover {
    background: rgba(168, 198, 230, 0.14);
    color: #fff;
  }

  .stepper input {
    flex: 1 1 auto;
    min-width: 0;
    padding: 5px 2px;
    border: 0;
    background: transparent;
    color: #e8f1fa;
    font-family: inherit;
    font-size: 14px;
    text-align: center;
    font-variant-numeric: tabular-nums;
  }

  .stepper input:focus {
    outline: none;
    background: rgba(168, 198, 230, 0.08);
  }

  .stepper input::-webkit-outer-spin-button,
  .stepper input::-webkit-inner-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }

  /* 计算充能按钮 */
  .energy-run {
    display: block;
    width: 100%;
    margin-top: 12px;
    padding: 10px;
    border: 1px solid rgba(168, 198, 230, 0.28);
    border-radius: 8px;
    background: rgba(168, 198, 230, 0.10);
    color: #e6f0fb;
    font-family: inherit;
    font-size: 14px;
    letter-spacing: 0.06em;
    cursor: pointer;
  }

  .energy-run:hover {
    background: rgba(168, 198, 230, 0.18);
    border-color: rgba(168, 198, 230, 0.45);
  }

  /* 响应式：与 sdnjsq.html 的页头、字段保持一致 */
  @media (max-width: 1100px) {
    .team-names {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
  }

  @media (max-width: 900px) {
    .header {
      flex-direction: column;
      align-items: flex-start;
      gap: 14px;
      padding: 24px 20px 0;
    }

    .header .right-group {
      justify-content: flex-start;
    }

    .content {
      padding: 0 20px 24px;
    }
  }

  @media (max-width: 720px) {
    .main-title {
      font-size: 22px;
      letter-spacing: 0.14em;
      text-indent: 0.14em;
    }

    .team-names {
      grid-template-columns: minmax(0, 1fr);
    }

    .field-grid.boxed {
      grid-template-columns: minmax(0, 1fr);
    }

    .field input {
      flex-basis: 96px;
      width: 96px;
    }
  }
</style>
</head>
<body>

  <div class="wrap">

    <!-- 页头：主标题 + BUG 处理 + 分割线（仿 sdnjsq.html 的页头） -->
    <div class="top">
      <div class="header">
        <h1 class="main-title">充能计算</h1>

        <div class="right-group">
          <div class="right">BUG急速处理：1127293128</div>
        </div>
      </div>

      <div class="divider"></div>
    </div>

    <!-- 内容区 -->
    <div class="content" id="content">

      <!-- 充能计算：元素微粒/晶体的吸收表 ＋ 队伍参数 -->
      <div class="block" id="energy-block">
        <h3 class="block-title">充能计算</h3>

        <!-- 吸收表：两行（前台 / 后台）× 六列（同 / 异 / 无元素 的微粒 / 晶体） -->
        <div class="energy-scroll">
          <div class="energy-grid" id="energy-grid">
            <div class="energy-head">吸收类型</div>
            <div class="energy-head">同元素微粒</div>
            <div class="energy-head">异元素微粒</div>
            <div class="energy-head">无元素微粒</div>
            <div class="energy-head">同元素晶体</div>
            <div class="energy-head">异元素晶体</div>
            <div class="energy-head">无元素晶体</div>
            <!-- 12 个步进输入由脚本按 energyCoef 的表头顺序生成 -->
          </div>
        </div>

        <div class="field-grid boxed" style="margin-top:16px">
          <label class="field"><span class="label">队伍人数</span><input id="en-team" type="number" value="4" min="1" max="4" step="1"></label>
          <label class="field"><span class="label">所需能量</span><input id="en-need" type="number" value="60" step="1"></label>
          <label class="field"><span class="label">固定恢复能量</span><input id="en-flat" type="number" value="0" step="1"></label>
          <label class="field"><span class="label">元素充能效率（%）</span><input id="en-er" type="number" value="100" step="1"></label>
        </div>
      </div>

      <!-- 计算结果 -->
      <div class="block" id="energy-result-block">
        <h3 class="block-title">计算结果</h3>
        <button class="energy-run" type="button" id="en-run">计算充能</button>
        <div class="field-grid boxed" style="margin-top:12px">
          <div class="field"><span class="label">本轮获得能量</span><span class="value" id="en-gain">—</span></div>
          <div class="field"><span class="label">最低充能需求</span><span class="value" id="en-result">—</span></div>
        </div>
      </div>

      <!-- 产球记录：四个角色各一个小节（前台 / 后台 × 同 / 异 / 无 微 / 晶） -->
      <div class="block" id="energy-produce-block">
        <h3 class="block-title">产球记录</h3>

        <!-- 队伍角色名：只用于下面四个小节的标题，算法不会读取这些名字 -->
        <div class="team-names">
          <label class="team-name"><span>一号位</span><input class="team-name-input" id="team-c1" data-slot="c1" type="text" value="桑多涅" placeholder="角色名称" aria-label="一号位角色名称" title="修改后，下方对应小节标题会同步变化"></label>
          <label class="team-name"><span>二号位</span><input class="team-name-input" id="team-c2" data-slot="c2" type="text" value="奥黛塔" placeholder="角色名称" aria-label="二号位角色名称" title="修改后，下方对应小节标题会同步变化"></label>
          <label class="team-name"><span>三号位</span><input class="team-name-input" id="team-c3" data-slot="c3" type="text" value="米提亚" placeholder="角色名称" aria-label="三号位角色名称" title="修改后，下方对应小节标题会同步变化"></label>
          <label class="team-name"><span>四号位</span><input class="team-name-input" id="team-c4" data-slot="c4" type="text" value="七七" placeholder="角色名称" aria-label="四号位角色名称" title="修改后，下方对应小节标题会同步变化"></label>
        </div>

        <div id="energy-produce-body">
          <!-- 四个角色各一个小节（次标题跟着队友走），由脚本生成 -->
        </div>
      </div>

    </div>
  </div>

  <script>
    (function () {
      'use strict';

      /* ============================================================
         充能计算算法（照搬 sdnjsq.html 的充能计算板块）
         ============================================================ */

      var ENERGY_ROWS = ['前台吸收', '后台吸收'];
      var ENERGY_PICK_LABELS = ['同微', '异微', '无微', '同晶', '异晶', '无晶'];

      // 产球记录的四个位置（顺序与页面里四个名称输入框一致）
      var TEAM_SLOTS = ['c1', 'c2', 'c3', 'c4'];

      var STORE_KEY = 'sandrone-cnjs-v1';
      var calcTimer = null;
      var restoring = false;

      var content = document.getElementById('content');

      /* ---------- 基础小工具 ---------- */
      function byId(id) {
        return document.getElementById(id);
      }

      function setText(id, text) {
        var el = byId(id);
        if (el) el.textContent = text;
      }

      function num(id) {
        var el = byId(id);
        if (!el) return 0;                 // 字段被删掉或改名时按 0 处理，不会报错
        var v = parseFloat(el.value);
        return isNaN(v) ? 0 : v;
      }

      // 保留两位小数（带千分位），与 sdnjsq.html 的显示格式一致
      function num2(n) {
        var v = Math.round((isNaN(n) ? 0 : n) * 100) / 100;
        return v.toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      }

      /* ---------- 充能计算：微粒/晶体的吸收表 + 最低充能需求 ---------- */
      // 数值取自官方机制（微粒 1 点、晶球 = 3 微粒；同元素×3、无元素×2、异元素×1；
      // 后台系数随队伍人数变化：2 人 0.8、3 人 0.7、4 人 0.6）
      function offFieldCoef() {
        var n = Math.round(num('en-team'));
        if (n <= 2) return 0.8;
        if (n === 3) return 0.7;
        return 0.6;
      }

      // row：0 前台 / 1 后台；col：0~2 微粒（同/异/无）、3~5 晶体（同/异/无）
      function energyCoef(row, col) {
        var base = col < 3 ? 1 : 3;                 // 微粒 1 点、晶体 3 点
        var elem = [3, 1, 2][col % 3];              // 同元素 3、异元素 1、无元素 2
        var pos = row === 0 ? 1 : offFieldCoef();   // 前台 1、后台随队伍人数
        return base * elem * pos;
      }

      // 生成 12 个步进输入（顺序与表头一致）
      function buildEnergyGrid() {
        var grid = document.getElementById('energy-grid');
        if (!grid) return;

        for (var row = 0; row < 2; row++) {
          var lab = document.createElement('div');
          lab.className = 'energy-row-label';
          lab.textContent = ENERGY_ROWS[row];
          grid.appendChild(lab);

          for (var col = 0; col < 6; col++) {
            var id = 'en-' + row + '-' + col;
            var box = document.createElement('div');
            box.className = 'stepper';
            box.innerHTML =
              '<button type="button" data-step="-1" data-for="' + id + '">−</button>' +
              '<input id="' + id + '" type="number" value="0" step="1" min="0">' +
              '<button type="button" data-step="1" data-for="' + id + '">＋</button>';
            grid.appendChild(box);
          }
        }
      }

      /* ---------- 产球记录：每个角色一个小节（前台/后台 × 同/异/无 微/晶） ---------- */
      function buildEnergyProduce() {
        var body = document.getElementById('energy-produce-body');
        if (!body || body.querySelector('input')) return;

        for (var i = 0; i < TEAM_SLOTS.length; i++) {
          var slot = TEAM_SLOTS[i];
          var sn = slot.substring(1);

          var title = document.createElement('h4');
          title.className = 'energy-sub-title';
          title.id = 'enp-title-' + sn;
          title.textContent = '';          // 次标题在 calc() 里按名称输入框填
          body.appendChild(title);

          for (var row = 0; row < 2; row++) {
            var line = document.createElement('div');
            line.className = 'energy-line';

            var lab = document.createElement('span');
            lab.className = 'energy-line-label';
            lab.textContent = row === 0 ? '【前台】' : '【后台】';
            line.appendChild(lab);

            for (var col = 0; col < 6; col++) {
              var mini = document.createElement('label');
              mini.className = 'energy-mini';
              mini.innerHTML = '<span>' + ENERGY_PICK_LABELS[col] + ':</span>' +
                               '<input id="enp-' + sn + '-' + row + '-' + col +
                               '" type="number" value="0" step="1" min="0">';
              line.appendChild(mini);
            }
            body.appendChild(line);
          }
        }
      }

      // 小节标题跟着「队伍角色」的四个名称输入框刷新
      function syncEnergyProduceTitles() {
        for (var i = 0; i < TEAM_SLOTS.length; i++) {
          var slot = TEAM_SLOTS[i];
          var input = byId('team-' + slot);
          var name = input ? String(input.value || '').trim() : '';
          setText('enp-title-' + slot.substring(1), name || '未命名');
        }
      }

      function calcEnergy() {
        var gain = 0;                                        // 一轮里吃到的能量（不含充能效率）

        for (var row = 0; row < 2; row++) {
          for (var col = 0; col < 6; col++) {
            gain += num('en-' + row + '-' + col) * energyCoef(row, col);
          }
        }

        var need = num('en-need');
        var flat = num('en-flat');
        var er = num('en-er') / 100;
        var have = gain * er + flat;                         // 本轮实际获得
        var minEr = gain > 0 ? (need - flat) / gain : 0;      // 最低充能需求（倍率）

        setText('en-gain', num2(have));
        setText('en-result', gain > 0 ? (minEr * 100).toFixed(1) + '%' : '—');
      }

      function calc() {
        syncEnergyProduceTitles();
        calcEnergy();
      }

      // 连续敲输入框时合并重算，避免每敲一个字符都算一遍
      function scheduleCalc() {
        if (calcTimer) clearTimeout(calcTimer);
        calcTimer = setTimeout(function () {
          calcTimer = null;
          calc();
        }, 40);
      }

      /* ---------- 本地记忆：把填写内容存到浏览器里，刷新后保持 ---------- */
      function saveState() {
        if (restoring) return;

        var fields = {};
        var els = content.querySelectorAll('input:not([type="checkbox"])[id], select[id]');
        for (var i = 0; i < els.length; i++) fields[els[i].id] = els[i].value;

        try {
          localStorage.setItem(STORE_KEY, JSON.stringify({ fields: fields }));
        } catch (e) {
          /* 浏览器禁用本地存储时静默跳过，功能不受影响 */
        }
      }

      function loadState() {
        var data = {};
        try {
          data = JSON.parse(localStorage.getItem(STORE_KEY) || '{}') || {};
        } catch (e) {
          data = {};
        }

        restoring = true;

        if (data.fields && typeof data.fields === 'object') {
          for (var id in data.fields) {
            if (!Object.prototype.hasOwnProperty.call(data.fields, id)) continue;
            var el = byId(id);
            if (el) el.value = data.fields[id];
          }
        }

        restoring = false;
      }

      /* ---------- 事件 ---------- */
      function onContentEdit(ev) {
        var el = ev.target;
        if (!el || !el.tagName) return;
        if (el.tagName !== 'INPUT' && el.tagName !== 'SELECT') return;

        // 改队伍角色名：先同步小节标题
        if (el.classList && el.classList.contains('team-name-input')) {
          syncEnergyProduceTitles();
        }

        scheduleCalc();
        saveState();
      }

      /* ---------- 初始化 ---------- */
      buildEnergyGrid();
      buildEnergyProduce();

      // − / ＋ 按钮
      var stepBtns = document.querySelectorAll('.stepper button[data-step]');
      for (var sb = 0; sb < stepBtns.length; sb++) {
        stepBtns[sb].addEventListener('click', function () {
          var input = byId(this.getAttribute('data-for'));
          if (!input) return;

          var step = parseFloat(this.getAttribute('data-step')) || 0;
          var v = parseFloat(input.value) || 0;
          input.value = Math.max(0, v + step);               // 数量不为负
          calcEnergy();
          saveState();
        });
      }

      // 计算充能按钮
      var enRun = document.getElementById('en-run');
      if (enRun) enRun.addEventListener('click', calcEnergy);

      loadState();
      calc();

      if (content) {
        content.addEventListener('input', onContentEdit);
        content.addEventListener('change', onContentEdit);
      }
    })();
  </script>

</body>
</html>
