<!DOCTYPE html>
<html lang="zh-CN">
<head>
     <link rel="icon" href="资料库.png">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title></title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #000;
            color: #fff;
            font-family: sans-serif;
            padding: 20px;
        }

        /* 顶部标题框 */
        .header-box {
            border: 2px solid #999;
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            background-color: rgba(0,0,0,0.6);
            margin-bottom: 40px;
        }
        .header-title {
            font-size: 40px;
            color: #b76ed8;
            font-weight: bold;
            margin: 0 0 10px;
        }
        .header-subtitle {
            font-size: 22px;
            color: #ddd;
            margin: 0 0 10px;
        }
        .header-note {
            font-size: 16px;
            color: #bbb;
            line-height: 1.5;
        }

        /* 角色卡片容器 */
        .card-container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        /* 角色卡片样式 */
        .char-card {
            width: 180px;
            border: 2px solid #999;
            border-radius: 12px;
            overflow: hidden;
            background-color: rgba(0,0,0,0.6);
            text-align: center;
            text-decoration: none; /* 去掉链接下划线 */
            color: inherit;       /* 文字颜色继承 */
        }
        .char-card img {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
        }
        .char-name {
            padding: 10px 0;
            font-size: 18px;
            color: #fff;
        }
  






.xcd_wrap{max-width:1200px;margin:35px auto 0;padding:0 8px;}
.xcd_title{text-align:center;font-size:clamp(20px,4vw,24px);color:#ffd322;margin-bottom:16px;}
.xcd_table_head{
    display:grid;
    grid-template-columns:1fr 1fr;
    background:#2b2b2b;
    padding:13px 8px;
    border-radius:8px 8px 0 0;
    font-weight:bold;gap:6px;color:#fff;
}
.xcd_table_row{
    display:grid;
    grid-template-columns:1fr 1fr;
    padding:12px 8px;border-bottom:1px solid #333;gap:6px;
}
.xcd_input{
    width:100%;background:#222;border:1px solid #555;color:#fff;
    padding:8px;border-radius:6px;font-size:15px;outline:none;
}
.xcd_result{
    width:100%;background:#222;border:1px solid #555;color:#fff;
    padding:8px;border-radius:6px;
}
.xcd_btn{
    width:100%;margin-top:14px;padding:11px;background:#2578f5;
    border:none;border-radius:6px;color:#fff;font-size:16px;cursor:pointer;
}
@media(max-width:720px){
    .xcd_table_head,.xcd_table_row{grid-template-columns:1fr 1fr;gap:4px;}
}
</style>

<div class="xcd_wrap">
    <div class="xcd_title">星超导直伤计算器</div>

    <div class="xcd_table_head">
        <div>星超导基础倍率</div>
        <div>角色技能倍率</div>
    </div>
    <div class="xcd_table_row">
        <div><input class="xcd_input" id="baseRate" placeholder="例：1.5"></div>
        <div><input class="xcd_input" id="skillRate" placeholder="例：1.615"></div>
    </div>

    <div class="xcd_table_head">
        <div>角色攻击力</div>
        <div>1+基础提升倍率</div>
    </div>
    <div class="xcd_table_row">
        <div><input class="xcd_input" id="atk" placeholder="例：3249"></div>
        <div><input class="xcd_input" id="baseUp" placeholder="提升14%填1.14"></div>
    </div>

    <div class="xcd_table_head">
        <div>元素精通数值</div>
        <div>星超导增伤</div>
    </div>
    <div class="xcd_table_row">
        <div><input class="xcd_input" id="em" placeholder="例：822"></div>
        <div><input class="xcd_input" id="addPct" placeholder="例1.4"></div>
    </div>

    <div class="xcd_table_head">
        <div>额外提升</div>
        <div>暴击区（双爆乘区</div>
    </div>
    <div class="xcd_table_row">
        <div><input class="xcd_input" id="extraVal" placeholder="无额外填0"></div>
        <div><input class="xcd_input" id="critRate" placeholder="例：3.242"></div>
    </div>

    <div class="xcd_table_head">
        <div>抗性系数</div>
        <div>擢升</div>
    </div>
    <div class="xcd_table_row">
        <div><input class="xcd_input" id="resRate" placeholder="例：1.225"></div>
        <div><input class="xcd_input" id="allUpRate" placeholder="无提升填1"></div>
    </div>

    <div class="xcd_table_head">
        <div>最终直伤</div>
        <div></div>
    </div>
    <div class="xcd_table_row">
        <div><div class="xcd_result" id="resultOut">等待计算</div></div>
        <div></div>
    </div>

    <button class="xcd_btn" onclick="calcXCD()">计算最终伤害</button>
</div>

<script>
function calcXCD(){
    let base = Number(document.getElementById('baseRate').value)||1;
    let skill = Number(document.getElementById('skillRate').value)||1;
    let atk = Number(document.getElementById('atk').value)||0;
    let baseUp = Number(document.getElementById('baseUp').value)||1;
    let em = Number(document.getElementById('em').value)||0;
    let addBonus = Number(document.getElementById('addPct').value)||0;
    let extra = Number(document.getElementById('extraVal').value)||0;
    let crit = Number(document.getElementById('critRate').value)||1;
    let res = Number(document.getElementById('resRate').value)||1;
    let allUp = Number(document.getElementById('allUpRate').value)||1;

    //精通增伤
    let emAdd = 6 * em / (em + 2000);
    //增伤直接相加，不再÷100
    let damageBonus = 1 + emAdd + addBonus;

    let baseDamage = base * skill * atk * baseUp * damageBonus;
    let finalDamage = (baseDamage + extra) * crit * res * allUp;

    document.getElementById('resultOut').innerText = finalDamage.toFixed(2);
}
</script>
