<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>原神BUFF排轴工具</title>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", sans-serif;
        }
        body {
            background: #121419;
            color: #eee;
            padding: 16px;
            overflow-x: auto;
            position: relative;
        }
        /* 羽化哲全局水印 */
        .watermark-wrap {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 999;
            overflow: hidden;
        }
        .watermark-item {
            position: absolute;
            color: rgba(255, 255, 255, 0.07);
            font-size: 22px;
            transform: rotate(-30deg);
            white-space: nowrap;
        }
        .container {
            min-width: 1600px;
            position: relative;
            z-index: 1;
        }
        .control-bar {
            margin-bottom: 16px;
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        button {
            background: #3b5380;
            color: #fff;
            border: none;
            padding: 7px 12px;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
        }
        button:hover {
            background: #4e6ca3;
        }
        .danger-btn{
            background:#7c3c3c;
        }
        .danger-btn:hover{
            background:#964848;
        }
        input, select {
            background: #1e232c;
            border: 1px solid #444;
            color: white;
            padding: 6px 9px;
            border-radius: 4px;
        }
        .timeline-container {
            display:flex;
            margin-top:30px;
            border-top: 2px solid #555;
            position:relative;
        }
        /* 左侧角色名称栏 */
        .role-sidebar{
            width:110px;
            border-right:1px solid #444;
        }
        .role-sidebar-item{
            height:52px;
            padding-left:8px;
            display:flex;
            align-items:center;
            font-size:14px;
            background:#181b22;
            border-bottom:1px dashed #2c3038;
            cursor:pointer;
        }
        .role-sidebar-item:hover{
            background:#222730;
        }
        /* 右侧时间轴区域 */
        .timeline-wrap {
            position: relative;
            flex:1;
            min-width:1300px;
        }
        /* 刻度通用 */
        .tick-line {
            position: absolute;
            top: -30px;
            width: 1px;
        }
        .tick-long {
            height:14px;
            background: #888;
        }
        .tick-middle {
            height:10px;
            background:#707070;
        }
        .tick-short {
            height:6px;
            background:#606060;
        }
        .tick-label {
            position: absolute;
            top: -28px;
            transform: translateX(-50%);
            font-size: 11px;
            color: #aaa;
            white-space: nowrap;
        }
        .role-track-line{
            position:absolute;
            left:0;
            right:0;
            height:52px;
            border-bottom:1px dashed #2c3038;
        }
        /* Buff色块 */
        .buff-block {
            position: absolute;
            height: 42px;
            top:5px;
            border-radius: 6px;
            padding: 0 8px;
            display: flex;
            align-items: center;
            cursor: move;
            font-size:13px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            box-shadow: 0 2px 8px #0006;
            border:1px solid rgba(255,255,255,0.15);
            z-index:10;
        }
        .buff-block .resize-right{
            position:absolute;
            right:0;
            top:0;
            width:8px;
            height:100%;
            cursor: ew-resize;
        }
        .buff-block:hover .del-btn{
            display:block;
        }
        .del-btn{
            display:none;
            position:absolute;
            right:12px;
            top:4px;
            background:#0007;
            border:none;
            color:#ff9999;
            width:18px;
            height:18px;
            font-size:14px;
            line-height:16px;
            text-align:center;
            padding:0;
            border-radius:3px;
        }
        #capture-area{
            position:relative;
        }
    </style>
</head>
<body>
<div class="watermark-wrap" id="watermarkBox"></div>
<div class="container">
    <div class="control-bar">
        <button id="addRole">➕ 添加角色</button>
        <select id="roleSelect"></select>
        <button id="addBuff">➕ 添加BUFF板块</button>
        <span>起始时间(s)：</span>
        <input type="number" step="0.1" id="startTime" value="0.0" style="width:80px">
        <span>持续时长(s)：</span>
        <input type="number" step="0.1" id="duration" value="8.0" style="width:80px">
        <span>BUFF名称：</span>
        <input type="text" id="buffName" placeholder="" value="">
        <span>颜色：</span>
        <input type="color" id="buffColor" value="#864343">
        <button id="exportImg">💾 导出PNG图片</button>
        <button id="exportExcel">📊 导出Excel表格</button>
        <button class="danger-btn" id="clearAll">🗑️ 清空全部数据</button>
    </div>
    <div id="capture-area" class="timeline-container">
        <div class="role-sidebar" id="roleSidebar"></div>
        <div class="timeline-wrap" id="timeline"></div>
    </div>
</div>
<script>
    const timelineDom = document.getElementById('timeline');
    const roleSidebar = document.getElementById('roleSidebar');
    const roleSelect = document.getElementById('roleSelect');
    const captureArea = document.getElementById('capture-area');
    const watermarkBox = document.getElementById('watermarkBox');
    const MAX_TIME = 30;
    let PX_PER_SEC = 32;
    const MIN_SCALE = 16;
    const MAX_SCALE = 64;
    let roleList = [];
    let buffList = [];
    const STORAGE_KEY = "genshin-buff-timeline";
    function round01(num){
        return Math.round((num + Number.EPSILON) * 10) / 10;
    }
    // 羽化哲水印
    function createWaterMark() {
        watermarkBox.innerHTML = "";
        const str = "羽化哲";
        const col = Math.ceil(document.documentElement.clientWidth / 220);
        const row = Math.ceil(document.documentElement.clientHeight / 200);
        for(let i=0; i<row; i++){
            for(let j=0; j<col; j++){
                const div = document.createElement("div");
                div.className = "watermark-item";
                div.innerText = str;
                div.style.left = j*220 + "px";
                div.style.top = i*200 + "px";
                watermarkBox.appendChild(div);
            }
        }
    }
    createWaterMark();
    window.addEventListener('resize', createWaterMark);
    // 滚轮缩放
    timelineDom.addEventListener('wheel',(e)=>{
        e.preventDefault();
        const delta = e.deltaY > 0 ? -1 : 1;
        PX_PER_SEC += delta * 2;
        PX_PER_SEC = Math.max(MIN_SCALE, Math.min(MAX_SCALE, PX_PER_SEC));
        renderAxis();
    },{passive:false});
    // 本地存储
    function saveData(){
        localStorage.setItem(STORAGE_KEY,JSON.stringify({roleList,buffList}));
    }
    function loadData(){
        const str = localStorage.getItem(STORAGE_KEY);
        if(str){
            try{
                const data = JSON.parse(str);
                roleList = data.roleList;
                buffList = data.buffList;
                buffList.forEach(b=>{
                    b.start = round01(b.start);
                    b.duration = round01(b.duration);
                })
            }catch(e){ initDefaultData(); }
        }else{ initDefaultData(); }
    }
    function initDefaultData(){
        roleList = [{name:"角色1"},{name:"角色2"},{name:"角色3"}];
        buffList = [];
        saveData();
    }
    // 渲染坐标轴（整数循环，0~30全部整数秒显示文字）
    function renderAxis(){
        timelineDom.innerHTML = "";
        const totalTickCount = MAX_TIME * 10;
        for(let i = 0; i <= totalTickCount; i++){
            const t = i * 0.1;
            const leftPos = t * PX_PER_SEC;
            const divTick = document.createElement('div');
            divTick.className = 'tick-line';
            divTick.style.left = leftPos + 'px';
            if(i % 10 === 0){
                divTick.classList.add('tick-long');
                const label = document.createElement('div');
                label.className = 'tick-label';
                label.innerText = `${i/10}s`;
                label.style.left = leftPos + 'px';
                timelineDom.appendChild(label);
            }else if(i % 10 === 5){
                divTick.classList.add('tick-middle');
            }else{
                divTick.classList.add('tick-short');
            }
            timelineDom.appendChild(divTick);
        }
        renderRoles();
        renderAllBuff();
    }
    function renderRoles(){
        roleSidebar.innerHTML = "";
        roleSelect.innerHTML = "";
        document.querySelectorAll('.role-track-line').forEach(el=>el.remove());
        roleList.forEach((role,idx)=>{
            const sideItem = document.createElement('div');
            sideItem.className = 'role-sidebar-item';
            sideItem.innerText = role.name;
            sideItem.onclick = ()=>{
                const newName = prompt("修改角色名称：",role.name);
                if(newName && newName.trim()!=""){
                    role.name = newName.trim();
                    saveData();
                    renderAxis();
                }
            };
            roleSidebar.appendChild(sideItem);
            const opt = document.createElement('option');
            opt.innerText = role.name;
            opt.value = idx;
            roleSelect.appendChild(opt);
            const line = document.createElement('div');
            line.className = 'role-track-line';
            line.style.top = idx * 52 + 'px';
            timelineDom.appendChild(line);
        })
    }
    function renderAllBuff(){
        document.querySelectorAll('.buff-block').forEach(el=>el.remove());
        buffList.forEach((buff,idx)=>drawBuffBlock(buff,idx));
    }
    function drawBuffBlock(buff, idx){
        const div = document.createElement('div');
        div.className = 'buff-block';
        div.dataset.index = idx;
        div.style.left = buff.start * PX_PER_SEC + 'px';
        div.style.width = buff.duration * PX_PER_SEC + 'px';
        div.style.top = buff.roleIndex * 52 + 5 + 'px';
        div.style.background = buff.color;
        div.innerText = buff.name;
        const resize = document.createElement('div');
        resize.className = 'resize-right';
        div.appendChild(resize);
        const delBtn = document.createElement('button');
        delBtn.className = 'del-btn';
        delBtn.innerText = '×';
        delBtn.onclick = (e)=>{
            e.stopPropagation();
            buffList.splice(idx,1);
            saveData();
            renderAxis();
        };
        div.appendChild(delBtn);
        timelineDom.appendChild(div);
        dragElement(div, buff);
        resizeDrag(resize, buff, div);
    }
    function dragElement(el, buff){
        let startX, originLeft;
        el.onmousedown = (e)=>{
            if(e.target.classList.contains('resize-right') || e.target.classList.contains('del-btn')) return;
            startX = e.clientX;
            originLeft = buff.start;
            document.onmousemove = (ev)=>{
                const delta = ev.clientX - startX;
                let newStart = round01(Math.max(0, originLeft + delta / PX_PER_SEC));
                buff.start = newStart;
                el.style.left = buff.start * PX_PER_SEC + 'px';
            };
            document.onmouseup = ()=>{
                document.onmousemove = null;
                document.onmouseup = null;
                saveData();
            }
        }
    }
    function resizeDrag(el, buff, blockDom){
        let startX, originDur;
        el.onmousedown = (e)=>{
            e.stopPropagation();
            startX = e.clientX;
            originDur = buff.duration;
            document.onmousemove = (ev)=>{
                const delta = ev.clientX - startX;
                let newDur = round01(Math.max(0.1, originDur + delta / PX_PER_SEC));
                buff.duration = newDur;
                blockDom.style.width = buff.duration * PX_PER_SEC + 'px';
            };
            document.onmouseup = ()=>{
                document.onmousemove = null;
                document.onmouseup = null;
                saveData();
            }
        }
    }
    document.getElementById('addRole').onclick = ()=>{
        const name = prompt("输入角色名称：","");
        if(!name || name.trim()=="") return;
        roleList.push({name:name.trim()});
        saveData();
        renderAxis();
    };
    document.getElementById('addBuff').onclick = ()=>{
        const name = document.getElementById('buffName').value || "BUFF";
        let start = round01(Number(document.getElementById('startTime').value));
        let dur = round01(Number(document.getElementById('duration').value));
        if(dur < 0.1) dur = 0.1;
        if(start <0) start=0;
        const color = document.getElementById('buffColor').value;
        const roleIdx = Number(roleSelect.value);
        buffList.push({name, start, duration:dur, color, roleIndex: roleIdx});
        saveData();
        renderAllBuff();
    };
    // 导出PNG
    document.getElementById('exportImg').onclick = async ()=>{
        const btn = document.getElementById("exportImg");
        btn.innerText = "正在生成图片...";
        try{
            const canvas = await html2canvas(captureArea,{
                backgroundColor:"#121419", scale:2, useCORS:true
            });
            const link = document.createElement("a");
            link.download = "原神BUFF排轴_0.1s精度.png";
            link.href = canvas.toDataURL("image/png");
            link.click();
        }catch(err){ alert("导出失败！"); console.error(err); }
        btn.innerText = "💾 导出PNG图片";
    }

    // ========== 导出Excel：数据表 + 甘特图样式时间轴 ==========
    document.getElementById("exportExcel").onclick = ()=>{
        const wb = XLSX.utils.book_new();

        // ---- Sheet1: BUFF数据明细 ----
        const tableData = [
            ["角色名称","BUFF名称","起始时间(s)","持续时长(s)","颜色色值"]
        ];
        buffList.forEach(buff=>{
            const roleName = roleList[buff.roleIndex]?.name || "未知角色";
            tableData.push([roleName, buff.name, buff.start, buff.duration, buff.color]);
        });
        const wsData = XLSX.utils.aoa_to_sheet(tableData);
        wsData['!cols'] = [{wch:12},{wch:18},{wch:12},{wch:12},{wch:12}];
        XLSX.utils.book_append_sheet(wb, wsData, "BUFF数据明细");

        // ---- Sheet2: BUFF时间轴（甘特图带颜色） ----
        const totalSec = MAX_TIME; // 0~30 共31列
        const aoa = [];
        // 第1行：表头
        const header = ["角色\\时间"];
        for(let s = 0; s <= totalSec; s++){
            header.push(s + "s");
        }
        aoa.push(header);
        // 角色行（先填充空数据，后面再上色）
        roleList.forEach(role=>{
            const row = [role.name];
            for(let s = 0; s <= totalSec; s++){
                row.push("");
            }
            aoa.push(row);
        });
        const wsGantt = XLSX.utils.aoa_to_sheet(aoa);

        // 设置列宽
        const cols = [{wch:14}]; // 角色名列
        for(let s = 0; s <= totalSec; s++){
            cols.push({wch:4}); // 时间列窄一点
        }
        wsGantt['!cols'] = cols;

        // 设置行高
        const rows = [{hpt:22}]; // 表头行
        roleList.forEach(()=> rows.push({hpt:26}));
        wsGantt['!rows'] = rows;

        // 表头样式（深色背景白字）
        const headerStyle = {
            fill: { fgColor: { rgb: "FF2C3038" } },
            font: { color: { rgb: "FFFFFFFF" }, bold: true, sz: 11 },
            alignment: { horizontal: "center", vertical: "center" },
            border: {
                top: { style: "thin", color: { rgb: "FF555555" } },
                bottom: { style: "thin", color: { rgb: "FF555555" } },
                left: { style: "thin", color: { rgb: "FF555555" } },
                right: { style: "thin", color: { rgb: "FF555555" } }
            }
        };
        for(let c = 0; c <= totalSec + 1; c++){
            const cellAddr = XLSX.utils.encode_cell({r:0, c});
            if(wsGantt[cellAddr]){
                wsGantt[cellAddr].s = headerStyle;
            }
        }

        // 角色名列样式
        const roleNameStyle = {
            fill: { fgColor: { rgb: "FF1E232C" } },
            font: { color: { rgb: "FFFFFFFF" }, sz: 11 },
            alignment: { horizontal: "center", vertical: "center" },
            border: {
                top: { style: "thin", color: { rgb: "FF333333" } },
                bottom: { style: "thin", color: { rgb: "FF333333" } },
                left: { style: "thin", color: { rgb: "FF333333" } },
                right: { style: "thin", color: { rgb: "FF333333" } }
            }
        };
        roleList.forEach((_, idx)=>{
            const cellAddr = XLSX.utils.encode_cell({r: idx + 1, c: 0});
            if(wsGantt[cellAddr]){
                wsGantt[cellAddr].s = roleNameStyle;
            }
        });

        // 背景网格线样式（空白格子淡色边框）
        const gridStyle = {
            fill: { fgColor: { rgb: "FF121419" } },
            border: {
                top: { style: "hair", color: { rgb: "FF2C3038" } },
                bottom: { style: "hair", color: { rgb: "FF2C3038" } },
                left: { style: "hair", color: { rgb: "FF2C3038" } },
                right: { style: "hair", color: { rgb: "FF2C3038" } }
            }
        };
        for(let r = 1; r <= roleList.length; r++){
            for(let c = 1; c <= totalSec + 1; c++){
                const cellAddr = XLSX.utils.encode_cell({r, c});
                if(wsGantt[cellAddr]){
                    wsGantt[cellAddr].s = gridStyle;
                }
            }
        }

        // 合并单元格 & 填充BUFF颜色
        const merges = [];
        buffList.forEach(buff=>{
            const rowIdx = buff.roleIndex + 1; // 第0行是表头
            // 计算起始列和结束列（1秒一列，四舍五入）
            const startCol = Math.round(buff.start) + 1; // +1 因为第0列是角色名
            const endCol = Math.round(buff.start + buff.duration) + 1;
            const safeEnd = Math.min(endCol, totalSec + 1);
            const safeStart = Math.max(startCol, 1);

            if(safeEnd <= safeStart) return;

            // 合并单元格
            merges.push({
                s: { r: rowIdx, c: safeStart },
                e: { r: rowIdx, c: safeEnd - 1 }
            });

            // 填充颜色（#rrggbb -> FFrrggbb）
            const hexColor = "FF" + buff.color.replace("#","").toUpperCase();
            const buffStyle = {
                fill: { fgColor: { rgb: hexColor } },
                font: { color: { rgb: "FFFFFFFF" }, bold: true, sz: 10 },
                alignment: { horizontal: "center", vertical: "center", wrapText: true },
                border: {
                    top: { style: "thin", color: { rgb: "FF444444" } },
                    bottom: { style: "thin", color: { rgb: "FF444444" } },
                    left: { style: "thin", color: { rgb: "FF444444" } },
                    right: { style: "thin", color: { rgb: "FF444444" } }
                }
            };

            // 起始格写入BUFF名称，并应用样式
            const startAddr = XLSX.utils.encode_cell({r: rowIdx, c: safeStart});
            if(wsGantt[startAddr]){
                wsGantt[startAddr].v = buff.name;
                wsGantt[startAddr].s = buffStyle;
            }
            // 其余合并格也应用样式
            for(let c = safeStart + 1; c < safeEnd; c++){
                const addr = XLSX.utils.encode_cell({r: rowIdx, c});
                if(wsGantt[addr]){
                    wsGantt[addr].s = buffStyle;
                }
            }
        });
        wsGantt['!merges'] = merges;

        XLSX.utils.book_append_sheet(wb, wsGantt, "BUFF时间轴");

        // 导出
        XLSX.writeFile(wb, "原神BUFF排轴_带颜色甘特图.xlsx");
    }

    // 清空全部
    document.getElementById("clearAll").onclick = ()=>{
        if(confirm("确定清空所有角色与BUFF数据？无法恢复！")){
            initDefaultData();
            renderAxis();
        }
    }
    loadData();
    renderAxis();
</script>
</body>
</html>
