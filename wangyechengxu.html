<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>羽化哲</title>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:system-ui,"Microsoft YaHei",sans-serif;
}

body{
    /* ===== 底图（叠加 35% 黑色遮罩，让背景稍稍变暗） ===== */
    background-color: #16181d;
    background-image: 
        linear-gradient(rgba(0, 0, 0, 0.35), rgba(0, 0, 0, 0.35)),
        url("背景2.jpg");
    background-position: center;
    background-size: cover;
    background-repeat: no-repeat;
    background-attachment: fixed;

    padding:30px 14px;
    color:#ffffff;
    min-height: 100vh;
}

.wrap{
    max-width:680px;
    margin:0 auto;
    display:flex;
    flex-direction:column;
    gap:18px;
}

/* ===== 全透明卡片 ===== */
.version-box{
    background: transparent;
    backdrop-filter: none;
    -webkit-backdrop-filter: none;
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius:14px;
    padding:22px 20px;
    text-align:center;
    transition: all 0.25s ease;
    box-shadow: none;
}
.version-box:hover{
    border-color: rgba(96, 165, 250, 0.45);
    transform: translateY(-2px);
    background: transparent;
}

.version-box a{
    font-size:20px;
    color:#60a5fa;
    text-decoration:none;
    transition:0.2s;
    display:block;
    margin-bottom:6px;
    font-weight: 600;
    /* 增强文字阴影，防止亮色背景下看不清 */
    text-shadow: 0 1px 4px rgba(0, 0, 0, 0.9), 0 0 6px rgba(0, 0, 0, 0.6);
}
.version-box a:hover{
    color:#38bdf8;
    text-shadow: 0 1px 4px rgba(0, 0, 0, 0.9), 0 0 10px rgba(56, 189, 248, 0.6);
}

.version-box p{
    font-size:14px;
    color:#93c5fd;
    line-height:1.5;
    text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9), 0 0 5px rgba(0, 0, 0, 0.5);
}

/*手机适配*/
@media(max-width:600px){
    body{
        padding:20px 10px;
    }
    .wrap{
        gap:14px;
    }
    .version-box{
        padding:18px 14px;
        border-radius:12px;
    }
    .version-box a{
        font-size:17px;
    }
    .version-box p{
        font-size:13px;
    }
}
</style>
</head>
<body>
<div class="wrap">
     <div class="version-box">
        <a href="网页自动化计算/p.1.html">原神BUFF排轴工具</a>
        <p>版本：v2.1---2026.9.14重磅发布</p>
    </div>
    <div class="version-box">
        <a href="网页自动化计算/cn.html">角色充能计算器</a>
        <p>版本：v4.1---2026.10.19|重做上新</p>
    </div>
   
    <div class="version-box">
        <a href="网页自动化计算/mb.html">自定义面板计算</a>
        <p>版本：v2.1---2026.10.19|重做上新</p>
    </div>
    
    <div class="version-box">
        <a href="网页自动化计算/kangxingxishu.html">抗性/防御系数计算</a>
        <p>版本：v2.1----2026.9.15重磅发布</p>
    </div>
    
 <div class="version-box">
        <a href="网页自动化计算/js.html">记事本</a>
         <p>版本：v1.1---2026.8.26发布</p>
    </div>
</div>
</body>
</html>
