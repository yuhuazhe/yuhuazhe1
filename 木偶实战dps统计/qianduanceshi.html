<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>队伍DPS数据展示</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: "Noto Sans SC", sans-serif;
            background-color: #080808;
            color: #e5e7eb;
        }
        .header-card {
            background-color: #181818;
            border: 1px solid #374151;
        }
        .btn-primary {
            background-color: #111827;
            border: 1px solid #3b82f6;
            color: #3b82f6;
        }
        .btn-primary:hover {
            background-color: #3b82f6;
            color: #000;
        }
        .btn-submit {
            background-color: #111827;
            border: 1px solid #10b981;
            color: #10b981;
        }
        .btn-submit:hover {
            background-color: #10b981;
            color: #000;
        }
        .input-dark {
            background-color: #111827;
            border: 1px solid #374151;
            color: #f3f4f6;
        }
        .input-dark:focus {
            outline: none;
            border-color: #3b82f6;
        }
        table {
            border-collapse: collapse;
        }
        th {
            background-color: #1f2937;
        }
        .modal {
            display: none;
            background-color: rgba(0,0,0,0.85);
        }
    </style>
</head>
<body class="min-h-screen p-3 md:p-6">
    <!-- 头部区域 -->
    <div class="header-card rounded-xl p-5 md:p-8 mb-6 max-w-6xl mx-auto">
        <h1 class="text-3xl md:text-4xl font-bold text-amber-400 text-center mb-6">队伍DPS数据榜单</h1>
        <div class="flex flex-col md:flex-row gap-3 justify-center items-center mb-6">
            <input type="text" id="searchInput" placeholder="搜索昵称/角色队伍" class="input-dark px-4 py-2 rounded-lg w-full md:w-64">
            <select id="sortSelect" class="input-dark px-4 py-2 rounded-lg w-full md:w-auto">
                <option value="default">默认排序</option>
                <option value="dps-desc">DPS 降序</option>
                <option value="dps-asc">DPS 升序</option>
                <option value="gold-desc">金数降序</option>
            </select>
        </div>
        <div class="flex flex-col md:flex-row gap-3 justify-center">
            <button class="btn-primary px-5 py-2 rounded-lg">查看统计</button>
            <button onclick="openSubmitModal()" class="btn-submit px-5 py-2 rounded-lg">投稿新数据</button>
        </div>
    </div>

    <!-- 数据表格 -->
    <div class="max-w-6xl mx-auto overflow-x-auto">
        <table class="w-full rounded-lg overflow-hidden">
            <thead>
                <tr class="text-left text-sm md:text-base">
                    <th class="p-3 md:p-4">序号</th>
                    <th class="p-3 md:p-4">昵称</th>
                    <th class="p-3 md:p-4">角色队伍</th>
                    <th class="p-3 md:p-4">金数</th>
                    <th class="p-3 md:p-4">DPS</th>
                    <th class="p-3 md:p-4">视频链接</th>
                </tr>
            </thead>
            <tbody id="dataTableBody" class="divide-y divide-gray-800"></tbody>
        </table>
    </div>

    <!-- 投稿弹窗 -->
    <div id="submitModal" class="modal fixed inset-0 z-50 flex items-center justify-center p-3">
        <div class="bg-[#121212] border border-gray-700 rounded-xl p-5 w-full max-w-md">
            <h2 class="text-xl font-bold text-amber-400 mb-5 text-center">提交投稿数据</h2>
            <form id="submitForm" class="space-y-4">
                <div>
                    <label class="block mb-1 text-sm">昵称 <span class="text-red-400">*</span></label>
                    <input type="text" name="nickname" required class="input-dark w-full px-3 py-2 rounded-lg">
                </div>
                <div>
                    <label class="block mb-1 text-sm">角色/队伍 <span class="text-red-400">*</span></label>
                    <input type="text" name="team" required class="input-dark w-full px-3 py-2 rounded-lg">
                </div>
                <div>
                    <label class="block mb-1 text-sm">金数 <span class="text-red-400">*</span></label>
                    <input type="number" name="gold" required class="input-dark w-full px-3 py-2 rounded-lg">
                </div>
                <div>
                    <label class="block mb-1 text-sm">DPS <span class="text-red-400">*</span></label>
                    <input type="number" step="any" name="dps" required class="input-dark w-full px-3 py-2 rounded-lg">
                </div>
                <div>
                    <label class="block mb-1 text-sm">视频链接</label>
                    <input type="url" name="videoUrl" class="input-dark w-full px-3 py-2 rounded-lg">
                </div>
                <div class="flex gap-4 justify-center pt-2">
                    <button type="button" onclick="closeSubmitModal()" class="px-5 py-2 rounded-lg bg-gray-700 hover:bg-gray-600">取消</button>
                    <button type="submit" class="btn-submit px-5 py-2 rounded-lg">提交</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // 同仓库部署，直接使用相对路径
        const API_BASE_URL = "/api";

        // 加载已审核数据
        async function loadData() {
            const tbody = document.getElementById("dataTableBody");
            try {
                const res = await fetch(`${API_BASE_URL}/data`);
                const data = await res.json();
                renderTable(data);
            } catch (err) {
                tbody.innerHTML = `<tr><td colspan="6" class="p-4 text-center text-red-400">数据加载失败</td></tr>`;
            }
        }

        // 渲染表格 + 筛选排序
        function renderTable(data) {
            const tbody = document.getElementById("dataTableBody");
            const keyWord = document.getElementById("searchInput").value.toLowerCase();
            const sortType = document.getElementById("sortSelect").value;

            let list = data.filter(item => 
                item.nickname.toLowerCase().includes(keyWord) ||
                item.team.toLowerCase().includes(keyWord)
            );

            switch(sortType) {
                case "dps-desc":
                    list.sort((a,b) => b.dps - a.dps);
                    break;
                case "dps-asc":
                    list.sort((a,b) => a.dps - b.dps);
                    break;
                case "gold-desc":
                    list.sort((a,b) => b.gold - a.gold);
                    break;
            }

            if(list.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="p-4 text-center text-gray-400">暂无数据</td></tr>`;
                return;
            }

            tbody.innerHTML = list.map((item, idx) => `
                <tr class="hover:bg-gray-900">
                    <td class="p-3 md:p-4">${idx + 1}</td>
                    <td class="p-3 md:p-4">${item.nickname}</td>
                    <td class="p-3 md:p-4">${item.team}</td>
                    <td class="p-3 md:p-4">${item.gold}</td>
                    <td class="p-3 md:p-4">${item.dps}</td>
                    <td class="p-3 md:p-4">
                        ${item.videoUrl ? `<a href="${item.videoUrl}" target="_blank" class="text-blue-400 hover:underline">查看链接</a>` : "-"}
                    </td>
                </tr>
            `).join("");
        }

        // 弹窗控制
        function openSubmitModal() {
            document.getElementById("submitModal").style.display = "flex";
        }
        function closeSubmitModal() {
            document.getElementById("submitModal").style.display = "none";
            document.getElementById("submitForm").reset();
        }

        // 提交投稿
        document.getElementById("submitForm").addEventListener("submit", async e => {
            e.preventDefault();
            const form = new FormData(e.target);
            const postData = {
                nickname: form.get("nickname"),
                team: form.get("team"),
                gold: Number(form.get("gold")),
                dps: Number(form.get("dps")),
                videoUrl: form.get("videoUrl") || ""
            };

            try {
                const res = await fetch(`${API_BASE_URL}/submit`, {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify(postData)
                });
                if(res.ok) {
                    alert("投稿成功！等待管理员审核");
                    closeSubmitModal();
                } else {
                    alert("投稿失败，请重试");
                }
            } catch {
                alert("网络异常，请稍后再试");
            }
        });

        // 监听搜索、排序
        document.getElementById("searchInput").addEventListener("input", loadData);
        document.getElementById("sortSelect").addEventListener("change", loadData);

        // 初始化
        loadData();
    </script>
</body>
</html>
