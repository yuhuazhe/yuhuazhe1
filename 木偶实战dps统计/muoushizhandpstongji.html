<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>队伍DPS数据榜单</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", sans-serif;
        }

        body {
            background-color: #000;
            color: #e5e5e5;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        /* 顶部卡片 */
        .top-card {
            background-color: #1a1a1a;
            border-radius: 12px;
            padding: 30px 20px;
            text-align: center;
            border: 1px solid #2d2d2d;
            margin-bottom: 20px;
        }

        .top-card h1 {
            color: #ffc13b;
            font-size: 2.5rem;
            margin-bottom: 25px;
        }

        .search-bar {
            display: flex;
            gap: 15px;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .search-bar input {
            background-color: #121a2b;
            border: 1px solid #253048;
            color: #fff;
            padding: 12px 16px;
            border-radius: 8px;
            width: 300px;
            font-size: 1rem;
        }

        .search-bar select {
            background-color: #121a2b;
            border: 1px solid #253048;
            color: #fff;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 1rem;
        }

        .btn-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 10px 24px;
            border-radius: 8px;
            border: none;
            font-size: 1rem;
            cursor: pointer;
        }

        .btn-blue {
            background-color: transparent;
            color: #4299e1;
            border: 1px solid #4299e1;
        }

        /* 表格区域 */
        .table-container {
            background-color: #1a1a1a;
            border-radius: 12px;
            border: 1px solid #2d2d2d;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 600px;
        }

        thead tr {
            background-color: #1e293b;
        }

        th, td {
            padding: 15px;
            text-align: center;
            border-bottom: 1px solid #2d2d2d;
        }

        th {
            color: #fff;
            font-weight: bold;
        }

        td {
            color: #ccc;
        }

        tr:hover {
            background-color: #222;
        }

        /* 响应式适配 */
        @media (max-width: 768px) {
            .top-card h1 {
                font-size: 1.8rem;
            }

            .search-bar input {
                width: 100%;
            }

            .btn-group {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }

            table, thead, tbody, th, td, tr {
                display: block;
            }

            thead tr {
                position: absolute;
                top: -9999px;
                left: -9999px;
            }

            tr {
                border: 1px solid #2d2d2d;
                margin-bottom: 10px;
                border-radius: 8px;
            }

            td {
                border: none;
                position: relative;
                padding-left: 50%;
                text-align: right;
            }

            td:before {
                position: absolute;
                top: 15px;
                left: 15px;
                width: 45%;
                padding-right: 10px;
                white-space: nowrap;
                text-align: left;
                color: #fff;
                font-weight: bold;
            }

            td:nth-of-type(1):before { content: "序号"; }
            td:nth-of-type(2):before { content: "昵称"; }
            td:nth-of-type(3):before { content: "角色队伍"; }
            td:nth-of-type(4):before { content: "金数"; }
            td:nth-of-type(5):before { content: "DPS"; }
            td:nth-of-type(6):before { content: "视频链接"; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 顶部卡片 -->
        <div class="top-card">
            <h1>队伍DPS数据榜单</h1>
            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="搜索昵称/角色队伍">
                <select id="sortSelect">
                    <option value="default">默认排序</option>
                    <option value="dps-desc">DPS 从高到低</option>
                    <option value="dps-asc">DPS 从低到高</option>
                    <option value="gold-desc">金数从高到低</option>
                    <option value="gold-asc">金数从低到高</option>
                </select>
            </div>
            <div class="btn-group">
                <button class="btn btn-blue" id="statBtn">查看统计</button>
            </div>
        </div>

        <!-- 表格 -->
        <div class="table-container">
            <table id="dpsTable">
                <thead>
                    <tr>
                        <th>序号</th>
                        <th>昵称</th>
                        <th>角色队伍</th>
                        <th>金数</th>
                        <th>DPS</th>
                        <th>视频链接</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- 示例数据 -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // 示例数据
        const data = [
            {
                id: 1,
                name: "清风流云",
                team: "月感电队",
                gold: "7金",
                dps: "290000",
                video: "暂无"

            },
            {
                id: 2,
                name: "暂无",
                team: "暂无",
                gold: "暂无",
                dps: "暂无",
                video: "暂无"
            },
            {
                id: 3,
                name: "暂无",
                team: "暂无",
                gold: "暂无",
                dps: "暂无",
                video: "暂无"
            }
        ];

        // 渲染表格
        function renderTable(dataList) {
            const tbody = document.querySelector("#dpsTable tbody");
            tbody.innerHTML = "";
            dataList.forEach(item => {
                const tr = document.createElement("tr");
                tr.innerHTML = `
                    <td>${item.id}</td>
                    <td>${item.name}</td>
                    <td>${item.team}</td>
                    <td>${item.gold}</td>
                    <td>${item.dps}</td>
                    <td><a href="${item.video}" target="_blank" style="color:#4299e1;">查看</a></td>
                `;
                tbody.appendChild(tr);
            });
        }

        // 初始渲染
        renderTable(data);

        // 搜索功能
        document.getElementById("searchInput").addEventListener("input", function(e) {
            const keyword = e.target.value.toLowerCase();
            const filtered = data.filter(item => 
                item.name.toLowerCase().includes(keyword) || 
                item.team.toLowerCase().includes(keyword)
            );
            renderTable(filtered);
        });

        // 排序功能
        document.getElementById("sortSelect").addEventListener("change", function(e) {
            const value = e.target.value;
            let sorted = [...data];
            if (value === "dps-desc") {
                sorted.sort((a, b) => parseInt(b.dps) - parseInt(a.dps));
            } else if (value === "dps-asc") {
                sorted.sort((a, b) => parseInt(a.dps) - parseInt(b.dps));
            } else if (value === "gold-desc") {
                sorted.sort((a, b) => parseInt(b.gold) - parseInt(a.gold));
            } else if (value === "gold-asc") {
                sorted.sort((a, b) => parseInt(a.gold) - parseInt(b.gold));
            }
            renderTable(sorted);
        });

        // 查看统计按钮（示例弹窗）
        document.getElementById("statBtn").addEventListener("click", function() {
            const avgDps = (data.reduce((sum, item) => sum + parseInt(item.dps), 0) / data.length).toFixed(0);
            alert(`当前数据统计：\n总条数：${data.length}\n平均DPS：${avgDps}`);
        });
    </script>
</body>
</html>
