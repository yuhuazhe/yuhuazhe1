<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>桑多涅 · 伤害计算器v2版</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
        }
        body {
            background: #0d1117;
            margin: 20px;
            display: flex;
            justify-content: center;
            color: #c9d1d9;
        }
        .container {
            max-width: 1020px;
            width: 100%;
            background: #161b22;
            border-radius: 16px;
            padding: 24px 28px;
            border: 1px solid #30363d;
        }
        h1 {
            font-size: 24px;
            font-weight: 400;
            margin: 0 0 2px 0;
            color: #f0f6fc;
            border-bottom: 1px solid #30363d;
            padding-bottom: 12px;
        }
        .sub {
            color: #8b949e;
            font-size: 13px;
            margin-bottom: 20px;
        }
        .section-title {
            font-size: 16px;
            font-weight: 500;
            color: #f0f6fc;
            margin: 20px 0 10px 0;
            border-bottom: 1px solid #30363d;
            padding-bottom: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .section-title .toggle-btn {
            background: #21262d;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 2px 14px;
            color: #c9d1d9;
            font-size: 13px;
            cursor: pointer;
            transition: 0.15s;
        }
        .section-title .toggle-btn:hover {
            background: #30363d;
        }
        .param-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px 24px;
            background: #0d1117;
            border-radius: 10px;
            padding: 16px 18px;
            border: 1px solid #30363d;
            margin-bottom: 18px;
        }
        @media (max-width: 700px) {
            .param-grid {
                grid-template-columns: 1fr;
            }
        }
        .row {
            display: flex;
            align-items: center;
            gap: 6px 10px;
            flex-wrap: wrap;
        }
        .row label {
            width: 110px;
            color: #b1bac4;
            font-size: 13px;
            flex-shrink: 0;
        }
        .row input,
        .row select {
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 5px 10px;
            color: #f0f6fc;
            font-size: 13px;
            flex: 1 1 80px;
            min-width: 60px;
            outline: none;
        }
        .row input:focus,
        .row select:focus {
            border-color: #58a6ff;
            box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.15);
        }
        .row input:read-only {
            background: #161b22;
            color: #8b949e;
            cursor: default;
            border-color: #30363d;
        }
        .row .hint {
            color: #8b949e;
            font-size: 12px;
            font-style: italic;
        }
        .row .badge-auto {
            display: inline-block;
            background: #1c2333;
            border: 1px solid #58a6ff;
            border-radius: 4px;
            padding: 0 8px;
            font-size: 11px;
            color: #58a6ff;
            margin-left: 2px;
            font-style: normal;
            white-space: nowrap;
        }
        .row .btn-reset-seq {
            background: #21262d;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 4px 14px;
            color: #c9d1d9;
            font-size: 12px;
            cursor: pointer;
            transition: 0.15s;
            flex: 0 0 auto;
        }
        .row .btn-reset-seq:hover {
            background: #30363d;
        }
        .seq-preview {
            grid-column: 1 / -1;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 8px 14px;
            font-size: 13px;
            color: #8b949e;
            max-height: 80px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            white-space: pre-wrap;
            word-break: break-all;
            line-height: 1.6;
            margin-top: 2px;
        }
        .seq-preview .seq-skill {
            display: inline-block;
            background: #1c2333;
            border-radius: 4px;
            padding: 0 8px;
            margin: 1px 2px;
            font-size: 12px;
            border: 1px solid #30363d;
            color: #58a6ff;
        }
        .seq-preview .seq-skill.start {
            color: #8b949e;
            border-color: #30363d;
        }
        .seq-preview .seq-skill.z {
            color: #f0883e;
            border-color: #f0883e44;
        }
        .seq-preview .seq-skill.e {
            color: #7ee787;
            border-color: #7ee78744;
        }
        .seq-preview .seq-skill.q {
            color: #d2a8ff;
            border-color: #d2a8ff44;
        }
        .seq-preview .seq-skill.error {
            color: #f85149;
            border-color: #f8514944;
            background: #2a0000;
        }
        .seq-preview .seq-index {
            color: #8b949e;
            font-size: 11px;
            margin-right: 2px;
        }
        .buff-manager {
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 10px;
            padding: 12px 16px;
            margin-bottom: 18px;
            display: none;
        }
        .buff-manager.visible {
            display: block;
        }
        .buff-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
            margin-top: 8px;
        }
        .buff-table th {
            text-align: left;
            color: #8b949e;
            font-weight: 400;
            padding: 6px 4px;
            border-bottom: 1px solid #30363d;
        }
        .buff-table td {
            padding: 4px 4px;
            vertical-align: middle;
            border-bottom: 1px solid #21262d;
        }
        .buff-table .buff-name {
            min-width: 70px;
        }
        .buff-table .buff-input {
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 4px;
            padding: 3px 6px;
            color: #f0f6fc;
            font-size: 12px;
            width: 100%;
            min-width: 40px;
        }
        .buff-table .buff-input:focus {
            border-color: #58a6ff;
        }
        .buff-table .btn-remove {
            background: none;
            border: none;
            color: #f85149;
            cursor: pointer;
            font-size: 16px;
            padding: 0 4px;
        }
        .buff-table .btn-remove:hover {
            color: #ff7b72;
        }
        .buff-add-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px 10px;
            align-items: center;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #30363d;
        }
        .buff-add-row input,
        .buff-add-row select {
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 4px;
            padding: 4px 8px;
            color: #f0f6fc;
            font-size: 12px;
            flex: 1 1 80px;
            min-width: 50px;
        }
        .buff-add-row .add-btn {
            background: #238636;
            border: 1px solid #2ea043;
            border-radius: 6px;
            padding: 4px 16px;
            color: white;
            font-size: 13px;
            cursor: pointer;
            transition: 0.15s;
            flex: 0 0 auto;
        }
        .buff-add-row .add-btn:hover {
            background: #2ea043;
        }
        .buff-add-row label {
            color: #b1bac4;
            font-size: 12px;
            margin-right: 2px;
        }
        .result-area {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 0;
            padding: 0;
            background: none;
            border: none;
            flex-wrap: wrap;
            gap: 10px 20px;
        }
        .result-left {
            display: flex;
            align-items: baseline;
            gap: 20px;
            flex-wrap: wrap;
        }
        .total-dmg {
            font-size: 36px;
            font-weight: 600;
            color: #f0f6fc;
        }
        .dps-display {
            font-size: 20px;
            color: #58a6ff;
            font-weight: 500;
            background: #0d1117;
            padding: 4px 14px;
            border-radius: 8px;
            border: 1px solid #30363d;
        }
        .btn-group {
            display: flex;
            gap: 12px;
        }
        .btn {
            background: #21262d;
            border: 1px solid #30363d;
            padding: 8px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            color: #c9d1d9;
            cursor: pointer;
            transition: 0.15s;
        }
        .btn-primary {
            background: #238636;
            border-color: #2ea043;
            color: white;
        }
        .btn-primary:hover {
            background: #2ea043;
        }
        .btn-secondary {
            background: #21262d;
            border-color: #30363d;
        }
        .btn-secondary:hover {
            background: #30363d;
        }
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.75);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(3px);
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal-box {
            background: #161b22;
            max-width: 960px;
            width: 95%;
            max-height: 85vh;
            border-radius: 16px;
            padding: 24px 28px;
            border: 1px solid #30363d;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7);
            overflow-y: auto;
            position: relative;
        }
        .modal-box h2 {
            margin-top: 0;
            font-weight: 400;
            color: #f0f6fc;
            border-bottom: 1px solid #30363d;
            padding-bottom: 10px;
        }
        .modal-box .close-btn {
            position: sticky;
            top: 0;
            float: right;
            background: none;
            border: none;
            font-size: 28px;
            cursor: pointer;
            color: #8b949e;
            padding: 0 8px;
        }
        .modal-box .close-btn:hover {
            color: #f0f6fc;
        }
        .modal-content {
            font-family: 'Courier New', monospace;
            font-size: 13px;
            white-space: pre-wrap;
            line-height: 1.7;
            background: #0d1117;
            padding: 18px;
            border-radius: 8px;
            border: 1px solid #30363d;
            max-height: 70vh;
            overflow-y: auto;
            color: #c9d1d9;
        }
        .time-window {
            grid-column: 1 / -1;
            display: flex;
            gap: 20px;
            align-items: center;
            flex-wrap: wrap;
            padding-top: 4px;
            border-top: 1px solid #21262d;
        }
        .time-window .row {
            flex: 1;
            min-width: 180px;
        }
        .highlight {
            color: #58a6ff;
            font-weight: 600;
        }
        .skill-tag {
            display: inline-block;
            background: #1c2333;
            border-radius: 4px;
            padding: 0 8px;
            font-size: 12px;
            color: #58a6ff;
            border: 1px solid #30363d;
            font-weight: 500;
        }
        .skill-tag.z {
            color: #f0883e;
            border-color: #f0883e44;
        }
        .skill-tag.e {
            color: #7ee787;
            border-color: #7ee78744;
        }
        .skill-tag.q {
            color: #d2a8ff;
            border-color: #d2a8ff44;
        }
        .skill-tag.start {
            color: #8b949e;
            border-color: #30363d;
        }
        .skill-tag.c4 {
            color: #f0883e;
            border-color: #ffaa00;
            background: #2a1f00;
        }
        .skill-tag.c6 {
            color: #ff6b6b;
            border-color: #ff6b6b;
            background: #2a0000;
        }
        .seq-input-wrapper {
            display: flex;
            align-items: center;
            gap: 6px;
            flex: 1 1 100%;
        }
        .seq-input-wrapper input {
            flex: 1 1 auto;
            min-width: 120px;
        }
        .duration-row {
            grid-column: 1 / -1;
            display: flex;
            flex-wrap: wrap;
            gap: 10px 20px;
            padding: 6px 0 4px 0;
            border-top: 1px solid #21262d;
            margin-top: 4px;
        }
        .duration-row .dur-item {
            display: flex;
            align-items: center;
            gap: 4px 10px;
            flex: 0 1 auto;
        }
        .duration-row .dur-item label {
            width: auto;
            font-size: 13px;
            color: #b1bac4;
            white-space: nowrap;
        }
        .duration-row .dur-item input {
            width: 70px;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 4px 6px;
            color: #f0f6fc;
            font-size: 13px;
            text-align: center;
        }
        .duration-row .dur-item input:focus {
            border-color: #58a6ff;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>桑多涅 · 伤害计算器v2版</h1>
        <div class="sub">怪物基础抗性 10% （目前处于测试阶段，暂不确定是否存在bug）</div>
        <div class="sub">该程序存在一定的上手难度</div>
        <div class="sub">本程序代码全部开源，创作者羽化哲</div>

        <div class="param-grid">
            <!-- 命座 -->
            <div class="row">
                <label>命座</label>
                <select id="constellation">
                    <option value="c0">C0</option>
                    <option value="c1">C1</option>
                    <option value="c2">C2</option>
                    <option value="c3">C3</option>
                    <option value="c4">C4</option>
                    <option value="c5">C5</option>
                    <option value="c6">C6</option>
                </select>
            </div>
            <!-- 基础攻击力 -->
            <div class="row">
                <label>基础攻击力</label>
                <input type="number" id="baseAtk" value="335" step="1" style="flex:0.6;">
                <span class="hint">+</span>
                <input type="number" id="weaponAtk" value="608" step="1" style="flex:0.6;">
                <span class="hint">武器</span>
            </div>
            <!-- 暴击率/暴伤 -->
            <div class="row">
                <label>暴击率 / 暴伤</label>
                <input type="number" id="critRate" value="0.65" step="0.01" style="flex:0.7;">
                <input type="number" id="critDmg" value="1.80" step="0.01" style="flex:0.7;">
            </div>
            <!-- 双冰暴击率 -->
            <div class="row">
                <label>双冰暴击率</label>
                <input type="number" id="doubleCryoCritRate" value="0.15" step="0.01" min="0" max="1" style="flex:0.7;">
                
            </div>
            <!-- 面板攻击 -->
            <div class="row">
                <label>面板攻击力（绿字）</label>
                <input type="number" id="flatAtk" value="311" step="10">
            </div>
            <!-- 攻击% -->
            <div class="row">
                <label>攻击力%加成</label>
                <input type="number" id="atkPercent" value="0.80" step="0.01">
                
            </div>
            <!-- 精通 -->
            <div class="row">
                <label>元素精通</label>
                <input type="number" id="em" value="120" step="1">
            </div>
            <!-- 星超导系数 -->
            <div class="row">
                <label>星超导系数</label>
                <input type="number" id="sdCoeff" value="1.0" step="0.01" min="0">
            </div>
            <!-- 基础提升% -->
            <div class="row">
                <label>基础提升%</label>
                <input type="number" id="baseBuff" value="1.28" step="0.01">
            </div>
            <!-- 星超导爆伤加成 -->
            <div class="row">
                <label>星超导爆伤加成</label>
                <input type="number" id="sdCritDmg" value="0.40" step="0.01">
            </div>
            <!-- 星超导增伤加成 -->
            <div class="row">
                <label>星超导增伤加成</label>
                <input type="number" id="sdDmgBonus" value="0.15" step="0.01">
            </div>
            <!-- 传统增伤 -->
            <div class="row">
                <label>传统增伤 <span class="badge-auto">自动识别</span></label>
                <input type="text" id="eleDmgDisplay" value="20%" readonly style="flex:0.7; background:#161b22; color:#58a6ff; font-weight:500; border-color:#58a6ff;">
            </div>

            <!-- ===== 自定义耗时输入 ===== -->
            <div class="duration-row">
                <div class="dur-item">
                    <label>起手耗时</label>
                    <input type="number" id="startDuration" value="0.5" step="0.1" min="0">
                </div>
                <div class="dur-item">
                    <label>z 耗时</label>
                    <input type="number" id="zDuration" value="1.0" step="0.1" min="0">
                </div>
                <div class="dur-item">
                    <label>e 耗时</label>
                    <input type="number" id="eDuration" value="1.0" step="0.1" min="0">
                </div>
                <div class="dur-item">
                    <label>q 耗时</label>
                    <input type="number" id="qDuration" value="1.5" step="0.1" min="0">
                </div>
            </div>

            <!-- 技能序列 -->
            <div class="row" style="grid-column:1/-1; border-top:1px solid #21262d; padding-top:8px; margin-top:4px;">
                <label style="width:110px;">技能序列</label>
                <div class="seq-input-wrapper">
                    <input type="text" id="skillSequence" value="" placeholder="例如: z,z,z,e,q,z,z,z,e" style="flex:1;">
                    <button class="btn-reset-seq" id="resetSeqBtn">↺ 重置</button>
                </div>
                <span class="hint" style="flex:0 0 auto;">用逗号/空格分隔: z, e, q, start</span>
            </div>
            <!-- 序列预览 -->
            <div class="seq-preview" id="seqPreview">等待解析…</div>

            <!-- 时间窗口 -->
            <div class="time-window">
                <div class="row">
                    <label>起始时间</label>
                    <input type="number" id="startTime" value="0" step="0.1" style="flex:0.7;">
                </div>
                <div class="row">
                    <label>终止时间</label>
                    <input type="number" id="endTime" value="16.5" step="0.1" style="flex:0.7;">
                </div>
            </div>
        </div>

        <!-- Buff 管理 -->
        <div class="section-title">
            <span>⚡ Buff 管理</span>
            <button class="toggle-btn" id="toggleBuffBtn">展开</button>
        </div>
        <div class="buff-manager" id="buffManager">
            <table class="buff-table" id="buffTable">
                <thead>
                    <tr><th style="width:16%;">名称</th><th style="width:10%;">起始</th><th style="width:10%;">结束</th><th style="width:22%;">增益类型</th><th style="width:12%;">数值</th><th style="width:10%;">操作</th></tr>
                </thead>
                <tbody id="buffBody"></tbody>
            </table>
            <div class="buff-add-row">
                <input type="text" id="newBuffName" placeholder="名称" style="flex:1.5;">
                <input type="number" id="newBuffStart" placeholder="起始" step="0.1" style="flex:1;">
                <input type="number" id="newBuffEnd" placeholder="结束" step="0.1" style="flex:1;">
                <select id="newBuffType" style="flex:1.8;">
                    <option value="atkPercent">攻击力%加成</option>
                    <option value="sdDmg">星超导增伤</option>
                    <option value="sdCritDmg">星超导爆伤</option>
                    <option value="resistance">减抗</option>
                    <option value="critRate">暴击率</option>
                    <option value="critDmg">暴击伤害</option>
                    <option value="ascend">擢升</option>
                    <option value="flatDmg">额外数值</option>
                    <option value="flatAtk">数值攻击力</option>
                    <option value="em">精通</option>
                </select>
                <input type="number" id="newBuffValue" placeholder="数值" step="0.01" style="flex:1;">
                <button class="add-btn" id="addBuffBtn">添加</button>
            </div>
        </div>

        <!-- 结果 -->
        <div class="result-area">
            <div class="result-left">
                <div class="total-dmg" id="totalDisplay">0</div>
                <div class="dps-display" id="dpsDisplay">DPS: 0</div>
            </div>
            <div class="btn-group">
                <button class="btn btn-primary" id="calcBtn">计算总伤害</button>
                <button class="btn btn-secondary" id="showFlowBtn">📋 展示流程</button>
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal-overlay" id="flowModal">
        <div class="modal-box">
            <button class="close-btn" id="modalCloseBtn">&times;</button>
            <h2>详细计算流程 · 桑多涅</h2>
            <div class="modal-content" id="modalContent">加载中...</div>
        </div>
    </div>

    <script>
        // ========== 防查看源码 ==========
        (function() {
            document.addEventListener('contextmenu', function(e) { e.preventDefault(); return false; });
            document.addEventListener('keydown', function(e) {
                if (e.key === 'F12') { e.preventDefault(); return false; }
                if (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'i')) { e.preventDefault(); return false; }
                if (e.ctrlKey && (e.key === 'U' || e.key === 'u')) { e.preventDefault(); return false; }
                if (e.ctrlKey && e.shiftKey && (e.key === 'J' || e.key === 'j')) { e.preventDefault(); return false; }
                if (e.ctrlKey && e.shiftKey && (e.key === 'C' || e.key === 'c')) { e.preventDefault(); return false; }
                return true;
            });
        })();

        // ========== 主程序 ==========
        (function() {
            const STORAGE_KEY = 'sandrone_calc_data_v5';

            // ---------- 根据命座获取默认技能序列 ----------
            function getDefaultSequence(constellation) {
                const isC1Plus = constellation !== 'c0';
                if (isC1Plus) {
                    return 'start,z,z,z,z,z,z,e,q,start,z,z,z,z,z,z,e';
                } else {
                    return 'start,z,z,z,e,q,start,z,z,z,e,start,z,z,z,e';
                }
            }

            // ---------- 获取自定义耗时 ----------
            function getDurations() {
                return {
                    start: parseFloat(document.getElementById('startDuration').value) || 0.5,
                    z: parseFloat(document.getElementById('zDuration').value) || 1.0,
                    e: parseFloat(document.getElementById('eDuration').value) || 1.0,
                    q: parseFloat(document.getElementById('qDuration').value) || 1.5,
                };
            }

            // ---------- 解析技能序列 ----------
            function parseSkillSequence(input) {
                if (!input || input.trim() === '') return [];
                const raw = input.replace(/[，、\s]+/g, ',').split(',').map(s => s.trim().toLowerCase()).filter(s => s !==
                '');
                const result = [];
                for (let token of raw) {
                    let type = null;
                    if (token === 'z' || token === 'Z') type = 'z';
                    else if (token === 'e' || token === 'E') type = 'e';
                    else if (token === 'q' || token === 'Q') type = 'q';
                    else if (token === 'start' || token === 'Start' || token === 's' || token === 'S') type = 'start';
                    else {
                        result.push({ type: 'error', raw: token });
                        continue;
                    }
                    result.push({ type: type, raw: token });
                }
                return result;
            }

            // ---------- 根据命座、序列和耗时生成事件 ----------
            function buildEventsFromSequence(parsed, constellation, durations) {
                const isZ_C3plus = constellation === 'c3' || constellation === 'c4' || constellation === 'c5' || constellation ===
                    'c6';
                const isQ_C5plus = constellation === 'c5' || constellation === 'c6';

                const z_m1 = isZ_C3plus ? 1.03 : 0.85;
                const z_m2 = isZ_C3plus ? 1.957 : 1.615;
                const q_m1 = isQ_C5plus ? 1.8746 * 3 : 1.5879;
                const q_m2 = isQ_C5plus ? 4.6863 * 2 : 7.9392;

                let eCount = 0;
                let zCount = 0;
                const events = [];
                let currentTime = 0;

                for (let item of parsed) {
                    if (item.type === 'error') {
                        events.push({
                            t: currentTime,
                            duration: 0,
                            m1: 0,
                            m2: 0,
                            name: '?',
                            tag: 'error',
                            originalIndex: -1,
                            isC4Extra: false,
                            isError: true,
                            raw: item.raw
                        });
                        continue;
                    }

                    let duration = 0;
                    let m1 = 0,
                        m2 = 0;
                    let name = item.type;
                    let tag = item.type;

                    switch (item.type) {
                        case 'start':
                            duration = durations.start || 0.5;
                            tag = 'start';
                            break;
                        case 'z':
                            duration = durations.z || 1.0;
                            m1 = z_m1;
                            m2 = z_m2;
                            tag = 'z';
                            zCount++;
                            break;
                        case 'e':
                            duration = durations.e || 1.0;
                            m1 = 0.5832;
                            if (eCount === 0) {
                                m2 = 1.5552;
                            } else {
                                m2 = 0.3888;
                            }
                            tag = 'e';
                            eCount++;
                            break;
                        case 'q':
                            duration = durations.q || 1.5;
                            m1 = q_m1;
                            m2 = q_m2;
                            tag = 'q';
                            break;
                        default:
                            continue;
                    }

                    events.push({
                        t: currentTime,
                        duration: duration,
                        m1: m1,
                        m2: m2,
                        name: name,
                        tag: tag,
                        originalIndex: -1,
                        isC4Extra: false,
                        isError: false,
                        raw: item.raw,
                        zIndex: (item.type === 'z') ? zCount : 0,
                        eSeq: (item.type === 'e') ? eCount : 0,
                    });
                    currentTime += duration;
                }

                events.forEach((evt, idx) => {
                    evt.originalIndex = idx;
                });

                return events;
            }

            // ---------- 生成完整技能事件（含偏移、C4、C6等） ----------
            function getSkillEventsWithOffset(constellation, offset, endTime) {
                const seqInput = document.getElementById('skillSequence');
                const rawSeq = seqInput ? seqInput.value : '';
                let parsed = parseSkillSequence(rawSeq);
                const hasValid = parsed.some(p => p.type !== 'error');
                if (!hasValid || parsed.length === 0) {
                    const def = getDefaultSequence(constellation);
                    parsed = parseSkillSequence(def);
                    if (seqInput) seqInput.value = def;
                }

                const durations = getDurations();
                const baseEvents = buildEventsFromSequence(parsed, constellation, durations);
                if (baseEvents.length === 0) {
                    const def = getDefaultSequence(constellation);
                    const p2 = parseSkillSequence(def);
                    const evts = buildEventsFromSequence(p2, constellation, durations);
                    if (seqInput) seqInput.value = def;
                    return evts;
                }

                let events = baseEvents.map(evt => {
                    const newEvt = { ...evt };
                    newEvt.t = evt.t + offset;
                    newEvt.hitTime = newEvt.t + evt.duration;
                    return newEvt;
                });

                // C4额外攻击
                const isC4Plus = constellation === 'c4' || constellation === 'c5' || constellation === 'c6';
                let c4ExtraEvents = [];
                if (isC4Plus && events.length > 0) {
                    const firstEnd = events[0].t + events[0].duration;
                    let lastEEnd = firstEnd;
                    for (let i = events.length - 1; i >= 0; i--) {
                        if (events[i].name === 'e' && !events[i].isC4Extra) {
                            lastEEnd = events[i].t + events[i].duration;
                            break;
                        }
                    }
                    let triggerTime = firstEnd;
                    while (triggerTime <= lastEEnd + 1e-9) {
                        c4ExtraEvents.push({
                            t: triggerTime,
                            duration: 0,
                            m1: 0,
                            m2: 1.25,
                            name: 'C4额外',
                            tag: 'c4',
                            originalIndex: -1,
                            isC4Extra: true,
                            isError: false,
                            raw: 'c4',
                            zIndex: 0,
                            eSeq: 0,
                            zPos: 0,
                            hitTime: triggerTime,
                        });
                        triggerTime += 4.0;
                    }
                }

                if (c4ExtraEvents.length > 0) {
                    events = events.concat(c4ExtraEvents);
                    events.sort((a, b) => a.hitTime - b.hitTime);
                }

                const filtered = events.filter(evt => evt.hitTime >= offset && evt.hitTime <= endTime);

                // 为z重建索引
                const filteredZIndices = [];
                filtered.forEach((evt, idx) => {
                    if (evt.name === 'z' && evt.m2 > 0 && !evt.isC4Extra) {
                        filteredZIndices.push(idx);
                    }
                });
                filtered.forEach((evt, idx) => {
                    if (evt.name === 'z' && evt.m2 > 0 && !evt.isC4Extra) {
                        const pos = filteredZIndices.indexOf(idx);
                        evt.zPos = pos + 1;
                    } else {
                        evt.zPos = 0;
                    }
                });

                return filtered;
            }

            // ---------- C2+ z 爆伤循环 ----------
            function getZCritDmgBonus(zIndex) {
                const cycle = [0.60, 0.80, 1.00, 1.00, 1.00, 1.00];
                const idx = (zIndex - 1) % cycle.length;
                return cycle[idx];
            }

            // DOM 引用

            function addBuff() {

                if (start >= end) { alert('起始必须小于结束'); return; }

                buffManager.style.display = isHidden ? 'block' : 'none';
                toggleBuffBtn.textContent = isHidden ? '收起' : '展开';
            }

            // ---------- 传统增伤映射 ----------
            const COEFF_TO_TRADITIONAL_DMG = {
                1.0: 0.20,
                1.45: 0.29,
                1.5: 0.30,
                1.55: 0.31,
                1.6: 0.32,
                1.65: 0.33,
                1.7: 0.34,
                1.75: 0.35,
                1.8: 0.36,
                1.85: 0.37,
                1.9: 0.38,
                1.95: 0.39,
                2.0: 0.40
            };
            const COEFF_KEYS = Object.keys(COEFF_TO_TRADITIONAL_DMG).map(Number).sort((a, b) => a - b);

            function getTraditionalDmgByCoefficient(coeff) {
                if (isNaN(coeff) || coeff === null) return 0.20;
                if (coeff in COEFF_TO_TRADITIONAL_DMG) return COEFF_TO_TRADITIONAL_DMG[coeff];
                let closest = COEFF_KEYS[0];
                let minDiff = Math.abs(coeff - closest);
                for (let k of COEFF_KEYS) {
                    const diff = Math.abs(coeff - k);
                    if (diff < minDiff) { minDiff = diff;
                        closest = k; }
                }
                return COEFF_TO_TRADITIONAL_DMG[closest];
            }

            // ---------- 抗性公式 ----------
            function calcResistMultiplier(finalResist) {
                if (finalResist < 0) return 1 - finalResist / 2;
                else if (finalResist <= 0.75) return 1 - finalResist;
                else return 1 / (4 * finalResist + 1);
            }

            // ---------- 单次伤害计算 ----------
            function calcSingleEvent(t, m1, m2, params) {
                const {
                    totalAtk, critRate, critDmgNormal, critDmgSd, em, coeff, baseBuff, eleDmg,
                    sdDmgBuff, resistMultiplier, ascendBuff, flatDmg, additiveM2, isC6
                } = params;
                const def = 0.5;
                const resist = resistMultiplier;
                const critFactorNormal = 1 + critRate * critDmgNormal;
                const critFactorSd = 1 + critRate * critDmgSd;
                const traditionalDmgBonus = 1 + eleDmg;
                const dmg1 = totalAtk * m1 * traditionalDmgBonus * critFactorNormal * def * resist;
                const modifiedM2 = m2 + (additiveM2 || 0);
                const emFactor = 1 + (6 * em) / (em + 2000) + sdDmgBuff;
                const sdReactionCoeff = coeff;
                const ascendMultiplier = 1 + ascendBuff + (isC6 ? 0.2 : 0);
                const dmg2 = totalAtk * modifiedM2 * baseBuff * emFactor * sdReactionCoeff * critFactorSd * resist *
                    ascendMultiplier;
                const total = dmg1 + dmg2 + flatDmg;
                return {
                    dmg1,
                    dmg2,
                    total,
                    resistMultiplier: resist,
                    ascendMultiplier: ascendMultiplier,
                    flatDmg: flatDmg,
                    additiveM2: additiveM2 || 0,
                    modifiedM2: modifiedM2,
                    critFactorNormal,
                    critFactorSd,
                    critDmgNormal,
                    critDmgSd
                };
            }

            // ---------- 完整计算 ----------
            function computeFull() {
                const baseAtk = parseFloat(baseAtkInput.value) || 0;
                const weaponAtk = parseFloat(weaponAtkInput.value) || 0;
                const totalBaseAtk = baseAtk + weaponAtk;
                let critRate = parseFloat(critRateInput.value) || 0;
                let critDmg = parseFloat(critDmgInput.value) || 0;
                const doubleCryoCritRate = parseFloat(doubleCryoCritRateInput.value) || 0;
                const flatAtk = parseFloat(flatAtkInput.value) || 0;
                const atkPercentBase = parseFloat(atkPercentInput.value) || 0;
                const em = parseFloat(emInput.value) || 0;
                const coeff = parseFloat(sdCoeffInput.value);
                const sdCoeff = isNaN(coeff) ? 1.0 : coeff;
                const baseBuff = parseFloat(baseBuffInput.value) || 1;
                const sdCritDmgBase = parseFloat(sdCritDmgInput.value) || 0;
                const sdDmgBonusBase = parseFloat(sdDmgBonusInput.value) || 0;
                const constellation = constellationSelect.value;
                const isC6 = constellation === 'c6';

                const offset = parseFloat(startTimeInput.value) || 0;
                const endTime = parseFloat(endTimeInput.value) || 22;

                // 获取解析后的序列（用于计算总耗时）
                const seqInput = document.getElementById('skillSequence');
                const rawSeq = seqInput ? seqInput.value : '';
                let parsed = parseSkillSequence(rawSeq);
                const hasValid = parsed.some(p => p.type !== 'error');
                if (!hasValid || parsed.length === 0) {
                    const def = getDefaultSequence(constellation);
                    parsed = parseSkillSequence(def);
                    if (seqInput) seqInput.value = def;
                }

                const durations = getDurations();
                // 计算完整技能总耗时（不考虑偏移和过滤）
                let totalDuration = 0;
                parsed.forEach(p => {
                    if (p.type === 'start') totalDuration += durations.start || 0.5;
                    else if (p.type === 'z') totalDuration += durations.z || 1.0;
                    else if (p.type === 'e') totalDuration += durations.e || 1.0;
                    else if (p.type === 'q') totalDuration += durations.q || 1.5;
                });

                const eleDmg = getTraditionalDmgByCoefficient(sdCoeff);
                const BASE_RESIST = 0.1;

                // 生成事件并过滤
                const skillEvents = getSkillEventsWithOffset(constellation, offset, endTime);

                const details = [];
                let totalDamage = 0;

                // 构建z索引映射（用于C2+爆伤循环）
                const zIndices = [];
                skillEvents.forEach((evt, idx) => {
                    if (evt.name === 'z' && evt.m2 > 0 && !evt.isC4Extra) {
                        zIndices.push(idx);
                    }
                });
                skillEvents.forEach((evt, idx) => {
                    if (evt.name === 'z' && evt.m2 > 0 && !evt.isC4Extra) {
                        const pos = zIndices.indexOf(idx);
                        evt.zPos = pos + 1;
                    } else {
                        evt.zPos = 0;
                    }
                });

                // 遍历每个事件
                skillEvents.forEach((evt) => {
                    const hitTime = evt.hitTime;
                    const startT = evt.t;
                    const duration = evt.duration;
                    const m1 = evt.m1;
                    const m2 = evt.m2;
                    const skillName = evt.name || '?';
                    const skillTag = evt.tag || '';
                    const isC4 = evt.isC4Extra || false;
                    const isError = evt.isError || false;

                    if (isError) {
                        return;
                    }

                    let atkPercentBuff = atkPercentBase;
                    let sdDmgBuff = sdDmgBonusBase;
                    let sdCritDmgBuff = sdCritDmgBase;
                    let totalResistReduction = 0;
                    let critRateBuff = 0;
                    let critDmgBuff = 0;
                    let ascendBuff = 0;
                    let flatDmgBuff = 0;
                    let flatAtkBuff = 0;
                    let emBuff = 0;
                    const activeBuffs = [];

                    for (let buff of userBuffs) {
                        if (hitTime >= buff.start && hitTime <= buff.end) {
                            activeBuffs.push(buff.name || `${buff.type}:${buff.value}`);
                            if (buff.type === 'atkPercent') atkPercentBuff += buff.value;
                            else if (buff.type === 'sdDmg') sdDmgBuff += buff.value;
                            else if (buff.type === 'sdCritDmg') sdCritDmgBuff += buff.value;
                            else if (buff.type === 'resistance') totalResistReduction += buff.value;
                            else if (buff.type === 'critRate') critRateBuff += buff.value;
                            else if (buff.type === 'critDmg') critDmgBuff += buff.value;
                            else if (buff.type === 'ascend') ascendBuff += buff.value;
                            else if (buff.type === 'flatDmg') flatDmgBuff += buff.value;
                            else if (buff.type === 'flatAtk') flatAtkBuff += buff.value;
                            else if (buff.type === 'em') emBuff += buff.value;
                        }
                    }

                    // C1+固定增伤（C4额外攻击不吃）
                    let c1Fixed = 0;
                    if (constellation !== 'c0' && !isC4) {
                        c1Fixed = 0.30;
                    }
                    sdDmgBuff += c1Fixed;

                    // C2+ z爆伤加成（C4额外攻击不吃）
                    let zCritBonus = 0;
                    if (constellation !== 'c0' && constellation !== 'c1' && !isC4) {
                        if (evt.name === 'z' && evt.m2 > 0 && !isC4) {
                            const zIdx = evt.zPos || 0;
                            if (zIdx > 0) {
                                zCritBonus = getZCritDmgBonus(zIdx);
                            }
                        }
                    }
                    let totalSdCritDmg;
                    if (isC4) {
                        totalSdCritDmg = critDmg + critDmgBuff;
                    } else {
                        totalSdCritDmg = critDmg + critDmgBuff + sdCritDmgBuff + zCritBonus;
                    }

                    // 最终暴击率 = 基础 + 暴击率BUFF + 双冰暴击率，限制上限1
                    const finalCritRate = Math.min(critRate + critRateBuff + doubleCryoCritRate, 1.0);
                    const finalCritDmgNormal = critDmg + critDmgBuff;
                    const finalCritDmgSd = totalSdCritDmg;
                    const finalResist = BASE_RESIST + totalResistReduction;
                    const resistMultiplier = calcResistMultiplier(finalResist);
                    // 总攻击力 = 面板攻击力（绿字+固定buff） + 总基础攻击力 × 攻击力%
                    const totalAtk = (flatAtk + flatAtkBuff) + totalBaseAtk * atkPercentBuff;
                    // 总精通
                    const totalEm = em + emBuff;

                    const params = {
                        totalAtk,
                        critRate: finalCritRate,
                        critDmgNormal: finalCritDmgNormal,
                        critDmgSd: finalCritDmgSd,
                        em: totalEm,
                        coeff: sdCoeff,
                        baseBuff,
                        eleDmg,
                        sdDmgBuff,
                        resistMultiplier,
                        ascendBuff,
                        flatDmg: flatDmgBuff,
                        additiveM2: 0,
                        isC6: isC6
                    };
                    const result = calcSingleEvent(hitTime, m1, m2, params);
                    totalDamage += result.total;

                    const detail = {
                        hitTime,
                        startTime: startT,
                        duration,
                        skillName,
                        skillTag,
                        m1,
                        m2,
                        modifiedM2: result.modifiedM2,
                        totalAtk,
                        dmg1: result.dmg1,
                        dmg2: result.dmg2,
                        total: result.total,
                        activeBuffs,
                        atkPercentBuff,
                        sdDmgBuff,
                        sdCritDmgBuff: isC4 ? 0 : (totalSdCritDmg - critDmg - critDmgBuff),
                        critRateBuff,
                        doubleCryoCritRate,
                        critDmgBuff,
                        ascendBuff,
                        flatDmgBuff,
                        flatAtkBuff,
                        emBuff,
                        totalEm,
                        totalBaseAtk,
                        flatAtkBase: flatAtk,
                        finalCritRate,
                        finalCritDmgNormal,
                        finalCritDmgSd,
                        totalResistReduction,
                        finalResist,
                        resistMultiplier: result.resistMultiplier,
                        critFactorNormal: result.critFactorNormal,
                        critFactorSd: result.critFactorSd,
                        traditionalDmgBonus: 1 + eleDmg,
                        eleDmg,
                        coeff: sdCoeff,
                        emFactor: 1 + (6 * totalEm) / (totalEm + 2000) + sdDmgBuff,
                        sdReactionCoeff: sdCoeff,
                        finalBaseBuff: baseBuff,
                        def: 0.5,
                        ascendMultiplier: result.ascendMultiplier,
                        flatDmgApplied: result.flatDmg,
                        additiveM2: result.additiveM2,
                        isSdEvent: m2 > 0,
                        hasDamage: (m1 > 0 || m2 > 0),
                        constellation: constellation,
                        constellationSdBuff: c1Fixed,
                        zCritBonus: isC4 ? 0 : zCritBonus,
                        isC4Extra: isC4,
                        isC6Extra: false,
                        c6ExtraForZ: 0,
                        extraType: 'main',
                        zPos: evt.zPos || 0,
                        isError: false
                    };
                    details.push(detail);

                    // ---- C6 额外伤害逻辑 ----
                    if (isC6 && evt.name === 'z' && evt.m2 > 0 && !isC4) {
                        const zIdx = evt.zPos || 0;
                        const c6ZSet = [3, 4, 5, 6, 9, 10, 11, 12];
                        if (c6ZSet.includes(zIdx)) {
                            const c6Params = { ...params };
                            const c6Result = calcSingleEvent(hitTime, 0, 0.8, c6Params);
                            totalDamage += c6Result.total;
                            const c6Detail = {
                                hitTime,
                                startTime: startT,
                                duration: 0,
                                skillName: 'C6额外',
                                skillTag: 'c6',
                                m1: 0,
                                m2: 0.8,
                                modifiedM2: 0.8,
                                totalAtk: c6Params.totalAtk,
                                dmg1: c6Result.dmg1,
                                dmg2: c6Result.dmg2,
                                total: c6Result.total,
                                activeBuffs: detail.activeBuffs,
                                atkPercentBuff: detail.atkPercentBuff,
                                sdDmgBuff: detail.sdDmgBuff,
                                sdCritDmgBuff: detail.sdCritDmgBuff,
                                critRateBuff: detail.critRateBuff,
                                doubleCryoCritRate: detail.doubleCryoCritRate,
                                critDmgBuff: detail.critDmgBuff,
                                ascendBuff: detail.ascendBuff,
                                flatDmgBuff: detail.flatDmgBuff,
                                flatAtkBuff: detail.flatAtkBuff,
                                emBuff: detail.emBuff,
                                totalEm: detail.totalEm,
                                totalBaseAtk: detail.totalBaseAtk,
                                flatAtkBase: detail.flatAtkBase,
                                finalCritRate: detail.finalCritRate,
                                finalCritDmgNormal: detail.finalCritDmgNormal,
                                finalCritDmgSd: detail.finalCritDmgSd,
                                totalResistReduction: detail.totalResistReduction,
                                finalResist: detail.finalResist,
                                resistMultiplier: c6Result.resistMultiplier,
                                critFactorNormal: c6Result.critFactorNormal,
                                critFactorSd: c6Result.critFactorSd,
                                traditionalDmgBonus: detail.traditionalDmgBonus,
                                eleDmg: detail.eleDmg,
                                coeff: detail.coeff,
                                emFactor: detail.emFactor,
                                sdReactionCoeff: detail.sdReactionCoeff,
                                finalBaseBuff: detail.finalBaseBuff,
                                def: detail.def,
                                ascendMultiplier: c6Result.ascendMultiplier,
                                flatDmgApplied: c6Result.flatDmg,
                                additiveM2: 0,
                                isSdEvent: true,
                                hasDamage: true,
                                constellation: constellation,
                                constellationSdBuff: detail.constellationSdBuff,
                                zCritBonus: detail.zCritBonus,
                                isC4Extra: false,
                                isC6Extra: true,
                                c6ExtraForZ: zIdx,
                                extraType: 'c6',
                                zPos: 0,
                                isError: false
                            };
                            details.push(c6Detail);
                        }
                    }
                });

                return {
                    totalDamage,
                    details,
                    eleDmg,
                    coeff: sdCoeff,
                    userBuffs,
                    startTime: offset,
                    endTime,
                    constellation,
                    totalDuration // 完整循环总耗时
                };
            }

            // ---------- 更新显示 ----------
            function updateTotalDisplay() {
                const result = computeFull();
                const total = result.totalDamage;
                totalDisplay.textContent = total.toFixed(0);

                const start = result.startTime || 0;
                const duration = result.totalDuration || 0;
                const totalTime = start + duration;
                let dps = 0;
                if (totalTime > 0) {
                    dps = total / totalTime;
                }
                dpsDisplay.textContent = `DPS: ${dps.toFixed(1)}`;

                saveData();
                updateSeqPreview();
            }

            function updateEleDmgDisplay() {
                const coeff = parseFloat(sdCoeffInput.value);
                const sdCoeff = isNaN(coeff) ? 1.0 : coeff;
                const eleDmg = getTraditionalDmgByCoefficient(sdCoeff);
                eleDmgDisplay.value = (eleDmg * 100).toFixed(0) + '%';
            }

            // ---------- 更新序列预览（含总时长） ----------
            function updateSeqPreview() {
                const input = skillSequenceInput.value || '';
                const parsed = parseSkillSequence(input);
                const constellation = constellationSelect.value;
                const durations = getDurations();
                let html = '';
                if (parsed.length === 0) {
                    html = '<span style="color:#8b949e;">⏳ 请输入技能序列</span>';
                } else {
                    const hasError = parsed.some(p => p.type === 'error');
                    if (hasError) {
                        html += '<span style="color:#f85149;">⚠️ 存在无法识别的技能: </span>';
                        parsed.forEach((p, idx) => {
                            if (p.type === 'error') {
                                html += `<span class="seq-skill error">${p.raw}</span>`;
                            } else {
                                html += `<span class="seq-skill ${p.type}">${p.raw}</span>`;
                            }
                            if (idx < parsed.length - 1) html += ' ';
                        });
                    } else {
                        let eCount = 0,
                            zCount = 0;
                        parsed.forEach((p, idx) => {
                            let label = p.raw;
                            if (p.type === 'e') { eCount++;
                                label = `e${eCount}`; }
                            if (p.type === 'z') { zCount++;
                                label = `z${zCount}`; }
                            const cls = p.type === 'start' ? 'start' : p.type;
                            html += `<span class="seq-skill ${cls}">${label}</span>`;
                            if (idx < parsed.length - 1) html += ' → ';
                        });
                        let totalTime = 0;
                        parsed.forEach(p => {
                            if (p.type === 'start') totalTime += durations.start || 0.5;
                            else if (p.type === 'z') totalTime += durations.z || 1.0;
                            else if (p.type === 'e') totalTime += durations.e || 1.0;
                            else if (p.type === 'q') totalTime += durations.q || 1.5;
                        });
                        html += ` &nbsp; <span style="color:#8b949e;font-size:12px;">(总时长 ${totalTime.toFixed(1)}s)</span>`;
                    }
                }
                seqPreview.innerHTML = html;
            }

            // ---------- 重置序列 ----------
            function resetSequence() {
                const constellation = constellationSelect.value;
                const def = getDefaultSequence(constellation);
                skillSequenceInput.value = def;
                updateSeqPreview();
                saveData();
            }

                lines.push(`  攻击力%加成: ${atkPercent.toFixed(2)} (即 ${(atkPercent*100).toFixed(0)}%)`);
                lines.push(`  基础暴击率: ${parseFloat(critRateInput.value) || 0}`);

                lines.push(`  暴伤: ${parseFloat(critDmgInput.value) || 0}`);
                lines.push(`  元素精通: ${parseFloat(emInput.value) || 0}`);
                lines.push(`  星超导系数: ${coeff}  → 传统增伤识别: ${(eleDmg * 100).toFixed(0)}%`);
                lines.push(`  基础提升%: ${parseFloat(baseBuffInput.value) || 0}`);
                lines.push(`  星超导爆伤加成(基础): ${parseFloat(sdCritDmgInput.value) || 0}`);
                lines.push(`  星超导增伤加成(基础): ${parseFloat(sdDmgBonusInput.value) || 0}`);
                if (isC1plus) lines.push(`  ★ C1+ 固定星超导增伤: +30% (额外攻击不生效)`);
                if (isC2plus) lines.push(`  ★ C2+ z技能星超导爆伤循环: 1:+60%,2:+80%,3-6:+100%,7:+60%,8:+80%,9-12:+100%`);
                if (isC4plus) lines.push(`  ★ C4+ 额外攻击: 倍率2=1.25, 首次起手后触发, 每4s一次, 不吃C1/C2/星超导爆伤`);

                        lines.push(`  精通乘区 = ${d.emFactor.toFixed(4)}  反应系数 = ${d.sdReactionCoeff}`);
                        lines.push(
                            `  星超导伤 = ${d.totalAtk.toFixed(2)}×${d.modifiedM2.toFixed(4)}×${d.finalBaseBuff.toFixed(4)}×${d.emFactor.toFixed(4)}×${d.sdReactionCoeff}×${d.critFactorSd.toFixed(4)}×${d.resistMultiplier.toFixed(4)}×${d.ascendMultiplier.toFixed(4)} = ${d.dmg2.toFixed(2)}`
                            );
                        lines.push(
                            `  该次总伤 = ${d.dmg1.toFixed(2)} + ${d.dmg2.toFixed(2)} + ${d.flatDmgApplied.toFixed(2)} = ${d.total.toFixed(2)}`
                            );
                    });
                    lines.push(`\n───────────────────────────────────────────────`);
                    const totalDmg = result.totalDamage;
                    const totalTime = startTime + totalDuration;
                    const dps = totalTime > 0 ? totalDmg / totalTime : 0;
                    lines.push(`  共 ${eventCount} 个伤害事件，总伤害: ${totalDmg.toFixed(0)}`);
                    lines.push(`  总时间 = 起始${startTime.toFixed(2)}s + 循环耗时${totalDuration.toFixed(2)}s = ${totalTime.toFixed(2)}s`);
                    lines.push(`  DPS = ${totalDmg.toFixed(0)} / ${totalTime.toFixed(2)} = ${dps.toFixed(1)}`);
                }
                lines.push('═══════════════════════════════════════════════');
                return lines.join('\n');
            }

            function showFlowModal() {
                modalContent.textContent = generateFlowText();
                modalOverlay.classList.add('active');
            }

            function closeModal() {
                modalOverlay.classList.remove('active');
            }

            // ---------- 事件绑定 ----------
            calcBtn.addEventListener('click', function() {
                updateTotalDisplay();
                saveData();
            });
            showFlowBtn.addEventListener('click', showFlowModal);
            modalCloseBtn.addEventListener('click', closeModal);
            modalOverlay.addEventListener('click', function(e) {
                if (e.target === modalOverlay) closeModal();
            });

            addBuffBtn.addEventListener('click', addBuff);
            toggleBuffBtn.addEventListener('click', toggleBuffManager);
            resetSeqBtn.addEventListener('click', resetSequence);

            // 监听所有参数变化（仅保存数据、更新预览，不计算）
            const allParamInputs = document.querySelectorAll('.param-grid input, .param-grid select');
            allParamInputs.forEach(el => {
                el.addEventListener('input', function() {
                    updateEleDmgDisplay();
                    if (el.id !== 'skillSequence') {
                        saveData();
                        if (el.id === 'constellation') {
                            const currentSeq = skillSequenceInput.value;
                            const oldDefault = getDefaultSequence(el.value === 'c0' ? 'c1' : 'c0');
                            if (currentSeq === oldDefault || currentSeq.trim() === '') {
                                skillSequenceInput.value = getDefaultSequence(el.value);
                                updateSeqPreview();
                            }
                        }
                    }
                });
                el.addEventListener('change', function() {
                    updateEleDmgDisplay();
                    if (el.id !== 'skillSequence') {
                        saveData();
                        if (el.id === 'constellation') {
                            const currentSeq = skillSequenceInput.value;
                            const oldDefault = getDefaultSequence(el.value === 'c0' ? 'c1' : 'c0');
                            if (currentSeq === oldDefault || currentSeq.trim() === '') {
                                skillSequenceInput.value = getDefaultSequence(el.value);
                                updateSeqPreview();
                            }
                        }
                    }
                });
            });

            // 耗时输入单独监听（只保存和更新预览）
            const durationInputs = [startDurationInput, zDurationInput, eDurationInput, qDurationInput];
            durationInputs.forEach(inp => {
                inp.addEventListener('input', function() {
                    updateSeqPreview();
                    saveData();
                });
                inp.addEventListener('change', function() {
                    updateSeqPreview();
                    saveData();
                });
            });

            // 技能序列输入（只保存和更新预览）
            skillSequenceInput.addEventListener('input', function() {
                updateSeqPreview();
                saveData();
            });

            sdCoeffInput.addEventListener('input', function() {
                updateEleDmgDisplay();
                saveData();
            });

            // ---------- 初始化 ----------
            window.addEventListener('DOMContentLoaded', function() {
                const loaded = loadData();
                if (!loaded) {
                    initDefaultBuffs();
                    const def = getDefaultSequence(constellationSelect.value);
                    skillSequenceInput.value = def;
                } else {
                    renderBuffTable();
                    if (!skillSequenceInput.value || skillSequenceInput.value.trim() === '') {
                        skillSequenceInput.value = getDefaultSequence(constellationSelect.value);
                    }
                }
                updateEleDmgDisplay();
                updateSeqPreview();
                updateTotalDisplay();
                buffManager.style.display = 'none';
                toggleBuffBtn.textContent = '展开';
            });

        })();
    </script>
</body>
</html>
