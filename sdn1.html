<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <link rel="icon" href="资料库.png">
    <link rel="preconnect" href="https://yuhuazhe.github.io" crossorigin>
    <link rel="dns-prefetch" href="https://yuhuazhe.github.io">
    <link rel="preload" href="1.1.png" as="image" type="image/png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>羽化哲</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts/dist/echarts.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: transparent url("zhanshi/1.png") center / cover fixed;
            color: #eee;
            max-width: 1050px;
            margin: 0 auto;
            padding: 30px 20px;
            position: relative;
            overflow-x: hidden;
        }
        /* 全屏水印 - 修复兼容，稳定显示 */
        .watermark {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 9999;
            background-image: url('data:image/svg+xml;utf8,<svg width="260" height="180" xmlns="http://www.w3.org/2000/svg"><text x="0" y="90" font-size="36" fill="white" opacity="0.12" transform="rotate(-28 130 90)">羽化哲</text></svg>');
            background-repeat: repeat;
        }
        h1 {
            color: #decb60;
            font-size: 32px;
            text-align: center;
            margin-bottom: 10px;
        }
        h3 {
            color: #d6f1ff;
            font-size: 20px;
            text-align: center;
            margin-bottom: 30px;
        }
        h6 {
            color: #ffffff !important;
            font-size: 20px;
            text-align: center;
            margin: 0 0 4px 0 !important;
        }
        .title-desc {
            display: block;
            font-size: 14px;
            color: #a0c8e8;
            opacity: 0.75;
            text-align: center;
            margin: 0 auto 30px;
        }
        .chart-wrapper {
            position: relative;
            width: 100%;
            height: 68vh;
            min-height: 420px;
            margin: 0 auto 40px;
        }
        #chart-wrap {
            width: 100%;
            height: 100%;
            background: transparent;
        }
        .chart-note {
            position: absolute;
            top: 5px;
            right: 10px;
            width: 220px;
            padding: 10px 14px;
            background: rgba(107, 120, 135, 0.75);
            border: 1px solid rgba(103, 103, 197, 0.3);
            border-radius: 6px;
            z-index: 10;
        }
        .note-title {
            font-size: 14px;
            color: #e0e0e0;
            margin-bottom: 6px;
            border-bottom: 1px solid rgba(147, 142, 193, 0.25);
            padding-bottom: 4px;
        }
        .note-text {
            font-size: 12px;
            color: #cccccc;
            line-height: 1.6;
        }
        @media screen and (max-width: 768px) {
            .chart-wrapper {
                height: 50vh;
                min-height: 320px;
            }
            .chart-note {
                width: 140px;
                padding: 6px 10px;
            }
            .note-title {
                font-size: 12px;
            }
            .note-text {
                font-size: 10px;
            }
            h1 {
                font-size: 24px;
            }
            h3 {
                font-size: 16px;
            }
            .watermark {
                background-image: url('data:image/svg+xml;utf8,<svg width="180" height="120" xmlns="http://www.w3.org/2000/svg"><text x="0" y="60" font-size="24" fill="white" opacity="0.12" transform="rotate(-28 90 60)">羽化哲</text></svg>');
            }
        }
    </style>
</head>
<body>
    <!-- 水印DOM元素，稳定渲染 -->
    <div class="watermark"></div>

    <h1>6.7版本桑多涅武器差距对比</h1>
    
    
    <div class="chart-wrapper">
        <div id="chart-wrap"></div>
        <div class="chart-note">
            <div class="note-title">配队备注</div>
            <div class="note-text">
                计算队伍：v5木偶八重北斗猫猫<br>
                数据以专武为100%基准<br>
                数据仅供参考！！！
            </div>
        </div>
    </div>
<script>
let myChart;
const dataList = [
    { name: "专武", team: 100, single: 100.00 },
    { name: "火专", team: 91.18, single: 88.92 },
    { name: "无工", team: 89.65, single: 87.66 },
    { name: "苇海", team: 86.55, single: 83.74 },
    { name: "狼末", team: 85.89, single: 82.90 },
    { name: "赤角", team: 85.77, single: 82.75 },
    { name: "山王", team: 83.26, single: 79.58 },
    { name: "裁断", team: 82.44, single: 78.54 },
    { name: "法专", team: 80.86, single: 76.54 },
    { name: "饰铁之花", team: 80.77, single: 76.44 },
    { name: "浪影阔剑", team: 80.29, single: 75.83 },
    { name: "聊聊", team: 74.47, single: 68.47 },
    { name: "赤骨", team: 72.14, single: 65.53 }
];
function initChart() {
    if (myChart) myChart.dispose();
    const weaponNames = dataList.map(item => item.name);
    const teamData = dataList.map(item => item.team);
    const singleData = dataList.map(item => item.single);
    const chartDom = document.getElementById('chart-wrap');
    myChart = echarts.init(chartDom, null, {
        renderer: 'canvas',
        backgroundColor: 'transparent'
    });
    const hatchPattern = {
        image: 'data:image/svg+xml;utf8,<svg width="10" height="10" xmlns="http://www.w3.org/2000/svg"><line x1="0" y1="10" x2="10" y2="0" stroke="%23666" stroke-width="1.2" /></svg>',
        repeat: 'repeat'
    };
    function getChartBaseOption() {
        const isMobile = window.innerWidth <= 768;
        return {
            backgroundColor: 'transparent',
            tooltip: {
                trigger: 'axis',
                axisPointer: { type: 'shadow' },
                backgroundColor: 'rgba(12,12,20,0.82)',
                borderColor: 'rgba(180,180,180,0.3)',
                borderWidth: 1,
                textStyle: { color: '#f2f2f2', fontSize: isMobile ? 11 : 13 },
                formatter(params) {
                    return `${params[0].axisValue}<br />单人比例：${params[0].data}%<br />全队比例：${params[1].data}%`;
                }
            },
            legend: {
                data: [
                    {
                        name: '单人比例%',
                        itemStyle: {
                            color: hatchPattern,
                            borderColor: '#666666',
                            borderWidth: 1.5
                        }
                    },
                    {
                        name: '全队比例%',
                        itemStyle: {
                            color: 'transparent',
                            borderColor: '#cccccc',
                            borderWidth: 1.5
                        }
                    }
                ],
                top: isMobile ? 4 : 8,
                left: 'center',
                textStyle: { color: '#e2e2e2', fontSize: isMobile ? 12 : 14 },
                itemWidth: isMobile ? 14 : 18,
                itemHeight: isMobile ? 8 : 10
            },
            grid: {
                left: isMobile ? '16%' : '10%',
                right: isMobile ? '6%' : '10%',
                top: isMobile ? '18%' : '20%',
                bottom: isMobile ? '24%' : '18%',
                backgroundColor: 'transparent',
                borderColor: 'transparent'
            },
            xAxis: {
                type: 'category',
                axisLabel: {
                    color: '#cccccc',
                    rotate: isMobile ? 50 : 42,
                    fontSize: isMobile ? 9 : 10.5
                },
                axisLine: { lineStyle: { color: 'rgba(0,0,0,0)' } },
                splitLine: { show: false },
                axisTick: { lineStyle: { color: 'rgba(0,0,0,0)' } }
            },
            yAxis: {
                type: 'value',
                name: '伤害比例百分比 %',
                nameTextStyle: { color: '#bbbbbb', fontSize: isMobile ? 11 : 13 },
                max: 105,
                axisLine: { lineStyle: { color: 'rgba(0,0,0,0)' } },
                splitLine: {
                    show: true,
                    lineStyle: { color: 'rgba(0,0,0,0)', width: 1 }
                },
                axisLabel: { color: '#bbbbbb', fontSize: isMobile ? 10 : 11 },
                axisTick: { lineStyle: { color: 'rgba(0,0,0,0)' } }
            },
            series: [
                {
                    name: '单人比例%',
                    type: 'bar',
                    barWidth: isMobile ? '32%' : '36%',
                    barGap: '12%',
                    itemStyle: {
                        borderRadius: [4, 4, 0, 0],
                        color: hatchPattern,
                        borderColor: '#666666',
                        borderWidth: 1.5,
                        shadowBlur: 0
                    },
                    label: {
                        show: true,
                        position: 'top',
                        color: '#e8e8e8',
                        fontSize: isMobile ? 8 : 10,
                        formatter: '{c}%',
                        textShadowColor: 'rgba(0,0,0,0.6)',
                        textShadowBlur: 2
                    }
                },
                {
                    name: '全队比例%',
                    type: 'bar',
                    barWidth: isMobile ? '32%' : '36%',
                    itemStyle: {
                        borderRadius: [4, 4, 0, 0],
                        color: 'transparent',
                        borderColor: '#cccccc',
                        borderWidth: 1.5,
                        shadowBlur: 0
                    },
                    label: {
                        show: true,
                        position: 'top',
                        color: '#f5f5f5',
                        fontSize: isMobile ? 8 : 10,
                        formatter: '{c}%',
                        textShadowColor: 'rgba(0,0,0,0.6)',
                        textShadowBlur: 2
                    }
                }
            ]
        };
    }
    const option = getChartBaseOption();
    option.xAxis.data = weaponNames;
    option.series[0].data = singleData;
    option.series[1].data = teamData;
    myChart.setOption(option);
}
initChart();
window.addEventListener('resize', () => {
    if (!myChart) return;
    const newOpt = getChartBaseOption();
    newOpt.xAxis.data = dataList.map(item => item.name);
    newOpt.series[0].data = dataList.map(item => item.single);
    newOpt.series[1].data = dataList.map(item => item.team);
    myChart.setOption(newOpt);
    myChart.resize();
});
</script>
</body>
</html>
