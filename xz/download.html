<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>软件下载中心</title>
<style>
  :root{
    --bg:#0f1116;
    --panel:#171a21;
    --line:#262b36;
    --txt:#e6e9ef;
    --dim:#8f97a8;
    --brand:#4f7cff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif;
    background:var(--bg);color:var(--txt);
    padding:44px 20px;
    font-size:14px;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:900px;margin:0 auto}

  h1{font-size:19px;font-weight:600;margin-bottom:6px}
  .sub{font-size:13px;color:var(--dim);margin-bottom:22px}

  table{width:100%;border-collapse:collapse;background:var(--panel);
        border:1px solid var(--line);border-radius:10px;overflow:hidden}
  th{
    text-align:left;font-size:12px;font-weight:600;color:var(--dim);
    padding:11px 16px;border-bottom:1px solid var(--line);white-space:nowrap;
  }
  td{padding:15px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
  tr:last-child td{border-bottom:0}

  .name{font-weight:600}
  .desc{font-size:12.5px;color:var(--dim);margin-top:3px;line-height:1.5}
  .meta{font-size:12.5px;color:var(--dim);white-space:nowrap}
  .col-act{text-align:right;width:150px}

  .dl{
    font-family:inherit;font-size:13px;font-weight:600;color:#fff;
    background:var(--brand);border:0;border-radius:7px;
    padding:9px 16px;cursor:pointer;white-space:nowrap;
  }
  .dl:hover{background:#3f6bff}
  .dl:disabled{background:#39415a;color:#9aa3b8;cursor:default}

  /* 下载失败提示：平时占位 0 高度，只有出错才显形 */
  .err{margin-top:10px;font-size:12.5px;color:#f87171;line-height:1.6;min-height:0}
  .err:empty{display:none}

  .tip{margin-top:16px;font-size:12.5px;color:var(--dim)}

  /* 窄屏：表格转成卡片式堆叠 */
  @media (max-width:640px){
    body{padding:28px 14px}
    thead{display:none}
    tr{display:block;border-bottom:1px solid var(--line)}
    tr:last-child{border-bottom:0}
    td{display:block;border:0;padding:4px 16px}
    td:first-child{padding-top:15px}
    td:last-child{padding-bottom:15px}
    .col-act{text-align:left;width:auto;padding-top:12px}
    .dl{width:100%}
  }
</style>
</head>
<body>
<div class="wrap">

  <h1>软件下载中心</h1>
  <p class="sub">点击右侧「下载」获取 .exe 安装包</p>

  <table>
    <thead>
      <tr>
        <th>程序</th>
        <th>版本 / 平台</th>
        <th>大小</th>
        <th class="col-act">下载</th>
      </tr>
    </thead>
    <tbody id="list">

      <!--
        ===== 加程序：复制下面整段 <tr> 追加到 </tr> 后面，改内容即可 =====

        data-file  真正去下载的地址，三种写法任选：
                    ① 只写文件名   data-file="setup.exe"
                       → exe 与 download.html 在同一个目录
                    ② 绝对路径     data-file="/xz/setup.exe"
                       → 以网站根目录为起点，子目录部署时最稳
                    ③ 完整网址     data-file="https://yuhuazhe.cn/xz/setup.exe"

        ⚠ 文件名建议只用 ASCII（字母、数字、连字符）。
          中文或空格文件名在部分静态托管的 URL 编码环节会取不到文件，
          浏览器提示「无法下载 - 没有文件」，但服务器上明明有。

        data-name  下载后保存到本地的文件名，可以和 data-file 不同，
                   所以 exe 换成 ASCII 名后，用户保存下来仍是中文名。
      -->
      <tr>
        <td>
          <div class="name">原神BUFf排轴工具</div>
          <div class="desc">用于模拟排轴流程实用工具</div>
        </td>
        <td class="meta">v2.1<br>Windows 10/11 · 64 位</td>
        <td class="meta">157 KB</td>
        <td class="col-act">
          <button class="dl" type="button"
                  data-file="yuanshen-buff-tool.exe"
                  data-name="原神BUFf排轴工具.exe">下载</button>
          <div class="err"></div>
        </td>
      </tr>

    </tbody>
  </table>

  <p class="tip">安装包已代码签名，下载后建议核对文件大小与数字签名。</p>
</div>

<script>
/* 用事件委托，所以以后自己加多少行 <tr> 都不用改这段脚本。 */

// 把 data-file 里的中文、空格转成 %XX，避免托管平台在编码环节丢文件
function toURL(s){
  if (/^https?:\/\//i.test(s) || s.charAt(0) === "/") return encodeURI(s);
  return s.split("/").map(encodeURIComponent).join("/");
}

// 触发浏览器下载
function fire(url, name){
  var a = document.createElement("a");
  a.href = url;
  a.download = name || "";
  a.rel = "noopener";
  a.style.display = "none";
  document.body.appendChild(a);
  a.click();
  a.remove();
}

// 先问服务器这个文件在不在，再决定要不要真的下
function exists(url){
  return fetch(url, { method: "HEAD", cache: "no-store" })
    .then(function (r) {
      // r.ok=false 且拿到了 HTTP 状态码，说明文件确实不在
      return { missing: !r.ok, status: r.status };
    })
    .catch(function () {
      // 跨域或网络异常，无法判断，就交给浏览器正常下载，不误报
      return { missing: false, status: 0 };
    });
}

document.getElementById("list").addEventListener("click", function (e) {
  var btn = e.target.closest(".dl");
  if (!btn || btn.disabled) return;

  var raw   = btn.dataset.file;
  var url   = toURL(raw);
  var name  = btn.dataset.name || decodeURIComponent(url.split(/[\\/]/).pop());
  var errEl = btn.parentNode.querySelector(".err");

  btn.disabled = true;
  btn.textContent = "下载中…";
  errEl.textContent = "";

  exists(url).then(function (res) {
    if (res.missing) {
      errEl.textContent = "下载失败（HTTP " + res.status + "）：服务器上找不到 " + name +
                          "，请确认文件已提交到 " + (location.pathname.replace(/[^/]*$/, "") || "/") +
                          " 目录，且大小写与名称完全一致。";
    } else {
      fire(url, name);
    }
    btn.disabled = false;
    btn.textContent = "下载";
  });
});
</script>
</body>
</html>
